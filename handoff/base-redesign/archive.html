const cabinet=document.querySelector('#cabinet'),nav=document.querySelector('#shortcuts'),dialog=document.querySelector('#modal');let active=0,last=null;
function pic(src,cls){const im=new Image();im.src=art[src];im.alt='';im.className=cls;im.draggable=false;return im}
function place(el,i){Object.assign(el.style,{left:([30,454,878][i%3]/1308*100)+'%',top:((i<3?60:484)/952*100)+'%',width:(400/1308*100)+'%',height:(400/952*100)+'%'})}
sections.forEach((s,i)=>{const btn=document.createElement('button');btn.type='button';btn.className='cell';btn.setAttribute('aria-label',s.name+'，点选查看摘要，回车直接打开');place(btn,i);if(s.piece){btn.append(pic(s.piece,'object'))}else{btn.append(pic('column','column one'),pic('column','column two'),pic('spy','relic'))}
const label=document.createElement('span');label.className='label';label.textContent=s.name;btn.append(label);cabinet.append(btn);
btn.onclick=()=>choose(i);btn.ondblclick=()=>show(i);btn.onkeydown=e=>{const delta={ArrowRight:1,ArrowLeft:-1,ArrowUp:-3,ArrowDown:3}[e.key];if(delta!==undefined){e.preventDefault();const next=i+delta;const target=(next<0||next>4||(delta===1&&i===2)||(delta===-1&&i===3))?i:next;choose(target);cabinet.children[target].focus()}if(e.key==='Enter'){e.preventDefault();show(i)}};

function put(id,value){document.getElementById(id).textContent=value}
function choose(i){active=i;const s=sections[i];[...cabinet.querySelectorAll('button')].forEach((b,j)=>{b.classList.toggle('selected',i===j);b.setAttribute('aria-pressed',i===j?'true':'false')});

function modal(title,lines,foot){last=document.activeElement;put('dialogTitle',title);const body=document.querySelector('#dialogBody');body.replaceChildren();const ul=document.createElement('ul');lines.forEach(x=>{const li=document.createElement('li');li.textContent=x;ul.append(li)});body.append(ul);const p=document.createElement('p');p.textContent=foot;body.append(p);dialog.showModal();document.querySelector('#close').focus()}
