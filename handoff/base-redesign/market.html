document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;idx=page=0;msg=''}else if(b.dataset.item!==undefined){idx=Number(b.dataset.item);msg=''}else switch(b.id){case 'next':page++;idx=page*6;msg='';break;case 'prev':page--;idx=page*6;msg='';break;case 'purchase':{const id=data()[idx];funds-=I[id].price;if(isLoose()){sold.add(idx);locked.delete(idx)}msg=I[id].name+'已送入仓库';break}case 'lock':locked.has(idx)?locked.delete(idx):locked.add(idx);break;case 'reroll':funds-=refreshCost();refreshes++;loose=loose.map((id,i)=>locked.has(i)?id:pool[(i+refreshes*3)%pool.length]);sold.clear();msg='未锁定货位已换货';break;default:return}render()});render();
