<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基地界面设计评审</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#211e1a;color:#f5eddc;font:16px "Noto Sans CJK SC",sans-serif}main{max-width:1336px;margin:auto;padding:18px 24px}header,nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px}h1{font:600 24px Georgia,serif;margin:0 auto 0 0}nav{margin:16px 0 10px}button{font:inherit;background:#332e26;color:inherit;border:1px solid #786953;padding:7px 16px;cursor:pointer}button[aria-pressed=true]{background:#e0c9a2;color:#30251c}button:focus-visible,a:focus-visible{outline:3px solid #ffce64;outline-offset:2px}#box{position:relative;width:100%;aspect-ratio:8/5;overflow:hidden;background:#171512;border:1px solid #70634c}iframe{width:1280px;height:800px;transform-origin:top left;position:absolute;inset:0;border:0}img{width:100%;height:100%;object-fit:contain}p{color:#e2d5bc;line-height:1.55}a{color:#f1d2a0;font-size:15px}
</style>
<main><header><h1>基地界面设计评审</h1><button id="old">现版实机</button><button id="proposal">设计提案</button></header>
<nav aria-label="基地页面"></nav><div id="box"><iframe title="当前页面的交互原型"></iframe><img hidden alt="同一位置的现版实机截图"></div><p><span id="note"></span>　<a id="full" target="_blank">独立打开此页</a></p></main>
<script>
const pages=[
 ['expedition','expedition','出征','看军功碑、营门和出发操作三者的先后关系。'],
 ['warehouse','warehouse','仓库','沿着带回物资、整理入库和定位已有物品的顺序读一遍。'],
 ['archive','shelf','书架','用陈列物辨认档案种类，再看它能告诉你多少进度。'],
 ['market','market','市场','分别定位货品、价格和会花费金币的操作。'],
 ['smithy','smithy','铁匠','选配方后，确认材料、工钱与锻造动作是否能一起读到。']];
const $=s=>document.querySelector(s);
let current=Math.max(0,pages.findIndex(p=>p[0]===location.hash.slice(1))),isOld=false;
function show(){
 const [page,shot,label,note]=pages[current];
 if($('iframe').getAttribute('src')!==page+'.html')$('iframe').src=page+'.html';
 $('iframe').hidden=isOld;$('img').hidden=!isOld;$('img').src='../art-review/game-station-'+shot+'.jpg';
 $('#note').textContent=note;$('#full').href=isOld?$('img').src:$('iframe').src;
 $('#old').setAttribute('aria-pressed',isOld);$('#proposal').setAttribute('aria-pressed',!isOld);
 [...$('nav').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===current));
}
pages.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p[2];b.onclick=()=>{current=i;history.replaceState(null,'','#'+p[0]);show()};$('nav').append(b)});
window.addEventListener('hashchange',()=>{current=Math.max(0,pages.findIndex(p=>p[0]===location.hash.slice(1)));isOld=false;show()});
$('#proposal').onclick=()=>{isOld=false;show()};$('#old').onclick=()=>{isOld=true;show()};
new ResizeObserver(()=>{$('iframe').style.transform='scale('+$('#box').clientWidth/1280+')'}).observe($('#box'));show();
</script></html>
