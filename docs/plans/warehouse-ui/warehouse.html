<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>仓库 · 基地界面设计稿</title><style>
*{box-sizing:border-box}body{margin:0;background:#29201b;color:#f0dfbe;font:16px "Noto Sans CJK SC",sans-serif}main{position:relative;height:100vh;min-height:680px;background:center/cover url(../background-repaint/base-hall/09-final.png);overflow:hidden}button,select{font:inherit;color:inherit;cursor:pointer}h1,h2,h3,p{margin:0}h1,h2,h3,.nav button,.action,.trayhead,.back{font-family:"Noto Serif CJK SC",serif}.wood,.nav button,.back{background:repeating-linear-gradient(2deg,#ffffff04 0px 1px,transparent 2px 8px),linear-gradient(125deg,#533b2c,#38291f 65%,#32251e);border:1px solid #866343;box-shadow:inset 0 1px #b38d6166,0 4px 9px #140c0990}.nav{position:absolute;top:4%;left:1.6%;width:11%;display:grid;gap:7px}.nav button{color:#e8d7b7;text-align:left;height:44px;padding-left:13%;font-size:19px;letter-spacing:.12em}.nav button.on{color:#35251b;background:linear-gradient(110deg,#dfc696,#c2a477);border-left:5px solid #a34d32;padding-left:calc(13% - 4px)}.nav i{display:inline-block;width:24px;font:normal 18px serif;color:#c6a16d}.nav .on i{color:#704931}.paper{position:absolute;left:17%;width:17.2%;top:3%;background:repeating-linear-gradient(105deg,#ffefd303 0 1px,transparent 1px 4px),linear-gradient(105deg,#e0ca9f,#d2bd96 60%,#c8af85);border:5px solid #4c3626;box-shadow:inset 0 0 0 1px #aa8a5d,0 4px 14px #1a0d0baa;color:#37291e;padding:17px 14px 15px}.paper h2{font-size:23px;letter-spacing:.13em}.rule{height:1px;background:#9c835b;margin:12px 0}.field{display:block;font-size:13px;font-weight:bold;color:#5b4834;margin:11px 0 5px}.paper select,.small,.action{width:100%;border:1px solid #99815f;background:#e8d6b3;padding:6px 8px;text-align:left;border-radius:2px}.check{display:flex;align-items:center;justify-content:space-between;margin:12px 0;font-size:14px}.check label{display:flex;align-items:center;gap:5px}.check input{accent-color:#89432e}.clear{border:none;background:none;font-size:13px;color:#716556}.action{text-align:center;color:#fff0d3;background:linear-gradient(#994b33,#793723);border:1px solid #723c29;font-size:18px;font-weight:bold}.small{text-align:center;margin-top:7px;background:#cfb891}.action:hover{box-shadow:inset 0 0 0 2px #dcab76}.action:active{background:#703621;transform:translateY(1px)}.action:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid #efbd74;outline-offset:2px}.rack{position:absolute;left:42.8%;top:8.2%;width:5.5%;text-align:center;font:17px "Noto Serif CJK SC";padding:8px 5px}.rack div{height:51px;background:#322922;border:1px dashed #927858;margin-top:7px}.tray{position:absolute;left:50%;width:48.3%;top:5.2%;padding:10px 12px 13px}.trayhead{display:flex;align-items:baseline;justify-content:space-between;padding:0 3px 8px;border-bottom:1px solid #896742}.trayhead h1{font-size:26px;letter-spacing:.15em}.trayhead span{font:14px "Noto Sans CJK SC";color:#d7bd97}.inside{display:flex;gap:7px;margin-top:9px}.tabs{width:36px;display:grid;grid-template-rows:repeat(7,1fr);gap:3px}.tabs button{background:#45372c;border:1px solid #66513d;color:#b6a58e;font:14px Georgia}.tabs .current{background:#c9ad7d;color:#31271f;border-color:#cfb180}.tabs small{display:block;font:10px sans-serif;color:#aa9780}.grid{flex:1;aspect-ratio:10/8;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(8,1fr);background:#615042;gap:1px;border:1px solid #584638}.cell{grid-area:var(--area);background:#382f28}.item{grid-area:var(--area);position:relative;display:grid;place-items:center;background:linear-gradient(130deg,#4e4133,#41362c);border:0;padding:3px;z-index:1}.item img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;padding:5px;filter:drop-shadow(1px 2px 1px #20170f)}.item:hover{box-shadow:inset 0 0 0 1px #c29766}.item.sel{background:#66503a;box-shadow:inset 0 0 0 2px #dcb278}.sel:after{content:'◆';position:absolute;bottom:1px;right:3px;color:#f1cf91;font-size:9px}.trayfoot{display:flex;align-items:center;min-height:28px;padding:7px 0 0 43px;font-size:13px;color:#e9d1ae}.back{position:absolute;bottom:3%;right:1.8%;color:#e4cfaa;padding:9px 20px}.hint{position:absolute;right:1.8%;top:.8%;font-size:12px;color:#e3cfad;text-shadow:1px 1px #25160e}.value{filter:grayscale(1)}.value *{background-image:none!important;box-shadow:none!important}.value main{background-image:url(../background-repaint/base-hall/09-final.png)!important}.value .wood,.value .nav button,.value .back{background-color:#463a31}.value .nav button.on,.value .paper{background-color:#cbb994}.value .item{background-color:#514737}.value .action{background-color:#874731}.value .item.sel{outline:2px solid #d5bc8c;outline-offset:-2px}
</style><main><nav class="nav"></nav><section class="paper"><h2>筛选</h2><div class="rule"></div><label class="field" for="tag">标签</label><select id="tag"><option>不限标签</option></select><label class="field" for="type">分类</label><select id="type"><option>全部</option></select><div class="check"><label><input type="checkbox">只看收藏</label><button class="clear" disabled>清除</button></div><div class="rule"></div><button class="action">快速出售</button><button class="small">整理</button></section><aside class="rack wood">包架<div></div></aside><section class="tray wood"><header class="trayhead"><h1>仓库</h1><span>第 I 库　·　9 件</span></header><div class="inside"><div class="tabs"></div><div class="grid"></div></div><div class="trayfoot" aria-live="polite"></div></section><span class="hint">← 主界面　 F1</span><button class="back">回主菜单</button></main><script>
const q=s=>document.querySelector(s);
['出征','仓库','科技','委托','后勤','书架'].forEach((n,i)=>q('.nav').insertAdjacentHTML('beforeend','<button class="'+(i===1?'on':'')+'"><i>'+['⚑','▦','△','✉︎','⊞','▤'][i]+'</i>'+n+'</button>'));
['I','II','III','IV','V','VI','VII'].forEach((n,i)=>q('.tabs').insertAdjacentHTML('beforeend',i?'<button disabled>'+n+'<small>锁定</small></button>':'<button class="current">I</button>'));
for(let y=1;y<=8;y++)for(let x=1;x<=10;x++)q('.grid').insertAdjacentHTML('beforeend','<span class="cell" style="--area:'+y+'/'+x+'/span 1/span 1"></span>');
const items=[['sword','短剑',1,3],['box','木箱',2,1],['letter','文书',3,1],['leather','皮片',4,1],['dagger','匕首',5,2],['letter','文书',6,1],['box','木箱',7,1],['sword','短剑',8,3],['stone','磨石',9,2]];
for(const [key,name,x,h] of items){const b=document.createElement('button');b.className='item';b.style.setProperty('--area','1/'+x+'/span '+h+'/span 1');b.setAttribute('aria-label',name);b.innerHTML='<img alt="" src="items/'+key+'.webp">';b.onclick=()=>{document.querySelectorAll('.item').forEach(o=>{o.classList.toggle('sel',o===b);o.setAttribute('aria-pressed',o===b)});q('.trayfoot').textContent='已选　'+name+'　 ·　 1 × '+h+' 格'};q('.grid').append(b)}
q('.item').click();if(location.search.includes('value'))document.body.className='value';
</script></html>
