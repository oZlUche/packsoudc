<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1720" viewBox="0 0 2400 1720" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">背包搜打撤：各系统怎样互相喂养</title><desc id="d">左边营地：仓库居中，与集市互相买卖，上交给科技，丢给炼金化成万物之尘再给铁匠铺补料，铁匠铺吃素材出成品回仓库；苗圃种出食材给食堂摆一锅；苗圃、食堂、炼金、万神院靠委托声望开放。中间出征三屏：角色食物信仰、带入装备、地图难度。右边一局是循环：走地图、遭遇战、搜刮、背包取舍，再继续深入或去撤离点；压力逼着撤；战斗得经验值升级选牌，奉的神决定神恩牌。撤离或战败都进结算，再回营地开下一局。</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif}</style><rect data-decoration="background" width="2400" height="1720" fill="#191A18"/><text x="90" y="110" font-size="46" fill="#EFEEE7" text-anchor="start" font-weight="600">背包搜打撤：各系统怎样互相喂养</text><text x="90" y="160" font-size="25" fill="#B0B2A8" text-anchor="start" font-weight="400">How the camp, the departure and the run feed one another</text><path data-decoration="rule" d="M90 195H1300" fill="none" stroke="#686E63" stroke-width="1.2"/><rect data-decoration="region" x="90" y="250" width="920" height="900" rx="12" fill="none" stroke="#686E63" stroke-width="1.2"/><text x="124" y="304" font-size="34" fill="#EFEEE7" text-anchor="start" font-weight="500">营地 · 局外</text><rect data-decoration="region" x="1440" y="250" width="890" height="900" rx="12" fill="none" stroke="#686E63" stroke-width="1.2"/><text x="1474" y="304" font-size="34" fill="#EFEEE7" text-anchor="start" font-weight="500">一局 · 局内（核心）</text><text x="1100" y="515" font-size="30" fill="#EFEEE7" text-anchor="start" font-weight="500">出征 · 三屏</text><rect id="rep" data-node="" x="130" y="350" width="840" height="100" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="550.0" y="395" font-size="26" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="rep" data-padding="6">委托与声望</text><text x="550.0" y="427" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="rep" data-padding="6">办委托涨各方声望；虚线框的设施靠声望开放</text><rect id="nursery" data-node="" x="130" y="600" width="200" height="90" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="7 6"/><text x="230.0" y="640" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="nursery" data-padding="6">苗圃</text><text x="230.0" y="672" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="nursery" data-padding="6">每局长一格</text><g data-decoration="board-mark"><rect x="291" y="612" width="27" height="27" fill="none" stroke="#B0B2A8" stroke-width="1.2"/><path d="M300 612V639M309 612V639M291 621H318M291 630H318" stroke="#B0B2A8" stroke-width="1"/></g><rect id="canteen" data-node="" x="430" y="600" width="240" height="90" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="7 6"/><text x="550.0" y="640" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="canteen" data-padding="6">食堂</text><text x="550.0" y="672" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="canteen" data-padding="6">食材摆一锅</text><g data-decoration="board-mark"><rect x="631" y="612" width="27" height="27" fill="none" stroke="#B0B2A8" stroke-width="1.2"/><path d="M640 612V639M649 612V639M631 621H658M631 630H658" stroke="#B0B2A8" stroke-width="1"/></g><rect id="pantheon" data-node="" x="770" y="600" width="200" height="90" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="7 6"/><text x="870.0" y="640" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="pantheon" data-padding="6">万神院</text><text x="870.0" y="672" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="pantheon" data-padding="6">选这局的神</text><rect id="tech" data-node="" x="130" y="780" width="200" height="110" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="230.0" y="816" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="tech" data-padding="6">科技</text><text x="230.0" y="848" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="tech" data-padding="6">永久提升</text><text x="230.0" y="876" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="tech" data-padding="6">设施升级</text><rect id="warehouse" data-node="" x="430" y="780" width="240" height="110" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="550.0" y="830" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="warehouse" data-padding="6">仓库</text><text x="550.0" y="862" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="warehouse" data-padding="6">局外的全部家底</text><g data-decoration="board-mark"><rect x="631" y="792" width="27" height="27" fill="none" stroke="#B0B2A8" stroke-width="1.2"/><path d="M640 792V819M649 792V819M631 801H658M631 810H658" stroke="#B0B2A8" stroke-width="1"/></g><rect id="market" data-node="" x="130" y="1000" width="200" height="90" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="230.0" y="1040" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="market" data-padding="6">集市</text><text x="230.0" y="1072" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="market" data-padding="6">钱 ⇄ 道具</text><rect id="alchemy" data-node="" x="430" y="1000" width="240" height="90" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="7 6"/><text x="550.0" y="1040" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="alchemy" data-padding="6">炼金</text><text x="550.0" y="1072" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="alchemy" data-padding="6">道具化成万物之尘</text><rect id="smithy" data-node="" x="770" y="1000" width="200" height="90" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="870.0" y="1040" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="smithy" data-padding="6">铁匠铺</text><text x="870.0" y="1072" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="smithy" data-padding="6">按配方打造</text><rect id="d1" data-node="" x="1100" y="540" width="240" height="160" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="1220.0" y="599" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="d1" data-padding="6">① 角色·食物·信仰</text><text x="1220.0" y="631" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="d1" data-padding="6">吃掉这一锅</text><text x="1220.0" y="660" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="d1" data-padding="6">奉哪位神</text><rect id="d2" data-node="" x="1100" y="760" width="240" height="100" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="1220.0" y="804" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="d2" data-padding="6">② 带入装备</text><text x="1220.0" y="836" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="d2" data-padding="6">从仓库挑</text><rect id="d3" data-node="" x="1100" y="960" width="240" height="100" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="1220.0" y="1004" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="d3" data-padding="6">③ 地图·难度</text><text x="1220.0" y="1036" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="d3" data-padding="6">选图 · 选 A 级</text><rect id="growth" data-node="" x="1960" y="330" width="300" height="90" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="2110.0" y="370" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="growth" data-padding="6">升级选牌</text><text x="2110.0" y="402" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="growth" data-padding="6">通用牌 + 神恩牌</text><rect id="walk" data-node="" x="1500" y="560" width="260" height="120" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="1630.0" y="600" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="walk" data-padding="6">走地图</text><text x="1630.0" y="632" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="walk" data-padding="6">选路线</text><text x="1630.0" y="662" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="walk" data-padding="6">越深越险，也越肥</text><rect id="fight" data-node="" x="1960" y="560" width="300" height="120" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="2110.0" y="600" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="fight" data-padding="6">遭遇战</text><text x="2110.0" y="632" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="fight" data-padding="6">背包编译成战斗力</text><text x="2110.0" y="662" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="fight" data-padding="6">双方自动对打</text><rect id="loot" data-node="" x="1960" y="820" width="300" height="100" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="2110.0" y="866" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="loot" data-padding="6">搜刮</text><text x="2110.0" y="898" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="loot" data-padding="6">尸体·宝箱·搜索点</text><rect id="bag" data-node="" x="1500" y="820" width="260" height="100" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="1630.0" y="866" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="bag" data-padding="6">背包取舍</text><text x="1630.0" y="898" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="bag" data-padding="6">格子有限：留什么、扔什么</text><g data-decoration="board-mark"><rect x="1721" y="832" width="27" height="27" fill="none" stroke="#B0B2A8" stroke-width="1.2"/><path d="M1730 832V859M1739 832V859M1721 841H1748M1721 850H1748" stroke="#B0B2A8" stroke-width="1"/></g><rect id="exit" data-node="" x="1500" y="1040" width="260" height="80" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="1630.0" y="1076" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="exit" data-padding="6">撤离点</text><text x="1630.0" y="1108" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="exit" data-padding="6">活着出去才算数</text><rect id="pressure" data-node="" x="1960" y="1040" width="300" height="80" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="2110.0" y="1076" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="pressure" data-padding="6">压力</text><text x="2110.0" y="1108" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="pressure" data-padding="6">体力·倒计时·侵蚀·猎手</text><rect id="settle" data-node="" x="1100" y="1230" width="660" height="140" rx="12" fill="#272925" stroke="#EFEEE7" stroke-width="1.6"/><text x="1430.0" y="1280" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="settle" data-padding="6">结算</text><text x="1430.0" y="1312" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="settle" data-padding="6">撤离：所得进仓库 · 委托算数 · 苗圃长一格</text><text x="1430.0" y="1342" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="settle" data-padding="6">战败：带入的与捡到的全丢</text><path id="e-n-c" data-edge="" data-from="nursery" data-to="canteen" d="M330 645L430 645" fill="none