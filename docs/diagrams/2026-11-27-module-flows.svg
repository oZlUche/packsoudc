<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1880" viewBox="0 0 2400 1880" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">这一局带回的，怎样变成下一局的起点</title><desc id="d">存量与回流图。仓库是存量：粗线从仓库经出征关口带入一局，一局是走地图、遭遇战、搜刮、背包取舍的循环。撤离把带出来的东西送回仓库、钱包余额送进营地资金；战败时作战区的东西流失，托付和局外奖励照样入账。营地里，炼金把道具化成尘给铁匠铺补料，铁匠铺吃素材出成品，集市在钱和道具之间互换；科技吃上交、给永久加成；苗圃种食材给食堂，食堂、万神院、科技都在关口前汇入下一局。经验值和升级选牌只在局内。四个提问分别放在关口、永久与每局消耗的对比、背包容量和营地内循环处，底部提示截断一股回流来检查成型速度。</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif}</style><rect data-decoration="background" width="2400" height="1880" fill="#191A18"/><text x="90" y="112" font-size="46" fill="#EFEEE7" text-anchor="start" font-weight="600">这一局带回的，怎样变成下一局的起点</text><text x="90" y="162" font-size="25" fill="#B0B2A8" text-anchor="start" font-weight="400">What a run brings home, and how it becomes the next run's start</text><circle id="stock" data-node="" cx="900" cy="900" r="150" fill="#191A18" stroke="#EFEEE7" stroke-width="2.4"/><text x="900" y="889" font-size="40" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="stock" data-padding="4">仓库</text><text x="900" y="919" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="stock" data-padding="4">存量：下一局能带的</text><text x="900" y="945" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="stock" data-padding="4">都先在这里</text><circle id="funds" data-node="" cx="900" cy="1290" r="72" fill="#191A18" stroke="#EFEEE7" stroke-width="2.0"/><text x="900" y="1284" font-size="22" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="funds" data-padding="4">营地资金</text><text x="900" y="1314" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="funds" data-padding="4">钱</text><circle id="smithy" data-node="" cx="470" cy="640" r="66" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6"/><text x="470" y="634" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="smithy" data-padding="4">铁匠铺</text><text x="470" y="664" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="smithy" data-padding="4">按配方打造</text><circle id="alchemy" data-node="" cx="470" cy="900" r="74" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="6 6"/><text x="470" y="894" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="alchemy" data-padding="4">炼金</text><text x="470" y="924" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="alchemy" data-padding="4">化成万物之尘</text><circle id="market" data-node="" cx="620" cy="1290" r="62" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6"/><text x="620" y="1284" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="market" data-padding="4">集市</text><text x="620" y="1314" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="market" data-padding="4">买 · 卖</text><path id="e-st-al" data-edge="" data-from="stock" data-to="alchemy" d="M750.0 900.0L544.0 900.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><text x="641" y="885" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400">丢道具</text><path id="e-al-sm" data-edge="" data-from="alchemy" data-to="smithy" d="M470.0 826.0L470.0 706.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><text x="486" y="780" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">尘补缺料</text><path id="e-sm-st" data-edge="" data-from="smithy" data-to="stock" d="M536.0 640.0L788.0 640.0A12 12 0 0 1 800.0 652.0L800.0 788.2" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="668" y="626" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400">素材进 · 成品出</text><path id="e-mk-fu" data-edge="" data-from="market" data-to="funds" d="M682.0 1290.0L828.0 1290.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="755" y="1276" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400">钱</text><path id="e-mk-st" data-edge="" data-from="market" data-to="stock" d="M620.0 1228.0L620.0 1012.0A12 12 0 0 1 632.0 1000.0L788.2 1000.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" marker-start="url(#arr)"/><text x="636" y="1110" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">道具</text><circle data-decoration="run-ring" cx="1950" cy="900" r="220" fill="none" stroke="#686E63" stroke-width="1.2"/><path id="arc-0" data-edge="" data-from="walk" data-to="fight" d="M2022.0 692.1A220 220 0 0 1 2157.9 828.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arr)"/><text x="2065" y="792" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400">遇敌</text><path id="arc-1" data-edge="" data-from="fight" data-to="loot" d="M2157.9 972.0A220 220 0 0 1 2022.0 1107.9" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arr)"/><text x="2065" y="1022" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400">打赢</text><path id="arc-2" data-edge="" data-from="loot" data-to="bag" d="M1878.0 1107.9A220 220 0 0 1 1742.1 972.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arr)"/><text x="1835" y="1022" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400">捡进来</text><path id="arc-3" data-edge="" data-from="bag" data-to="walk" d="M1742.1 828.0A220 220 0 0 1 1878.0 692.1" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arr)"/><text x="1835" y="792" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400">继续深入</text><circle id="walk" data-node="" cx="1950" cy="680" r="62" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6"/><text x="1950" y="674" font-size="23" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="walk" data-padding="4">走地图</text><text x="1950" y="704" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="walk" data-padding="4">选路线</text><circle id="fight" data-node="" cx="2170" cy="900" r="62" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6"/><text x="2170" y="894" font-size="23" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="fight" data-padding="4">遭遇战</text><text x="2170" y="924" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="fight" data-padding="4">自动对打</text><circle id="loot" data-node="" cx="1950" cy="1120" r="62" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6"/><text x="1950" y="1114" font-size="23" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="loot" data-padding="4">搜刮</text><text x="1950" y="1144" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="loot" data-padding="4">揭开掉落</text><circle id="bag" data-node="" cx="1730" cy="900" r="62" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6"/><text x="1730" y="894" font-size="23" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="bag" data-padding="4">背包取舍</text><text x="1730" y="924" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="bag" data-padding="4">装不下就扔</text><text x="1950" y="886" font-size="34" fill="#EFEEE7" text-anchor="middle" font-weight="500">一局</text><text x="1950" y="922" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400">体力 · 倒计时 · 侵蚀 · 猎手</text><text x="1950" y="948" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400">一直逼你往外走</text><circle id="grow" data-node="" cx="2170" cy="590" r="62" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6"/><text x="2170" y="583" font-size="21" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="grow" data-padding="4">升级选牌</text><text x="2170" y="613" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="grow" data-padding="4">通用 + 神恩</text><path id="e-fi-gr" data-edge="" data-from="fight" data-to="grow" d="M2170.0 838.0L2170.0 652.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><text x="2184" y="770" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">经验值</text><text x="2236" y="590" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">局内成长</text><text x="2236" y="616" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">带不回营地</text><path id="e-st-bag" data-edge="" data-from="stock" data-to="bag" d="M1050.0 900.0L1668.0 900.0" fill="none" stroke="#EFEEE7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arr)"/><path data-decoration="gate" d="M1554 854V946M1566 854V946" stroke="#EFEEE7" stroke-width="2.4"/><text x="1560" y="980" font-size="26" fill="#EFEEE7" text-anchor="middle" font-weight="500">出征</text><text x="1560" y="1010" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400">角色 · 一锅 · 信仰</text><text x="1560" y="1035" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400">带入 · 地图 · 难度</text><text x="1110" y="884" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">带入装备</text><circle id="tech" data-node="" cx="1200" cy="640" r="58" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6"/><text x="1200" y="634" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="tech" data-padding="4">科技</text><text x="1200" y="664" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="tech" data-padding="4">永久加成</text><circle id="nursery" data-node="" cx="1350" cy="430" r="58" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="6 6"/><text x="1350" y="424" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="nursery" data-padding="4">苗圃</text><text x="1350" y="454" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="nursery" data-padding="4">种食材</text><circle id="canteen" data-node="" cx="1350" cy="640" r="58" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="6 6"/><text x="1350" y="634" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="canteen" data-padding="4">食堂</text><text x="1350" y="664" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="canteen" data-padding="4">摆一锅</text><circle id="pantheon" data-node="" cx="1490" cy="640" r="58" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="6 6"/><text x="1490" y="634" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="pantheon" data-padding="4">万神院</text><text x="1490" y="664" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="pantheon" data-padding="4">奉哪位神</text><path id="e-st-te" data-edge="" data-from="stock" data-to="tech" d="M1000.0 788.2L1000.0 652.0A12 12 0 0 1 1012.0 640.0L1142.0 640.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><text x="1014" y="715" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">上交</text><path id="e-nu-ca" data-edge="" data-from="nursery" data-to="canteen" d="M1350.0 488.0L1350.0 582.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><text x="1364" y="542" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">食材</text><path id="e-tech-trunk" d="M1200.0 698.0L1200.0 900.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round"/><circle data-decoration="junction" cx="1200" cy="900" r="5" fill="#EFEEE7"/><path id="e-canteen-trunk" d="M1350.0 698.0L1350.0 900.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round"/><circle data-decoration="junction" cx="1350" cy="900" r="5" fill="#EFEEE7"/><path id="e-pantheon-trunk" d="M1490.0 698.0L1490.0 900.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round"/><circle data-decoration="junction" cx="1490" cy="900" r="5" fill="#EFEEE7"/><circle id="exit" data-node="" cx="1730" cy="1290" r="58" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6"/><text x="1730" y="1284" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="exit" data-padding="4">撤离</text><text x="1730" y="1314" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="exit" data-padding="4">活着出去</text><path id="e-bag-ex" data-edge="" data-from="bag" data-to="exit" d="M1730.0 962.0L1730.0 1232.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)"/><text x="1716" y="1080" font-size="19" fill="#B0B2A8" text-anchor="end" font-weight="400">见好就收</text><path id="e-ex-fu" data-edge="" data-from="exit" data-to="funds" d="M1672.0 1290.0L972.0 1290.0" fill="none" stroke="#EFEEE7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arr)"/><circle data-decoration="junction" cx="1150" cy="1290" r="5" fill="#EFEEE7"/><path id="e-ex-st" data-edge="" data-from="exit" data-to="stock" d="M1150.0 1290.0L1150.0 1012.0A12 12 0 0 0 1138.0 1000.0L1011.8 1000.0" fill="none" stroke="#EFEEE7" stroke-width="2.4" stroke-linecap="round" marker-end="url(#arr)"/><text x="1164" y="1150" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">带出来的东西</text><text x="1290" y="1276" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400">钱包余额</text><text x="1290" y="1330" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400">同时：委托记进度，苗圃长一格</text><circle id="lost" data-node="" cx="2170" cy="1290" r="58" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="6 6"/><text x="2170" y="1284" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="lost" data-padding="4">丢失</text><text x="2170" y="1314" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="lost" data-padding="4">作战区</text><path id="e-fi-lo" data-edge="" data-from="fight" data-to="lost" d="M2170.0 962.0L2170.0 1232.0" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arr)" stroke-dasharray="6 7"/><text x="2184" y="1080" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">战败</text><text x="2170" y="1382" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400">托付进保险箱的、局外奖励</text><text x="2170" y="1408" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400">战败也照样入账</text><text x="1190" y="1000" font-size="22" fill="#EFEEE7" text-anchor="start" font-weight="400">①</text><text x="1220" y="1000" font-size="20" fill="#EFEEE7" text-anchor="start" font-weight="400">下一局比这局强多少？</text><text x="1220" y="1030" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">看有几股汇进这道口</text><text x="1572" y="560" font-size="22" fill="#EFEEE7" text-anchor="start" font-weight="400">②</text><text x="1602" y="560" font-size="20" fill="#EFEEE7" text-anchor="start" font-weight="400">科技一次到手就永久</text><text x="1602" y="590" font-size="20" fill="#EFEEE7" text-anchor="start" font-weight="400">一锅、信仰、带入每局重喂</text><text x="1602" y="620" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">成型靠哪一种更快？</text><text x="1520" y="1420" font-size="22" fill="#EFEEE7" text-anchor="start" font-weight="400">③</text><text x="1550" y="1420" font-size="20" fill="#EFEEE7" text-anchor="start" font-weight="400">背包装得下多少，这局就存下多少：容量先卡住哪一类？</text><text x="390" y="500" font-size="22" fill="#EFEEE7" text-anchor="start" font-weight="400">④</text><text x="420" y="500" font-size="20" fill="#EFEEE7" text-anchor="start" font-weight="400">营地里转一圈不出门：同一份存量换个形状</text><text x="420" y="530" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">多绕一圈，带入会变强多少？</text><path data-decoration="rule" d="M90 1560H2310" fill="none" stroke="#686E63" stroke-width="1"/><text x="90" y="1628" font-size="32" fill="#EFEEE7" text-anchor="start" font-weight="500">成型速度卡在哪：试着截断一股回流</text><text x="90" y="1672" font-size="21" fill="#B0B2A8" text-anchor="start" font-weight="400">拿掉「带出来的东西」，仓库只靠集市和铁匠铺能长多快？拿掉科技，带入还剩哪几股？哪一股断了，下一局就停在原地？</text><circle data-decoration="legend" cx="104" cy="1736" r="14" fill="none" stroke="#EFEEE7" stroke-width="1.4" stroke-dasharray="5 5"/><text x="128" y="1743" font-size="18" fill="#B0B2A8" text-anchor="start" font-weight="400">虚线圈：靠委托声望开放</text><path data-decoration="legend" d="M380 1736H440" stroke="#EFEEE7" stroke-width="1.8" stroke-dasharray="6 7"/><text x="452" y="1743" font-size="18" fill="#B0B2A8" text-anchor="start" font-weight="400">虚线箭头：流失</text><path data-decoration="legend" d="M630 1736H690" stroke="#EFEEE7" stroke-width="2.4"/><text x="702" y="1743" font-size="18" fill="#B0B2A8" text-anchor="start" font-weight="400">粗线：存量进出的主干</text><path data-decoration="legend" d="M944 1716V1756M956 1716V1756" stroke="#EFEEE7" stroke-width="2.4"/><text x="972" y="1743" font-size="18" fill="#B0B2A8" text-anchor="start" font-weight="400">关口：出征三屏</text><text x="90" y="1810" font-size="17" fill="#B0B2A8" text-anchor="start" font-weight="400">示意，不编码数量：圈的大小、线的长短不代表多少。局内商店、事件、营火未画。依据 v9.25 的 docs/architecture.md §0、core/meta/*.gd 与 core/run/run_result.gd 头注释，及结算图 2026-11-27-run-settlement。</text></svg>
