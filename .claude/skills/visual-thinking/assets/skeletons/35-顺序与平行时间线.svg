<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2200" viewBox="0 0 2400 2200" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">同一段时间，几件事怎样交错？</title><desc id="desc">三条水平轨道共用一个时间轴；圆为时点事件，矩形为持续区间。垂直虚线用于跨轨对齐，不表示因果。位置是未填数据的示意。</desc><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4" /></marker></defs><rect width="2400" height="2200" fill="#191A18" data-decoration="background" /><text x="120" y="155" fill="#EFEEE7" font-size="64" text-anchor="start" font-weight="600">同一段时间，几件事怎样交错？</text><text x="120" y="232" fill="#B0B2A8" font-size="34" text-anchor="start" font-weight="400">Sequence and parallel timelines</text><path d="M120 290H1750" stroke="#50554C" data-decoration="separator" /><text x="360" y="510" fill="#B0B2A8" font-size="30" text-anchor="start" font-weight="400">共同时间轴</text><path d="M500 635H2110" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" /><text x="550" y="580" fill="#B0B2A8" font-size="30" text-anchor="middle" font-weight="400">起点</text><path d="M550 650V1510" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" data-decoration="time-alignment" /><text x="1050" y="580" fill="#B0B2A8" font-size="30" text-anchor="middle" font-weight="400">时间点 1</text><path d="M1050 650V1510" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" data-decoration="time-alignment" /><text x="1550" y="580" fill="#B0B2A8" font-size="30" text-anchor="middle" font-weight="400">时间点 2</text><path d="M1550 650V1510" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" data-decoration="time-alignment" /><text x="2050" y="580" fill="#B0B2A8" font-size="30" text-anchor="middle" font-weight="400">终点</text><path d="M2050 650V1510" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" data-decoration="time-alignment" /><text x="290" y="862" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500">轨道 1</text><path d="M500 850H2110" fill="none" stroke="#EFEEE7" stroke-width="2.2" /><text x="290" y="1162" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500">轨道 2</text><path d="M500 1150H2110" fill="none" stroke="#EFEEE7" stroke-width="2.2" /><text x="290" y="1462" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500">轨道 3</text><path d="M500 1450H2110" fill="none" stroke="#EFEEE7" stroke-width="2.2" /><circle id="a" cx="650" cy="850" r="13" fill="#EFEEE7" data-node="" /><text x="650" y="945" fill="#EFEEE7" font-size="32" text-anchor="middle" font-weight="400">事件 A</text><circle id="b" cx="1550" cy="850" r="13" fill="#EFEEE7" data-node="" /><text x="1550" y="945" fill="#EFEEE7" font-size="32" text-anchor="middle" font-weight="400">事件 B</text><circle id="c" cx="1050" cy="1150" r="13" fill="#EFEEE7" data-node="" /><text x="1050" y="1245" fill="#EFEEE7" font-size="32" text-anchor="middle" font-weight="400">事件 C</text><circle id="d" cx="1850" cy="1450" r="13" fill="#EFEEE7" data-node="" /><text x="1850" y="1545" fill="#EFEEE7" font-size="32" text-anchor="middle" font-weight="400">事件 D</text><rect id="period" data-node="" x="1200" y="1117" width="570" height="66" fill="#EFEEE7" /><text x="1485" y="1270" fill="#B0B2A8" font-size="30" text-anchor="middle" font-weight="400">持续区间：开始至结束</text><text x="1200" y="1680" fill="#EFEEE7" font-size="37" text-anchor="middle" font-weight="500">先后、重叠、等待与空档；都回到同一时间尺度。</text><path d="M850 1840H2280" stroke="#50554C" data-decoration="separator" /><text x="2280" y="1910" fill="#EFEEE7" font-size="38" text-anchor="end" font-weight="500">同时发生，可以是线索，不能直接算作原因。</text><text x="2280" y="1970" fill="#B0B2A8" font-size="29" text-anchor="end" font-weight="400">无日期时仅表达次序，明确间距不表示时长；有数据才按真实时间定位。</text><text x="120" y="2070" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">方法用途：IRIS Center · Sequencing；FSU ACE · Timeline / Sequence of Events</text><text x="120" y="2109" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">iris.peabody.vanderbilt.edu/activity/graphic-organizers/；ace.fsu.edu/study-tools-and-tips/graphic-organizers-subject-area ｜自主编排。</text></svg>