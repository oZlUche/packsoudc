<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">结果分布与尾部</title><desc id="d">分布形状和尾部风险要用数据，不能臆画。 图形身份：测量坐标与待数据确定的分布。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">27</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">结果分布与尾部</text><path data-vt-geometry="path" data-vt-identity="27-g01" d="M90 365L441 365" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><path data-vt-geometry="path" data-vt-identity="27-g02" d="M90 365L90 90" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><path data-vt-geometry="path" data-vt-identity="27-g03" d="M170 130L170 340" fill="none" stroke="#63695D" stroke-width="1.3" stroke-dasharray="3 6"/><path data-vt-geometry="path" data-vt-identity="27-g04" d="M350 130L350 340" fill="none" stroke="#63695D" stroke-width="1.3" stroke-dasharray="3 6"/><text x="260" y="240" font-size="22" fill="#EEEDE5" text-anchor="middle" font-weight="400">分布待数据</text><text x="130" y="330" font-size="16" fill="#B1B5A8" text-anchor="middle" font-weight="400">尾部？</text><text x="392" y="330" font-size="16" fill="#B1B5A8" text-anchor="middle" font-weight="400">尾部？</text><text x="440" y="397" font-size="17" fill="#EEEDE5" text-anchor="end" font-weight="400">结果</text><text x="104" y="102" font-size="16" fill="#B1B5A8" text-anchor="start" font-weight="400">频数／概率</text><text x="20" y="445" font-size="17" fill="#B1B5A8">分布形状和尾部风险要用数据，不能臆画。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">轴线保留；分布线只能由数据生成，不能臆画。</text><text x="20" y="566" font-size="15" fill="#B1B5A8">正式图保留图形身份与关系；文字附着，不替换图形。</text></svg>