<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="3050" viewBox="0 0 2800 3050" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">把一天的生活，放进同一个家</title><desc id="d">一张共享全屋底图组织到家离家、吃饭共处、睡眠独处、备餐收拾、洗漱更衣、洗晒清洁六种活动场域。实线是人可以往返的联系，虚线箭头追踪随身物取放、食物进屋与餐具回收、衣物待洗与洗净归位、垃圾带出。衣物路径从更衣到洗晒、衣物归位和再次取用形成回路；一餐从备餐到共处再回收，垃圾最终带出。夜间睡眠与洗漱可直接往返，门或隔断的位置、声音与视线需一起检验。小空心圈标记穿行和物品周转的交叉检查点，小实心点标记通路分支。场域、位置与面积均为思考示意，可按真实户型拆分、合并或重排，不是实际平面方案。</desc><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#B0B2A8" stroke-width="1.4" /></marker><marker id="human-arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4" /></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect data-decoration="background" width="2800" height="3050" fill="#191A18" /><text x="90.000" y="110.000" font-size="46" fill="#EFEEE7" text-anchor="start" font-weight="600">把一天的生活，放进同一个家</text><text x="90.000" y="160.000" font-size="25" fill="#B0B2A8" text-anchor="start" font-weight="400">Bring a whole day of living into one home.</text><path data-decoration="rule" d="M90 195H1200" fill="none" stroke="#686E63" stroke-width="1.2" /><rect data-decoration="shared-home-scope" x="140" y="550" width="2440" height="1920" rx="12" fill="none" stroke="#686E63" stroke-width="1.2" /><text x="195.000" y="610.000" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">全屋生活关系示意｜活动场域可拆分、合并或重排。位置与面积不代表真实户型。</text><text x="1120.000" y="680.000" font-size="23" fill="#EFEEE7" text-anchor="start" font-weight="500">若一人休息，另一人仍在活动：</text><text x="1120.000" y="720.000" font-size="21" fill="#B0B2A8" text-anchor="start" font-weight="400">声音、视线与气味，需要在哪条边界停住？</text><path id="human-arrive" data-edge="" data-from="entry" data-to="shared" d="M618.000 850.000L838.000 850.000A12.000 12.000 0 0 1 850.000 862.000L850.000 1308.000A12.000 12.000 0 0 0 862.000 1320.000L1002.000 1320.000" fill="none" stroke="#EFEEE7" stroke-width="2.1" stroke-linecap="round" /><path id="human-main" data-edge="" data-from="shared" data-to="east-junction" d="M1498.000 1320.000L1690.000 1320.000" fill="none" stroke="#EFEEE7" stroke-width="2.1" stroke-linecap="round" /><path id="human-rest" data-edge="" data-from="east-junction" data-to="rest" d="M1690.000 1320.000L1690.000 862.000A12.000 12.000 0 0 1 1702.000 850.000L1852.000 850.000" fill="none" stroke="#EFEEE7" stroke-width="2.1" stroke-linecap="round" /><path id="human-wash" data-edge="" data-from="east-junction" data-to="wash" d="M1690.000 1320.000L1690.000 1558.000A12.000 12.000 0 0 0 1702.000 1570.000L1872.000 1570.000" fill="none" stroke="#EFEEE7" stroke-width="2.1" stroke-linecap="round" /><path id="night" data-edge="" data-from="rest" data-to="wash" d="M2050.000 1048.000L2050.000 1392.000" fill="none" stroke="#EFEEE7" stroke-width="2.1" stroke-linecap="round" marker-end="url(#human-arr)" marker-start="url(#human-arr)" /><path id="human-services" data-edge="" data-from="shared" data-to="south-junction" d="M1250.000 1568.000L1250.000 1720.000" fill="none" stroke="#EFEEE7" stroke-width="2.1" stroke-linecap="round" /><path id="human-cook" data-edge="" data-from="south-junction" data-to="cook" d="M1250.000 1720.000L862.000 1720.000A12.000 12.000 0 0 1 850.000 1708.000L850.000 1582.000A12.000 12.000 0 0 0 838.000 1570.000L658.000 1570.000" fill="none" stroke="#EFEEE7" stroke-width="2.1" stroke-linecap="round" /><path id="human-laundry" data-edge="" data-from="south-junction" data-to="laundry" d="M1250.000 1720.000L1250.000 1922.000" fill="none" stroke="#EFEEE7" stroke-width="2.1" stroke-linecap="round" /><path id="groceries" data-edge="" data-from="entry" data-to="cook" d="M302.000 850.000L242.000 850.000A12.000 12.000 0 0 0 230.000 862.000L230.000 1558.000A12.000 12.000 0 0 0 242.000 1570.000L262.000 1570.000" fill="none" stroke="#B0B2A8" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr)" /><path id="serve" data-edge="" data-from="cook" data-to="shared" d="M435.000 1373.650L435.000 1242.000A12.000 12.000 0 0 1 447.000 1230.000L948.000 1230.000A12.000 12.000 0 0 1 960.000 1242.000L960.000 1278.000A12.000 12.000 0 0 0 972.000 1290.000L1003.880 1290.000" fill="none" stroke="#B0B2A8" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr)" /><path id="table-return" data-edge="" data-from="shared" data-to="cook" d="M1280.000 1566.120L1280.000 1778.000A12.000 12.000 0 0 1 1268.000 1790.000L732.000 1790.000A12.000 12.000 0 0 1 720.000 1778.000L720.000 1612.000A12.000 12.000 0 0 0 708.000 1600.000L655.620 1600.000" fill="none" stroke="#B0B2A8" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr)" /><path id="waste-a" data-edge="" data-from="cook" data-to="entry" d="M460.000 1768.000L460.000 1898.000A12.000 12.000 0 0 1 448.000 1910.000L192.000 1910.000A12.000 12.000 0 0 1 180.000 1898.000L180.000 892.000A12.000 12.000 0 0 1 192.000 880.000L220.000 880.000" fill="none" stroke="#B0B2A8" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="7 9" /><path id="waste-b" data-edge="" data-from="cook" data-to="entry" d="M240.000 880.000L306.970 880.000" fill="none" stroke="#B0B2A8" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr)" /><path id="carry" data-edge="" data-from="entry" data-to="carry-point" d="M460.000 1008.000L460.000 1066.000" fill="none" stroke="#B0B2A8" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr)" marker-start="url(#arr)" /><path id="dirty-a" data-edge="" data-from="wash" data-to="laundry" d="M2228.000 1570.000L2390.000 1570.000" fill="none" stroke="#B0B2A8" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="7 9" /><path id="dirty-b" data-edge="" data-from="wash" data-to="laundry" d="M2410.000 1570.000L2488.000 1570.000A12.000 12.000 0 0 1 2500.000 1582.000L2500.000 2378.000A12.000 12.000 0 0 1 2488.000 2390.000L1262.000 2390.000A12.000 12.000 0 0 1 1250.000 2378.000L1250.000 2318.000" fill="none" stroke="#B0B2A8" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr)" /><path id="clean" data-edge="" data-from="laundry" data-to="wardrobe" d="M1448.000 2120.000L2388.000 2120.000A12.000 12.000 0 0 0 2400.000 2108.000L2400.000 1182.000A12.000 12.000 0 0 0 2388.000 1170.000L2368.000 1170.000" fill="none" stroke="#B0B2A8" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr)" /><path id="clothes-use" data-edge="" data-from="wardrobe" data-to="rest" d="M2280.000 1114.000L2280.000 1092.000A12.000 12.000 0 0 1 2292.000 1080.000L2328.000 1080.000A12.000 12.000 0 0 0 2340.000 1068.000L2340.000 862.000A12.000 12.000 0 0 0 2328.000 850.000L2248.000 850.000" fill="none" stroke="#B0B2A8" stroke-width="1.65" stroke-linecap="round" stroke-dasharray="7 9" marker-end="url(#arr)" /><circle id="entry" data-node="" cx="460" cy="850" r="150" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8" /><circle id="rest" data-node="" cx="2050" cy="850" r="190" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8" /><circle id="shared" data-node="" cx="1250" cy="1320" r="240" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.8" /><circle id="cook" data-node="" cx="460" cy="1570" r="190" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8" /><circle id="wash" data-node="" cx="2050" cy="1570" r="170" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8" /><circle id="laundry" data-node="" cx="1250" cy="2120" r="190" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8" /><rect id="carry-point" data-node="" x="380.0" y="1074.0" width="160" height="92" rx="0" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><rect id="wardrobe" data-node="" x="2200.0" y="1122" width="160" height="96" rx="0" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="460.000" y="825.000" font-size="34" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="entry" data-padding="14">到家 · 离家</text><text x="460.000" y="875.000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="entry" data-padding="14">换鞋、卸物、再取走</text><text x="460.000" y="915.000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="entry" data-padding="14">停放点够顺手吗？</text><text x="2050.000" y="825.000" font-size="34" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="rest" data-padding="14">睡眠 · 独处</text><text x="2050.000" y="875.000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="rest" data-padding="14">谁在休息，谁还在活动？</text><text x="2050.000" y="915.000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="rest" data-padding="14">门、声音与视线一起看</text><text x="460.000" y="1545.000" font-size="34" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="cook" data-padding="14">备餐 · 收拾</text><text x="460.000" y="1595.000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="cook" data-padding="14">食材怎么进，餐具怎么回？</text><text x="460.000" y="1635.000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="cook" data-padding="14">收尾后，东西各归哪里？</text><text x="2050.000" y="1545.000" font-size="34" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="wash" data-padding="14">洗漱 · 更衣</text><text x="2050.000" y="1595.000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="wash" data-padding="14">同时使用，会不会等？</text><text x="2050.000" y="1635.000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="wash" data-padding="14">夜间使用会影响谁？</text><text x="1250.000" y="2095.000" font-size="34" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="laundry" data-padding="14">洗晒 · 清洁</text><text x="1250.000" y="2145.000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="laundry" data-padding="14">洗、晾、取、收能闭环吗？</text><text x="1250.000" y="2185.000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="laundry" data-padding="14">工具用完，又回到哪里？</text><text x="1250.000" y="1285.000" font-size="40" fill="#191A18" text-anchor="middle" font-weight="600" data-in-node="shared" data-padding="14">吃饭 · 共处</text><text x="1250.000" y="1345.000" font-size="23" fill="#191A18" text-anchor="middle" font-weight="400" data-in-node="shared" data-padding="14">坐下、吃饭、交谈</text><text x="1250.000" y="1390.000" font-size="23" fill="#191A18" text-anchor="middle" font-weight="400" data-in-node="shared" data-padding="14">也能各自待着吗？</text><text x="460.000" y="1114.000" font-size="22" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="carry-point" data-padding="10">随身物</text><text x="460.000" y="1142.000" font-size="16" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="carry-point" data-padding="10">钥匙／包／鞋</text><text x="2280.000" y="1159" font-size="22" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="wardrobe" data-padding="10">衣物归位</text><text x="2280.000" y="1190" font-size="17" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="wardrobe" data-padding="10">再取来穿</text><circle id="east-junction" data-node="" cx="1690" cy="1320" r="4" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.8" /><circle id="south-junction" data-node="" cx="1250" cy="1720" r="4" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.8" /><path data-decoration="boundary-to-test" d="M1790 735V814M1790 886V1070" fill="none" stroke="#B0B2A8" stroke-width="3" /><text x="1760.000" y="710.000" font-size="21" fill="#B0B2A8" text-anchor="start" font-weight="400">门／隔断？</text><text x="2100.000" y="1280.000" font-size="21" fill="#B0B2A8" text-anchor="start" font-weight="400">夜里能直达？</text><text x="2100.000" y="1320.000" font-size="18" fill="#B0B2A8" text-anchor="start" font-weight="400">换洗衣物随人到更衣处</text><text x="515.000" y="1048.000" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">放下／再取</text><text x="275.000" y="1240.000" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">买回的食物</text><text x="535.000" y="1192.000" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">端出一餐</text><text x="760.000" y="1770.000" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">餐具返还</text><text x="260.000" y="1950.000" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">垃圾带出门</text><text x="2260.000" y="1535.000" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">待洗衣物</text><text x="1740.000" y="2080.000" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">洗净的衣物 → 归位</text><text x="2380.000" y="950.000" font-size="19" fill="#B0B2A8" text-anchor="start" font-weight="400">取用</text><text x="1220.000" y="2370.000" font-size="21" fill="#B0B2A8" text-anchor="end" font-weight="400">晾晒、排湿与工具清洗的条件，在哪里？</text><circle data-decoration="crossing-check" cx="850" cy="1230" r="10" fill="#191A18" stroke="#EFEEE7" stroke-width="1.5" /><circle data-decoration="crossing-check" cx="1250" cy="1790" r="10" fill="#191A18" stroke="#EFEEE7" stroke-width="1.5" /><text x="600.000" y="1160.000" font-size="21" fill="#EFEEE7" text-anchor="start" font-weight="400">端菜时，有人穿行？</text><text x="800.000" y="1840.000" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">收拾与洗晒，会不会挤在一起？</text><text x="410.000" y="2140.000" font-size="24" fill="#EFEEE7" text-anchor="start" font-weight="500">拿着清洁工具走一遍全屋：</text><text x="410.000" y="2185.000" font-size="21" fill="#B0B2A8" text-anchor="start" font-weight="400">哪里要折返、取水、清洗或归位？</text><path data-decoration="rule" d="M1180 2765H2710" fill="none" stroke="#686E63" stroke-width="1.2" /><text x="2710.000" y="2810.000" font-size="27" fill="#EFEEE7" text-anchor="end" font-weight="500">试着挪动一个场域或归位点，再追一遍人、物与收尾。</text><path data-decoration="legend" d="M1190 2858H1270" stroke="#EFEEE7" stroke-width="2.1" /><text x="1290.000" y="2865.000" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">人：可往返的联系</text><path data-decoration="legend" d="M1690 2858H1770" stroke="#B0B2A8" stroke-width="1.65" stroke-dasharray="7 9" marker-end="url(#arr)" /><text x="1790.000" y="2865.000" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">物：沿箭头追周转</text><circle data-decoration="legend" cx="2290" cy="2858" r="10" fill="none" stroke="#EFEEE7" stroke-width="1.5" /><text x="2315.000" y="2865.000" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">交叉处：需要核对</text><text x="2710.000" y="2907.000" font-size="18" fill="#B0B2A8" text-anchor="end" font-weight="400">大圆＝活动场域；方框＝物品停放点。空心圈不预判冲突；跨线留空表示不相接。</text><text x="2710.000" y="2950.000" font-size="16" fill="#B0B2A8" text-anchor="end" font-weight="400">参考：[1] YourHome, Designing a house. yourhome.gov.au/buy-build-renovate/design-house</text><text x="2710.000" y="2987.000" font-size="16" fill="#B0B2A8" text-anchor="end" font-weight="400">[2] RIBA, Working with an architect for your home. riba.org/media/ktsfkg3c/riba-workingwithanarchitectforyourhome-2021.pdf</text></svg>