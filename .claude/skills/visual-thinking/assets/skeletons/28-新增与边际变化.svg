<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">新增与边际变化</title><desc id="d">分开已有成果，检查再投入一份改变什么。 图形身份：已有与新增分区及结果检查点。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">28</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">新增与边际变化</text><rect data-vt-geometry="rect" data-vt-identity="28-g01" x="70" y="155" width="260" height="150" fill="none" stroke="#EEEDE5" stroke-width="1.8"/><rect data-vt-geometry="rect" data-vt-identity="28-g02" x="330" y="155" width="95" height="150" fill="none" stroke="#63695D" stroke-width="1.2"/><path data-vt-geometry="path" data-vt-identity="28-g03" d="M330 155L330 305" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6"/><text x="200" y="238" font-size="23" fill="#EEEDE5" text-anchor="middle" font-weight="400">已有</text><text x="377" y="238" font-size="20" fill="#EEEDE5" text-anchor="middle" font-weight="400">新增</text><path data-vt-geometry="path" data-vt-identity="28-g04" d="M377 305L377 353" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="28-g05" cx="377" cy="372" r="6" fill="#191A18" stroke="#EEEDE5" stroke-width="1.2"/><text x="244" y="385" font-size="18" fill="#B1B5A8" text-anchor="middle" font-weight="400">改变什么？</text><text x="20" y="445" font-size="17" fill="#B1B5A8">分开已有成果，检查再投入一份改变什么。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">两块矩形区分已有与新增；小圆是结果检查点。</text><text x="20" y="566" font-size="15" fill="#B1B5A8">正式图保留图形身份与关系；文字附着，不替换图形。</text></svg>