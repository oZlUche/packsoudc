<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">原因—事件—后果</title><desc id="d">把原因与后果分开，每条因果都待核实。 图形身份：原因节点、事件节点和后果节点。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">17</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">原因—事件—后果</text><circle data-vt-geometry="circle" data-vt-identity="17-g01" cx="75" cy="135" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="17-g02" d="M98 135L155 135" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6"/><circle data-vt-geometry="circle" data-vt-identity="17-g03" cx="425" cy="135" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="17-g04" d="M345 135L394 135" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="17-g05" cx="75" cy="240" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="17-g06" d="M98 240L155 240" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6"/><circle data-vt-geometry="circle" data-vt-identity="17-g07" cx="425" cy="240" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="17-g08" d="M345 240L394 240" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="17-g09" cx="75" cy="345" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="17-g10" d="M98 345L155 345" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6"/><circle data-vt-geometry="circle" data-vt-identity="17-g11" cx="425" cy="345" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="17-g12" d="M345 345L394 345" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6" marker-end="url(#arrow)"/><path data-vt-geometry="path" data-vt-identity="17-g13" d="M155 135L155 345" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6"/><path data-vt-geometry="path" data-vt-identity="17-g14" d="M155 240L202 240" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="17-g15" cx="250" cy="240" r="39" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="17-g16" d="M289 240L345 240" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6"/><path data-vt-geometry="path" data-vt-identity="17-g17" d="M345 135L345 345" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6"/><text x="75" y="85" font-size="17" fill="#EEEDE5" text-anchor="middle" font-weight="400">原因</text><text x="250" y="180" font-size="17" fill="#EEEDE5" text-anchor="middle" font-weight="400">事件</text><text x="425" y="85" font-size="17" fill="#EEEDE5" text-anchor="middle" font-weight="400">后果</text><text x="20" y="445" font-size="17" fill="#B1B5A8">把原因与后果分开，每条因果都待核实。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">两侧圆是原因与后果；中心圆是事件。</text><text x="20" y="566" font-size="15" fill="#B1B5A8">正式图保留图形身份与关系；文字附着，不替换图形。</text></svg>