<path id="to-reason-1" data-edge="" data-from="example-1" data-to="reason-1" d="M330 1940V2020" fill="none" stroke="var(--vt-ink)" stroke-width="var(--vt-line)"/>
<path id="to-reason-2" data-edge="" data-from="example-2" data-to="reason-2" d="M950 1940V2020" fill="none" stroke="var(--vt-ink)" stroke-width="var(--vt-line)"/>
<path id="to-reason-3" data-edge="" data-from="example-3" data-to="reason-3" d="M1570 1940V2020" fill="none" stroke="var(--vt-ink)" stroke-width="var(--vt-line)"/>
<text x="272" y="683" font-size="34" fill="var(--vt-ink)" text-anchor="start" font-weight="500" data-in-node="definition" data-padding="16">定义</text>
<text x="808" y="679" font-size="19" fill="var(--vt-muted)" text-anchor="end" font-weight="400" data-in-node="definition" data-padding="16">DEFINITION</text>
<text x="272" y="747" font-size="23" fill="var(--vt-muted)" text-anchor="start" font-weight="400" data-in-node="definition" data-padding="16">它是什么？属于哪一类事物？</text>
<text x="575" y="904" font-size="22" fill="var(--vt-muted)" text-anchor="start" font-weight="400">它是什么</text>
<text x="272" y="1045" font-size="36" fill="var(--vt-bg)" text-anchor="start" font-weight="600" data-in-node="concept" data-padding="16">概念</text>
<text x="808" y="1041" font-size="20" fill="var(--vt-bg)" text-anchor="end" font-weight="400" data-in-node="concept" data-padding="16">CONCEPT</text>
<text x="540" y="1134" font-size="31" fill="var(--vt-bg)" text-anchor="middle" font-weight="500" data-in-node="concept" data-padding="16">放入要弄懂的概念</text>
<text x="540" y="1182" font-size="20" fill="var(--vt-bg)" text-anchor="middle" font-weight="400" data-in-node="concept" data-padding="16">围绕同一个概念展开</text>
<text x="916" y="1066" font-size="22" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">有何属性</text>
<text x="1282" y="723" font-size="32" fill="var(--vt-ink)" text-anchor="start" font-weight="500" data-in-node="property-1" data-padding="16">属性 1</text>
<text x="1658" y="719" font-size="18" fill="var(--vt-muted)" text-anchor="end" font-weight="400" data-in-node="property-1" data-padding="16">PROPERTY</text>
<text x="1282" y="786" font-size="22" fill="var(--vt-muted)" text-anchor="start" font-weight="400" data-in-node="property-1" data-padding="16">写出一个关键特征。</text>
<text x="1282" y="1073" font-size="32" fill="var(--vt-ink)" text-anchor="start" font-weight="500" data-in-node="property-2" data-padding="16">属性 2</text>
<text x="1658" y="1069" font-size="18" fill="var(--vt-muted)" text-anchor="end" font-weight="400" data-in-node="property-2" data-padding="16">PROPERTY</text>
<text x="1282" y="1136" font-size="22" fill="var(--vt-muted)" text-anchor="start" font-weight="400" data-in-node="property-2" data-padding="16">补充另一项相关特征。</text>
<text x="1282" y="1423" font-size="32" fill="var(--vt-ink)" text-anchor="start" font-weight="500" data-in-node="property-3" data-padding="16">属性 3</text>
<text x="1658" y="1419" font-size="18" fill="var(--vt-muted)" text-anchor="end" font-weight="400" data-in-node="property-3" data-padding="16">PROPERTY</text>
<text x="1282" y="1486" font-size="22" fill="var(--vt-muted)" text-anchor="start" font-weight="400" data-in-node="property-3" data-padding="16">还有什么特征帮助理解它？</text>
<text x="575" y="1536" font-size="23" fill="var(--vt-muted)" text-anchor="start" font-weight="400">有哪些具体例子</text>
<text x="330" y="1824" font-size="30" fill="var(--vt-ink)" text-anchor="middle" font-weight="500" data-in-node="example-1" data-padding="16">例子 1</text>
<text x="330" y="1871" font-size="18" fill="var(--vt-muted)" text-anchor="middle" font-weight="400" data-in-node="example-1" data-padding="16">放入一个具体对象</text>
<text x="330" y="2081" font-size="28" fill="var(--vt-ink)" text-anchor="middle" font-weight="500" data-in-node="reason-1" data-padding="16">为什么属于它？</text>
<text x="330" y="2130" font-size="22" fill="var(--vt-muted)" text-anchor="middle" font-weight="400" data-in-node="reason-1" data-padding="16">对照定义，哪些特征支持归类？</text>
<path d="M150 2167H510" fill="none" stroke="var(--vt-muted)" stroke-opacity=".42" stroke-width="1" data-decoration="content-space"/>
<text x="950" y="1824" font-size="30" fill="var(--vt-ink)" text-anchor="middle" font-weight="500" data-in-node="example-2" data-padding="16">例子 2</text>
<text x="950" y="1871" font-size="18" fill="var(--vt-muted)" text-anchor="middle" font-weight="400" data-in-node="example-2" data-padding="16">放入一个具体对象</text>
<text x="950" y="2081" font-size="28" fill="var(--vt-ink)" text-anchor="middle" font-weight="500" data-in-node="reason-2" data-padding="16">为什么属于它？</text>
<text x="950" y="2130" font-size="22" fill="var(--vt-muted)" text-anchor="middle" font-weight="400" data-in-node="reason-2" data-padding="16">对照定义，哪些特征支持归类？</text>
<path d="M770 2167H1130" fill="none" stroke="var(--vt-muted)" stroke-opacity=".42" stroke-width="1" data-decoration="content-space"/>
<text x="1570" y="1824" font-size="30" fill="var(--vt-ink)" text-anchor="middle" font-weight="500" data-in-node="example-3" data-padding="16">例子 3</text>
<text x="1570" y="1871" font-size="18" fill="var(--vt-muted)" text-anchor="middle" font-weight="400" data-in-node="example-3" data-padding="16">放入一个具体对象</text>
<text x="1570" y="2081" font-size="28" fill="var(--vt-ink)" text-anchor="middle" font-weight="500" data-in-node="reason-3" data-padding="16">为什么属于它？</text>
<text x="1570" y="2130" font-size="22" fill="var(--vt-muted)" text-anchor="middle" font-weight="400" data-in-node="reason-3" data-padding="16">对照定义，哪些特征支持归类？</text>
<path d="M1390 2167H1750" fill="none" stroke="var(--vt-muted)" stroke-opacity=".42" stroke-width="1" data-decoration="content-space"/>
<path d="M760 2520H1810" fill="none" stroke="var(--vt-muted)" stroke-opacity=".42" stroke-width="1" data-decoration="guide"/>
<text x="1810" y="2574" font-size="30" fill="var(--vt-ink)" text-anchor="end" font-weight="500">不只举出例子，还要说清归类的理由。</text>
<text x="1810" y="2626" font-size="23" fill="var(--vt-muted)" text-anchor="end" font-weight="400">如果某个例子对不上，回看定义、属性或归类依据。</text>
<text x="1810" y="2681" font-size="20" fill="var(--vt-muted)" text-anchor="end" font-weight="400">定义、属性与例子数量可按内容调整；连线不表示因果或固定顺序。</text>
<text x="1810" y="2740" font-size="17" fill="var(--vt-muted)" text-anchor="end" font-weight="400">按所提供 Concept Definition Map 的关系自主编排与绘制。</text>
