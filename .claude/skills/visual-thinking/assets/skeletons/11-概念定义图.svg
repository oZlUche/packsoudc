<rect id="reason-2" data-node="" data-vt-geometry="membership-reason" x="730" y="2020" width="440" height="180" fill="var(--vt-bg)" stroke="var(--vt-muted)" stroke-width="1.4"/>
<circle id="example-3" data-node="" data-vt-geometry="instance" cx="1570" cy="1830" r="110" fill="var(--vt-bg)" stroke="var(--vt-ink)" stroke-width="1.8"/>
<rect id="reason-3" data-node="" data-vt-geometry="membership-reason" x="1350" y="2020" width="440" height="180" fill="var(--vt-bg)" stroke="var(--vt-muted)" stroke-width="1.4"/>
<circle id="property-junction" data-node="" data-vt-geometry="junction" cx="1050" cy="1100" r="3" fill="var(--vt-ink)" stroke="var(--vt-ink)" stroke-width="0"/>
