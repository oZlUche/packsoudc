<path id="to-property-3" data-edge="" data-from="property-junction" data-to="property-3" d="M1050 1100V1438A12 12 0 0 0 1062 1450H1250" fill="none" stroke="var(--vt-ink)" stroke-width="var(--vt-line)"/>
<path id="to-examples" data-edge="" data-from="concept" data-to="example-root" d="M540 1220V1610" fill="none" stroke="var(--vt-ink)" stroke-width="var(--vt-line)"/>
