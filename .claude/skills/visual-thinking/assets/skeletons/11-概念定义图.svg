<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="2800" viewBox="0 0 1900 2800" role="img" aria-labelledby="title" aria-describedby="desc">
<title id="title">概念定义图：这个词究竟指什么？</title>
<desc id="desc">概念定义图的自主排版：中央大方框代表同一个概念，向上连接定义，向右展开三个属性位置，向下连接三个作为实例对象的圆。每个实例圆各自接一个归类理由方框，说明它如何依据定义及可核对的特征归类。关系保持为同一概念的定义、属性、实例与归类依据，不表示因果或固定操作顺序。可用一个不确定的例子回查定义与属性；区域数量可随内容改变。按用户提供的教学图示关系绘制，没有复制书页图像、字体或阴影资产。</desc>
<style data-vt-theme="">:root{--vt-bg:#191A18;--vt-ink:#EFEEE7;--vt-muted:#B0B2A8;--vt-accent:#EFEEE7;--vt-surface:#272925;--vt-secondary:#383B34;--vt-line:1.8;--vt-title:54px;--vt-section:32px;--vt-label:23px;--vt-note:19px;}text{font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Helvetica Neue",sans-serif}</style>
<rect width="1900" height="2800" fill="var(--vt-bg)" data-decoration="background"/>
<text x="90" y="122" font-size="54" fill="var(--vt-ink)" text-anchor="start" font-weight="600">概念定义图：这个词究竟指什么？</text>
<text x="90" y="184" font-size="30" fill="var(--vt-muted)" text-anchor="start" font-weight="400">Concept Definition Map</text>
