<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">扩大观察尺度</title><desc id="d">保留同一对象，检查更大范围带来的联系。 图形身份：不同观察范围及其中的相同对象。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">24</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">扩大观察尺度</text><rect data-vt-geometry="rect" data-vt-identity="24-g01" x="30" y="185" width="100" height="100" fill="none" stroke="#EEEDE5" stroke-width="1.6"/><circle data-vt-geometry="circle" data-vt-identity="24-g02" cx="80" cy="235" r="6" fill="#EEEDE5" stroke="#EEEDE5" stroke-width="1.2"/><path data-vt-geometry="path" data-vt-identity="24-g03" d="M140 235L192 235" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6" marker-end="url(#arrow)"/><rect data-vt-geometry="rect" data-vt-identity="24-g04" x="205" y="105" width="255" height="280" fill="none" stroke="#EEEDE5" stroke-width="1.8"/><circle data-vt-geometry="circle" data-vt-identity="24-g05" cx="290" cy="235" r="6" fill="#EEEDE5" stroke="#EEEDE5" stroke-width="1.2"/><circle data-vt-geometry="circle" data-vt-identity="24-g06" cx="390" cy="160" r="24" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="24-g07" d="M290 235L323.0 235.0A12 12 0 0 0 335.0 223.0L335.0 171.5A11.5 11.5 0 0 1 346.5 160.0L358 160" fill="none" stroke="#C2C7BA" stroke-width="1.3"/><circle data-vt-geometry="circle" data-vt-identity="24-g08" cx="390" cy="310" r="24" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="24-g09" d="M290 235L323.0 235.0A12 12 0 0 1 335.0 247.0L335.0 298.5A11.5 11.5 0 0 0 346.5 310.0L358 310" fill="none" stroke="#C2C7BA" stroke-width="1.3"/><text x="80" y="326" font-size="18" fill="#EEEDE5" text-anchor="middle" font-weight="400">局部</text><text x="332" y="415" font-size="17" fill="#EEEDE5" text-anchor="middle" font-weight="400">更长时间／更大系统</text><text x="20" y="445" font-size="17" fill="#B1B5A8">保留同一对象，检查更大范围带来的联系。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">矩形是观察范围；标记点是同一对象，外圆是关联对象。</text><text x="20" y="566" font-size="15" fill="#B1B5A8">正式图保留图形身份与关系；文字附着，不替换图形。</text></svg>