<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2850" viewBox="0 0 2200 2850" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">怎样装出一个心仪又实用的家？</title><desc id="d">四个相交的大圆分别界定真心喜欢、日常好用、现实做得成和长期住得下去四类需要满足的条件。中心亮色交集表示目标：同一版整屋方案同时满足四项。交叠处检视审美与日常、感受与维护、功能与实施、当下投入与长期使用的联系。读者放入一个全屋方案或具体选择，改变实现方式后，回查四种条件。图没有填写户型、预算或家庭背景，也不表示已有方案通过检验。</desc><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect data-decoration="background" width="2200" height="2850" fill="#191A18"/><text x="90.0000" y="110.0000" font-size="44" fill="#EFEEE7" text-anchor="start" font-weight="600">怎样装出一个心仪又实用的家？</text><text x="90.0000" y="158.0000" font-size="24" fill="#B0B2A8" text-anchor="start" font-weight="400">How can I create a home I love and enjoy living in?</text><path data-decoration="rule" d="M90 190H1130" fill="none" stroke="#686E63" stroke-width="1.2"/><circle id="love" data-node="" data-vt-geometry="condition-boundary" cx="790" cy="1030" r="550" fill="none" stroke="#EFEEE7" stroke-width="1.8"/><circle id="use" data-node="" data-vt-geometry="condition-boundary" cx="1410" cy="1030" r="550" fill="none" stroke="#EFEEE7" stroke-width="1.8"/><circle id="last" data-node="" data-vt-geometry="condition-boundary" cx="790" cy="1650" r="550" fill="none" stroke="#EFEEE7" stroke-width="1.8"/><circle id="realise" data-node="" data-vt-geometry="condition-boundary" cx="1410" cy="1650" r="550" fill="none" stroke="#EFEEE7" stroke-width="1.8"/><path id="shared" data-node="" data-vt-geometry="intersection-of-four" d="M1100 1195.68733A550 550 0 0 1 1244.31267 1340A550 550 0 0 1 1100 1484.31267A550 550 0 0 1 955.68733 1340A550 550 0 0 1 1100 1195.68733Z" fill="#EFEEE7"/><text x="1100.0000" y="1297.0000" font-size="28" fill="#191A18" text-anchor="middle" font-weight="500" data-in-node="shared" data-padding="12">同一版</text><text x="1100.0000" y="1348.0000" font-size="36" fill="#191A18" text-anchor="middle" font-weight="600" data-in-node="shared" data-padding="12">整屋方案</text><text x="1100.0000" y="1394.0000" font-size="18" fill="#191A18" text-anchor="middle" font-weight="400" data-in-node="shared" data-padding="12">四处同时过得去</text><text x="440.0000" y="790.0000" font-size="43" fill="#EFEEE7" text-anchor="start" font-weight="600" data-in-node="love" data-padding="18">真心喜欢</text><text x="440.0000" y="851.0000" font-size="26" fill="#EFEEE7" text-anchor="start" font-weight="400" data-in-node="love" data-padding="18">什么让你想待在家里？</text><text x="440.0000" y="899.0000" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400" data-in-node="love" data-padding="18">光、颜色、材质、触感与留白</text><text x="440.0000" y="941.0000" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400" data-in-node="love" data-padding="18">参考图里，哪些感受值得留下？ [1]</text><text x="1460.0000" y="790.0000" font-size="43" fill="#EFEEE7" text-anchor="start" font-weight="600" data-in-node="use" data-padding="18">日常好用</text><text x="1460.0000" y="851.0000" font-size="26" fill="#EFEEE7" text-anchor="start" font-weight="400" data-in-node="use" data-padding="18">谁来用，怎样度过一天？</text><text x="1460.0000" y="899.0000" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400" data-in-node="use" data-padding="18">吃睡、洗晒、收纳、清洁、共处</text><text x="1460.0000" y="941.0000" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400" data-in-node="use" data-padding="18">光、空气、温度、声音是否舒服？ [2]</text><text x="440.0000" y="1845.0000" font-size="43" fill="#EFEEE7" text-anchor="start" font-weight="600" data-in-node="last" data-padding="18">住得长久</text><text x="440.0000" y="1906.0000" font-size="26" fill="#EFEEE7" text-anchor="start" font-weight="400" data-in-node="last" data-padding="18">住几年后，还轻松吗？</text><text x="440.0000" y="1954.0000" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400" data-in-node="last" data-padding="18">清洁、检修、能耗、更换与生活变化</text><text x="440.0000" y="1996.0000" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400" data-in-node="last" data-padding="18">哪些难改，哪些可以为以后留余地？ [1,3]</text><text x="1460.0000" y="1845.0000" font-size="43" fill="#EFEEE7" text-anchor="start" font-weight="600" data-in-node="realise" data-padding="18">现实做得成</text><text x="1460.0000" y="1906.0000" font-size="26" fill="#EFEEE7" text-anchor="start" font-weight="400" data-in-node="realise" data-padding="18">这套房和投入，允许怎么做？</text><text x="1460.0000" y="1954.0000" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400" data-in-node="realise" data-padding="18">现状、总费用、工期、施工与验收</text><text x="1460.0000" y="1996.0000" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400" data-in-node="realise" data-padding="18">现场和样板能核实吗？ [2,3]</text><text x="1100.0000" y="795.0000" font-size="25" fill="#EFEEE7" text-anchor="middle" font-weight="500">这种喜欢，支持怎样的日常？</text><text x="1100.0000" y="838.0000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400">把家具、物品和人的活动放进去。</text><text x="520.0000" y="1317.0000" font-size="23" fill="#EFEEE7" text-anchor="middle" font-weight="500">喜欢，也愿意长期打理吗？</text><text x="520.0000" y="1360.0000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400">换种材料，感受与维护怎样变？</text><text x="1680.0000" y="1317.0000" font-size="23" fill="#EFEEE7" text-anchor="middle" font-weight="500">这份好用，怎样被做出来？</text><text x="1680.0000" y="1360.0000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400">平面、家具、设备与费用一起核对。</text><text x="1100.0000" y="1900.0000" font-size="22" fill="#EFEEE7" text-anchor="middle" font-weight="500">现在的投入，换来怎样的久住？</text><text x="1100.0000" y="1940.0000" font-size="20" fill="#B0B2A8" text-anchor="middle" font-weight="400">哪些保留，哪些以后再做？</text><path data-decoration="rule" d="M900 2500H2110" fill="none" stroke="#686E63" stroke-width="1.2"/><text x="2110.0000" y="2546.0000" font-size="26" fill="#EFEEE7" text-anchor="end" font-weight="500">先放入一个选择：换掉它，另外几圈会跟着改变什么？</text><text x="2110.0000" y="2590.0000" font-size="20" fill="#B0B2A8" text-anchor="end" font-weight="400">例如想要整洁：整墙柜、成品收纳与物品减量，能否服务同一个目的？</text><text x="2110.0000" y="2631.0000" font-size="18" fill="#B0B2A8" text-anchor="end" font-weight="400">圆＝需满足的一类条件；交叠＝同时考虑。中心为目标，不表示方案已被验证。</text><text x="2110.0000" y="2692.0000" font-size="15" fill="#B0B2A8" text-anchor="end" font-weight="400">[1] RIBA. Working with an architect for your home. riba.org/media/ktsfkg3c/riba-workingwithanarchitectforyourhome-2021.pdf</text><text x="2110.0000" y="2728.0000" font-size="15" fill="#B0B2A8" text-anchor="end" font-weight="400">[2] YourHome. Designing a house. yourhome.gov.au/buy-build-renovate/design-house</text><text x="2110.0000" y="2764.0000" font-size="15" fill="#B0B2A8" text-anchor="end" font-weight="400">[3] YourHome. Renovations and additions. yourhome.gov.au/buy-build-renovate/renovations-and-additions</text><text x="2110.0000" y="2802.0000" font-size="15" fill="#B0B2A8" text-anchor="end" font-weight="400">来源用于核对考虑范围；问题与几何为本图编排。圆的大小、位置不编码权重、预算或通过率。</text></svg>