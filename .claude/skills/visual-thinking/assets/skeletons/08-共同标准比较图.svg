<text x="90" y="120" font-size="54" fill="var(--vt-ink)" text-anchor="start" font-weight="600">比较地图：按同一标准看两边</text>
<text x="90" y="180" font-size="30" fill="var(--vt-muted)" text-anchor="start" font-weight="400">Compare Map</text>
