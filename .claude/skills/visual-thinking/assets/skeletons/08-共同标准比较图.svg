<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2500" viewBox="0 0 1800 2500" role="img" aria-labelledby="title" aria-describedby="desc">
<title id="title">比较地图：按同一标准看两边</title>
<desc id="desc">按用户所提供Compare Map页面的关系重绘：左右两个圆是比较对象，中间五个方框是双方共用的比较标准。每一条横向连接将同一标准与左右对象相连，连接两旁的空位用于写入两者在该标准下的表现与例证。左右纵向主干分别保持同一对象的身份。标准不是两者的共同点，线条不表示顺序或因果。读者选择比较维度，逐项对照双方，不以一个对象的一项优点替代另一方不同维度的证据。本图采用自主排版，不复制书页样式。</desc>
<style data-vt-theme="">:root{--vt-bg:#191A18;--vt-ink:#EFEEE7;--vt-muted:#B0B2A8;--vt-accent:#EFEEE7;--vt-surface:#272925;--vt-secondary:#383B34;--vt-line:1.8;--vt-title:54px;--vt-section:32px;--vt-label:24px;--vt-note:19px;}text{font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Helvetica Neue",sans-serif}</style>
