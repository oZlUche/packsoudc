<text x="1710" y="2290" font-size="29" fill="var(--vt-ink)" text-anchor="end" font-weight="500">中间是比较的尺子，左右是各自的表现。</text>
<text x="1710" y="2338" font-size="23" fill="var(--vt-muted)" text-anchor="end" font-weight="400">沿同一个标准看两边，再用具体例证核对差异。</text>
<text x="1710" y="2381" font-size="21" fill="var(--vt-muted)" text-anchor="end" font-weight="400">标准数量按问题增减；不预填评分，也不强求选出赢家。</text>
<text x="1710" y="2441" font-size="17" fill="var(--vt-muted)" text-anchor="end" font-weight="400">依据用户提供的 Compare Map 参考关系自主重绘；不是共有与独有图。</text>
