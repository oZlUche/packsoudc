<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2200" viewBox="0 0 2400 2200" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">同一个结果，可以怎样构成？</title><desc id="desc">两组因素框用乘法连接，右侧汇向同一个结果量。式子表达数量恒等关系而非经验因果；实际使用需填入公式、单位、数值和约束。</desc><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4" /></marker></defs><rect width="2400" height="2200" fill="#191A18" data-decoration="background" /><text x="120" y="155" fill="#EFEEE7" font-size="64" text-anchor="start" font-weight="600">同一个结果，可以怎样构成？</text><text x="120" y="232" fill="#B0B2A8" font-size="34" text-anchor="start" font-weight="400">Quantitative factors and equivalent combinations</text><path d="M120 290H1750" stroke="#50554C" data-decoration="separator" /><rect id="q" data-node="" x="260" y="720" width="380" height="220" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="450.0" y="815.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="q" data-padding="18">因素 A</text><text x="450.0" y="869.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="q" data-padding="18">量／单位</text><rect id="p" data-node="" x="1030" y="720" width="380" height="220" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="1220.0" y="815.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="p" data-padding="18">因素 B</text><text x="1220.0" y="869.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="p" data-padding="18">量／单位</text><rect id="q2" data-node="" x="260" y="1270" width="380" height="220" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="450.0" y="1365.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="q2" data-padding="18">因素 A′</text><text x="450.0" y="1419.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="q2" data-padding="18">量／单位</text><rect id="p2" data-node="" x="1030" y="1270" width="380" height="220" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="1220.0" y="1365.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="p2" data-padding="18">因素 B′</text><text x="1220.0" y="1419.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="p2" data-padding="18">量／单位</text><text x="835" y="855" fill="#EFEEE7" font-size="72" text-anchor="middle" font-weight="300">×</text><text x="835" y="1405" fill="#EFEEE7" font-size="72" text-anchor="middle" font-weight="300">×</text><circle id="result" data-node="" cx="1970" cy="1105" r="160" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="2.2" /><text x="1970" y="1090.0" fill="#191A18" font-size="36" text-anchor="middle" font-weight="500" data-in-node="result" data-padding="12">同一结果</text><text x="1970" y="1144.0" fill="#191A18" font-size="36" text-anchor="middle" font-weight="500" data-in-node="result" data-padding="12">R</text><path d="M1422 830H1628A12 12 0 0 1 1640 842V1093A12 12 0 0 0 1652 1105H1798" fill="none" stroke="#EFEEE7" stroke-width="2.2" /><path d="M1422 1380H1628A12 12 0 0 0 1640 1368V1117A12 12 0 0 1 1652 1105H1798" fill="none" stroke="#EFEEE7" stroke-width="2.2" /><text x="1740" y="1060" fill="#EFEEE7" font-size="42" text-anchor="middle" font-weight="400">＝</text><text x="1200" y="560" fill="#EFEEE7" font-size="43" text-anchor="middle" font-weight="500">示例关系：R ＝ A × B ＝ A′ × B′</text><path d="M450 952V1248" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" /><path d="M1220 952V1248" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" /><text x="450" y="1120" fill="#B0B2A8" font-size="29" text-anchor="middle" font-weight="400">改一个因素</text><text x="1220" y="1120" fill="#B0B2A8" font-size="29" text-anchor="middle" font-weight="400">另一项须怎样配合？</text><path d="M850 1840H2280" stroke="#50554C" data-decoration="separator" /><text x="2280" y="1910" fill="#EFEEE7" font-size="38" text-anchor="end" font-weight="500">相同总量，不代表相同代价或可行性。</text><text x="2280" y="1970" fill="#B0B2A8" font-size="29" text-anchor="end" font-weight="400">乘法仅作结构示意；先确认公式，单位、取值范围和现实约束都要保留。</text><text x="120" y="2070" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">方法用途：Graphic Organizers 原书 Math Factors Organizer（书内58–61页文字核对）</text><text x="120" y="2109" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">moodley2023.eduhk.hk/pluginfile.php/126330/mod_folder/content/0/Ref%20for%20Tutors_Graphic%20Organisers%201.pdf ｜自主改编；示意公式。</text></svg>