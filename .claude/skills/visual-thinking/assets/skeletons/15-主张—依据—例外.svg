<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2200" viewBox="0 0 2400 2200" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">主张与依据：中间还缺哪一步？</title><desc id="desc">左侧证据连接右侧主张，上方推理依据支撑这一推断，下方例外分别检验推断和主张范围。推理依据也有其支撑。箭头为论证支持，不是时间或因果。</desc><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4" /></marker></defs><rect width="2400" height="2200" fill="#191A18" data-decoration="background" /><text x="120" y="155" fill="#EFEEE7" font-size="64" text-anchor="start" font-weight="600">主张与依据：中间还缺哪一步？</text><text x="120" y="232" fill="#B0B2A8" font-size="34" text-anchor="start" font-weight="400">Grounds, warrant, claim and exceptions</text><path d="M120 290H1750" stroke="#50554C" data-decoration="separator" /><rect id="ground" data-node="" x="220" y="1000" width="430" height="230" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="435.0" y="1100.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="ground" data-padding="18">观察与证据</text><text x="435.0" y="1154.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="ground" data-padding="18">来自哪里？</text><rect id="warrant" data-node="" x="980" y="570" width="430" height="180" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="1195.0" y="645.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="warrant" data-padding="18">推理依据</text><text x="1195.0" y="699.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="warrant" data-padding="18">为何能推出？</text><circle id="claim" data-node="" cx="1950" cy="1115" r="165" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="2.2" /><text x="1950" y="1100.0" fill="#191A18" font-size="36" text-anchor="middle" font-weight="500" data-in-node="claim" data-padding="12">待检验</text><text x="1950" y="1154.0" fill="#191A18" font-size="36" text-anchor="middle" font-weight="500" data-in-node="claim" data-padding="12">主张</text><path d="M662 1115H1770" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" data-edge="" data-from="ground" data-to="claim" id="gc" data-allow-overlap="inference" data-overlap-reason="The inference junction intentionally lies on the evidence-to-claim link; the warrant targets this inference, not a temporal step." /><circle id="inference" data-node="" cx="1195" cy="1115" r="5" fill="#EFEEE7" /><path d="M1195 762V1098" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" data-edge="" data-from="warrant" data-to="inference" id="wi" /><text x="1235" y="910" fill="#B0B2A8" font-size="28" text-anchor="start" font-weight="400">支持这一步推断</text><text x="1510" y="1055" fill="#B0B2A8" font-size="28" text-anchor="middle" font-weight="400">在何范围内成立？</text><rect id="backing" data-node="" x="220" y="570" width="430" height="180" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="435.0" y="645.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="backing" data-padding="18">依据本身</text><text x="435.0" y="699.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="backing" data-padding="18">有什么支持？</text><path d="M662 660H968" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" data-edge="" data-from="backing" data-to="warrant" id="bw" /><rect id="exception" data-node="" x="980" y="1470" width="430" height="190" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="1195.0" y="1550.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="exception" data-padding="18">反证／例外</text><text x="1195.0" y="1604.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="exception" data-padding="18">哪一步会失效？</text><path d="M1195 1458V1132" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 10" data-edge="" data-from="exception" data-to="inference" id="ei" /><path d="M1422 1565H1938A12 12 0 0 0 1950 1553V1292" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 10" data-edge="" data-from="exception" data-to="claim" id="ec" /><text x="1710" y="1635" fill="#B0B2A8" font-size="28" text-anchor="middle" font-weight="400">不成立时，收窄或放弃主张</text><path d="M850 1840H2280" stroke="#50554C" data-decoration="separator" /><text x="2280" y="1910" fill="#EFEEE7" font-size="38" text-anchor="end" font-weight="500">支持主张，还是只说出了一个事实？</text><text x="2280" y="1970" fill="#B0B2A8" font-size="29" text-anchor="end" font-weight="400">虚线＝例外检验；证据数量不等于支持强度。</text><text x="120" y="2070" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">方法：Toulmin 论证结构；用途核对：Purdue OWL · Toulmin Argument</text><text x="120" y="2109" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">owl.purdue.edu/owl/general_writing/academic_writing/historical_perspectives_on_argumentation/toulmin_argument.html ｜自主编排，非原站模板。</text></svg>