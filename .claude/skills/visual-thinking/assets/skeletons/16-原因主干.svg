<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">原因主干</title><desc id="desc">候选原因汇向同一结果，保留待查。 图形身份：原因候选节点及结果端点。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">16</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">原因主干</text><path data-vt-geometry="path" data-vt-identity="16-g01" d="M65 240L433 240" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="16-g02" cx="450" cy="240" r="6" fill="#191A18" stroke="#EEEDE5" stroke-width="1.2"/><circle data-vt-geometry="circle" data-vt-identity="16-g03" cx="160" cy="125" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="16-g04" d="M160 148L160 232" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="16-g05" cx="320" cy="125" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="16-g06" d="M320 148L320 232" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="16-g07" cx="220" cy="355" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="16-g08" d="M220 332L220 248" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="16-g09" cx="365" cy="355" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="16-g10" d="M365 332L365 248" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><text x="20" y="445" font-size="17" fill="#B1B5A8">候选原因汇向同一结果，保留待查。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">圆是候选原因；主干端点是待解释结果。</text><text x="20" y="566" font-size="15" fill="#B1B5A8">正式图保留图形身份与关系；文字附着，不替换图形。</text></svg>