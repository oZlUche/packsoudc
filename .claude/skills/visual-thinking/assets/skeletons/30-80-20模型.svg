<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1240" viewBox="0 0 1400 1240" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">80/20 模型</title><desc id="d">两个等大的饼图，左侧高亮百分之二十的项目，右侧高亮百分之八十的贡献。比例为模型示意，不是实测数据。 图形身份：两个不同分母的饼图及比例扇区。成图保留这些几何对象及关系，文字作为标签附着。</desc><rect width="1400" height="1240" fill="#191C17"/><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><text x="90" y="110" font-size="24" fill="#A9ADA1" text-anchor="start" font-weight="400">30</text><text x="820" y="104" font-size="42" fill="#EEEFE7" text-anchor="start" font-weight="600">80/20 模型</text><text x="820" y="145" font-size="23" fill="#A9ADA1" text-anchor="start" font-weight="400">The Pareto Principle</text><path data-vt-geometry="path" data-vt-identity="30-g01" d="M820 172H1310" stroke="#51574B"/><text x="820" y="211" font-size="22" fill="#A9ADA1" text-anchor="start" font-weight="400">少数项目，可能对应多数贡献。</text><circle data-vt-geometry="circle" data-vt-identity="30-g02" cx="385" cy="670" r="185" stroke="#EEEFE7" stroke-width="1.8" fill="none"/><path data-vt-geometry="path" data-vt-identity="30-g03" d="M385 670L385 485A185 185 0 0 1 560.9454555146034 612.8318560406348Z" fill="#EEEFE7"/><text x="385" y="432" font-size="34" fill="#EEEFE7" text-anchor="middle" font-weight="500">20% 的项目</text><circle data-vt-geometry="circle" data-vt-identity="30-g04" cx="1015" cy="670" r="185" stroke="#EEEFE7" stroke-width="1.8" fill="none"/><path data-vt-geometry="path" data-vt-identity="30-g05" d="M1015 670L1015 485A185 185 0 1 1 839.0545444853966 612.8318560406348Z" fill="#EEEFE7"/><text x="1015" y="432" font-size="34" fill="#EEEFE7" text-anchor="middle" font-weight="500">80% 的贡献</text><text x="700" y="678" font-size="21" fill="#A9ADA1" text-anchor="middle" font-weight="400">对应</text><text x="700" y="917" font-size="20" fill="#A9ADA1" text-anchor="middle" font-weight="400">示意比例 · 实际占比需用数据确认</text><path data-vt-geometry="path" data-vt-identity="30-g06" d="M90 1090H1310" stroke="#51574B"/><text x="90" y="1130" font-size="24" fill="#EEEFE7" text-anchor="start" font-weight="500">先找贡献集中在哪里，再决定优先做什么。</text><text x="90" y="1170" font-size="17" fill="#A9ADA1" text-anchor="start" font-weight="400">数量与贡献是不同分母；80/20 不是固定规律，其余部分也不等于无用。</text><text x="90" y="1207" font-size="16" fill="#A9ADA1" text-anchor="start" font-weight="400">参考：ASQ · Pareto Chart · asq.org/quality-resources/pareto；模型来源及使用边界见说明。</text></svg>