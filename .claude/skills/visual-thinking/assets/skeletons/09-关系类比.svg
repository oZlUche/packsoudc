<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">关系类比</title><desc id="d">比较两组对象的关系，不只比较外形。 图形身份：两组配对对象与相同关系。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">09</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">关系类比</text><circle data-vt-geometry="circle" data-vt-identity="09-g01" cx="110" cy="145" r="30" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><circle data-vt-geometry="circle" data-vt-identity="09-g02" cx="390" cy="145" r="30" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="09-g03" d="M140 145L352 145" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><text x="250" y="126" font-size="17" fill="#B1B5A8" text-anchor="middle" font-weight="400">同一种关系？</text><circle data-vt-geometry="circle" data-vt-identity="09-g04" cx="110" cy="325" r="30" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><circle data-vt-geometry="circle" data-vt-identity="09-g05" cx="390" cy="325" r="30" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="09-g06" d="M140 325L352 325" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><text x="250" y="306" font-size="17" fill="#B1B5A8" text-anchor="middle" font-weight="400">同一种关系？</text><path data-vt-geometry="path" data-vt-identity="09-g07" d="M110 182L110 288" fill="none" stroke="#63695D" stroke-width="1.3" stroke-dasharray="3 6"/><path data-vt-geometry="path" data-vt-identity="09-g08" d="M390 182L390 288" fill="none" stroke="#63695D" stroke-width="1.3" stroke-dasharray="3 6"/><text x="20" y="445" font-size="17" fill="#B1B5A8">比较两组对象的关系，不只比较外形。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">四个圆是两组具体对象；横线比较同一种关系。</text><text x="20" y="566" font-size="15" fill="#B1B5A8">正式图保留图形身份与关系；文字附着，不替换图形。</text></svg>