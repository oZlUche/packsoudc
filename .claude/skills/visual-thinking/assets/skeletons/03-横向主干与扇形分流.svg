<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="2040" viewBox="0 0 2500 2040" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">主干展开与交叉流动</title><desc id="d">横向骨架：左方来源经过中转后，从共同分流点向右侧半环上的A至G七个去向展开。来源和中转圆相对上一版直径翻倍，去向圆至少翻倍，下方E、F、G逐级加大。外置虚线从A指向F，表示可选的去向间转交。圆大小只是当前视觉比例，不编码数量或重要性。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="10" refY="6" viewBox="0 0 12 12" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.35"/></marker><marker id="subarrow" markerWidth="8" markerHeight="8" refX="10" refY="6" viewBox="0 0 12 12" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#B0B2A8" stroke-width="1.35"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect data-decoration="background" width="2500" height="2040" fill="#191A18"/><text x="90.0000" y="110.0000" font-size="44" fill="#EFEEE7" text-anchor="start" font-weight="600">主干展开与交叉流动</text><text x="90.0000" y="158.0000" font-size="24" fill="#B0B2A8" text-anchor="start" font-weight="400">A shared route, multiple destinations, further connections.</text><path d="M90 190H1060" fill="none" stroke="#686E63" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" data-decoration="rule"/><path d="M1232.0000 464.0000V452A12 12 0 0 1 1244.0000 440H2148A12 12 0 0 1 2160 452V1389.8358A12 12 0 0 1 2148 1401.8358H1576.0000" fill="none" stroke="#B0B2A8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 8" marker-end="url(#subarrow)" id="secondary" data-edge="" data-from="target-A" data-to="target-F"/><text x="2210.0000" y="785.0000" font-size="24" fill="#B0B2A8" text-anchor="start" font-weight="400">A → F</text><text x="2210.0000" y="825.0000" font-size="21" fill="#B0B2A8" text-anchor="start" font-weight="400">可选转交</text><path d="M1005.1369 999.9545A290.0000 290.0000 0 0 0 1270.7136 606.0090" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" id="flow-A" data-edge="" data-from="split" data-to="target-A"/><path d="M1005.3535 999.9694A468.8084 468.8084 0 0 0 1445.8573 676.0798" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" id="flow-B" data-edge="" data-from="split" data-to="target-B"/><path d="M1005.5121 999.9845A981.8358 981.8358 0 0 0 1570.6859 817.1130" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" id="flow-C" data-edge="" data-from="split" data-to="target-C"/><path d="M1007 1000H1616.0000" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" id="flow-D" data-edge="" data-from="split" data-to="target-D"/><path d="M1005.5121 1000.0155A981.8358 981.8358 0 0 1 1557.5777 1173.6844" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" id="flow-E" data-edge="" data-from="split" data-to="target-E"/><path d="M1005.3535 1000.0306A468.8084 468.8084 0 0 1 1434.8732 1293.6895" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" id="flow-F" data-edge="" data-from="split" data-to="target-F"/><path d="M1005.1369 1000.0455A290.0000 290.0000 0 0 1 1284.3078 1347.1758" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" id="flow-G" data-edge="" data-from="split" data-to="target-G"/><path d="M326 1000H418" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" id="incoming" data-edge="" data-from="source" data-to="transfer"/><path d="M682 1000H986" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" id="shared" data-edge="" data-from="transfer" data-to="split"/><circle id="target-A" data-node="" cx="1232.0000" cy="536.0000" r="72" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="1232.0000" y="547.2000" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="target-A" data-padding="12">A</text><circle id="target-B" data-node="" cx="1464.0000" cy="598.1642" r="72" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="1464.0000" y="609.3642" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="target-B" data-padding="12">B</text><circle id="target-C" data-node="" cx="1633.8358" cy="768.0000" r="72" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="1633.8358" y="779.2000" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="target-C" data-padding="12">C</text><circle id="target-D" data-node="" cx="1696.0000" cy="1000.0000" r="72" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="1696.0000" y="1011.2000" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="target-D" data-padding="12">D</text><circle id="target-E" data-node="" cx="1633.8358" cy="1232.0000" r="88" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="1633.8358" y="1243.2000" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="target-E" data-padding="12">E</text><circle id="target-F" data-node="" cx="1464.0000" cy="1401.8358" r="104" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="1464.0000" y="1413.0358" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="target-F" data-padding="12">F</text><circle id="target-G" data-node="" cx="1232.0000" cy="1464.0000" r="120" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="1232.0000" y="1475.2000" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="target-G" data-padding="12">G</text><circle id="split" data-node="" cx="1000.0000" cy="1000.0000" r="6" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.8"/><circle id="transfer" data-node="" cx="550.0000" cy="1000.0000" r="124" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="550.0000" y="1011.2000" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="transfer" data-padding="12">中转</text><circle id="source" data-node="" cx="210.0000" cy="1000.0000" r="108" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="210.0000" y="1011.2000" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="source" data-padding="12">来源</text><text x="1000.0000" y="1090.0000" font-size="22" fill="#B0B2A8" text-anchor="middle" font-weight="400">共同分流点</text><text x="550.0000" y="1190.0000" font-size="22" fill="#B0B2A8" text-anchor="middle" font-weight="400">经过同一个中间环节</text><text x="210.0000" y="1170.0000" font-size="22" fill="#B0B2A8" text-anchor="middle" font-weight="400">同一批对象</text><text x="90.0000" y="1450.0000" font-size="26" fill="#EFEEE7" text-anchor="start" font-weight="500">沿任一去向回看</text><text x="90.0000" y="1495.0000" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">如果中转环节停住，</text><text x="90.0000" y="1534.0000" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">哪些路径需要另找来路？</text><path d="M1300 1825H2410" fill="none" stroke="#686E63" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" data-decoration="rule"/><text x="2410.0000" y="1870.0000" font-size="26" fill="#EFEEE7" text-anchor="end" font-weight="500">实线＝主流向；虚线＝可选的去向间转交。</text><text x="2410.0000" y="1916.0000" font-size="20" fill="#B0B2A8" text-anchor="end" font-weight="400">圆大小用于本次构图；当前不表示流量、数量或重要性。</text><text x="2410.0000" y="1957.0000" font-size="18" fill="#B0B2A8" text-anchor="end" font-weight="400">结构启发：用户提供的 The Economics of the Balkan Route（The Flows）图。</text><text x="2410.0000" y="1997.0000" font-size="18" fill="#B0B2A8" text-anchor="end" font-weight="400">横向比例试稿 · 主干与各去向保持同一网络 · 尚未收录进 skill</text></svg>