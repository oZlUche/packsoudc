<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">逆向追溯</title><desc id="d">从不想发生的结果，倒查可阻断的条件。 图形身份：不想要的结果及倒查条件节点。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">18</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">逆向追溯</text><circle data-vt-geometry="circle" data-vt-identity="18-g01" cx="415" cy="240" r="32" fill="#EEEDE5" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="18-g02" d="M383 240L250 240" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6"/><path data-vt-geometry="path" data-vt-identity="18-g03" d="M250 140L250 340" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6"/><path data-vt-geometry="path" data-vt-identity="18-g04" d="M250 140L157 140" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="18-g05" cx="120" cy="140" r="29" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="18-g06" d="M250 340L157 340" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="18-g07" cx="120" cy="340" r="29" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><text x="415" y="300" font-size="17" fill="#EEEDE5" text-anchor="middle" font-weight="400">不想要的结果</text><text x="250" y="395" font-size="16" fill="#B1B5A8" text-anchor="middle" font-weight="400">箭头表示倒查</text><text x="20" y="445" font-size="17" fill="#B1B5A8">从不想发生的结果，倒查可阻断的条件。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">实心圆是结果；空心圆是倒查的条件。</text><text x="20" y="566" font-size="15" fill="#B1B5A8">正式图保留图形身份与关系；文字附着，不替换图形。</text></svg>