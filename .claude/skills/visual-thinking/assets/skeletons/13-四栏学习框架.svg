<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">四栏学习框架</title><desc id="desc">已知 → 想知道 → 如何查 → 学到什么。 图形身份：四个学习区域及区域边界。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">13</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">四栏学习框架</text><rect data-vt-geometry="rect" data-vt-identity="13-g01" x="45" y="135" width="410" height="220" fill="none" stroke="#EEEDE5" stroke-width="1.7"/><path data-vt-geometry="path" data-vt-identity="13-g02" d="M147.5 135L147.5 355" fill="none" stroke="#63695D" stroke-width="1"/><path data-vt-geometry="path" data-vt-identity="13-g03" d="M250 135L250 355" fill="none" stroke="#63695D" stroke-width="1"/><path data-vt-geometry="path" data-vt-identity="13-g04" d="M352.5 135L352.5 355" fill="none" stroke="#63695D" stroke-width="1"/><path data-vt-geometry="path" data-vt-identity="13-g05" d="M45 192L455 192" fill="none" stroke="#63695D" stroke-width="1"/><text x="96.25" y="173" font-size="23" fill="#EEEDE5" text-anchor="middle" font-weight="400">K</text><text x="198.75" y="173" font-size="23" fill="#EEEDE5" text-anchor="middle" font-weight="400">W</text><text x="301.25" y="173" font-size="23" fill="#EEEDE5" text-anchor="middle" font-weight="400">H</text><text x="403.75" y="173" font-size="23" fill="#EEEDE5" text-anchor="middle" font-weight="400">L</text><text x="20" y="445" font-size="17" fill="#B1B5A8">已知 → 想知道 → 如何查 → 学到什么。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">四栏是实际承载区域；K、W、H、L 是各区标签。</text><text x="20" y="5