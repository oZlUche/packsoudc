<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1660" viewBox="0 0 1400 1660" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">把一件事，放回人物与处境中</title><desc id="desc">同一个时地情境框中，人物从各自位置接入同一冲突。一条横轴追踪初始处境、尝试、结果；问题标记横在想要达成的目标前。结果是否实现目标需要核对，不由位置或先后自动推出因果。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect data-decoration="background" width="1400" height="1660" fill="#191A18"/><text x="90" y="110" font-size="42" fill="#EFEEE7" text-anchor="start" font-weight="600">把一件事，放回人物与处境中</text><text x="90" y="157" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">Trace the event through people, conflict and change.</text><path data-decoration="guide" d="M90 192H1050" fill="none" stroke="#676C62" stroke-width="1"/><rect id="scene" data-node="" x="120" y="495" width="1160" height="755" rx="0" fill="#191A18" stroke="#676C62" stroke-width="1.8"/><text x="160" y="539" font-size="21" fill="#B0B2A8" text-anchor="start" font-weight="400">同一时地／情境：哪些规则、限制与背景需要先知道？</text><circle id="person-a" data-node="" cx="350" cy="700" r="84" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="350" y="707" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="person-a" data-padding="12">人物 A</text><circle id="person-b" data-node="" cx="1050" cy="700" r="84" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="1050" y="707" font-size="27" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="person-b" data-padding="12">人物 B</text><text x="350" y="591" font-size="21" fill="#B0B2A8" text-anchor="middle" font-weight="400">想要什么？</text><text x="1050" y="591" font-size="21" fill="#B0B2A8" text-anchor="middle" font-weight="400">在意什么？</text><rect id="conflict" data-node="" x="555" y="650" width="290" height="100" rx="0" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="700" y="694" font-size="26" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="conflict" data-padding="12">阻碍／冲突</text><text x="700" y="728" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400" data-in-node="conflict" data-padding="12">为什么不能直接做到？</text><path id="acon" data-edge="" data-allow-overlap="scene" data-overlap-reason="连线在共同情境容器内部；容器不是阻挡路径的对象" data-from="person-a" data-to="conflict" d="M442 700H543" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arrow)"/><path id="bcon" data-edge="" data-allow-overlap="scene" data-overlap-reason="连线在共同情境容器内部；容器不是阻挡路径的对象" data-from="person-b" data-to="conflict" d="M958 700H857" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arrow)"/><path id="caction" data-edge="" data-allow-overlap="scene" data-overlap-reason="连线在共同情境容器内部；容器不是阻挡路径的对象" data-from="conflict" data-to="act" d="M700 758V958" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 8"/><text x="730" y="875" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">于是怎样应对？</text><circle id="before" data-node="" cx="300" cy="1050" r="80" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="300" y="1060" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="before" data-padding="12">初始处境</text><text x="300" y="1190" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400">事情开始时，是什么样？</text><circle id="act" data-node="" cx="700" cy="1050" r="80" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="700" y="1060" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="act" data-padding="12">尝试／行动</text><text x="700" y="1190" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400">实际做了什么？</text><circle id="after" data-node="" cx="1100" cy="1050" r="80" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="1100" y="1060" font-size="24" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="after" data-padding="12">结果</text><text x="1100" y="1190" font-size="19" fill="#B0B2A8" text-anchor="middle" font-weight="400">最后观察到什么变化？</text><path id="step1" data-edge="" data-allow-overlap="scene" data-overlap-reason="连线在共同情境容器内部；容器不是阻挡路径的对象" data-from="before" data-to="act" d="M388 1050H608" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arrow)"/><path id="step2" data-edge="" data-allow-overlap="scene" data-overlap-reason="连线在共同情境容器内部；容器不是阻挡路径的对象" data-from="act" data-to="after" d="M788 1050H1008" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arrow)"/><text x="500" y="1012" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400">发生在先</text><text x="900" y="1012" font-size="18" fill="#B0B2A8" text-anchor="middle" font-weight="400">发生在后</text><path data-decoration="guide" d="M450 1430H1310" fill="none" stroke="#676C62" stroke-width="1"/><text x="1310" y="1476" font-size="24" fill="#EFEEE7" text-anchor="end" font-weight="500">换到另一位人物的位置：同一结果，还算解决了吗？</text><text x="1310" y="1518" font-size="18" fill="#B0B2A8" text-anchor="end" font-weight="400">圆＝同一事件中的人物与状态；外框＝共同情境；先后不自动等于因果。</text><text x="1310" y="1572" font-size="14" fill="#B0B2A8" text-anchor="end" font-weight="400">方法依据：ReadWriteThink · Story Map · 人物、情境、冲突与解决</text><text x="1310" y="1602" font-size="14" fill="#B0B2A8" text-anchor="end" font-weight="400">readwritethink.org/classroom-resources/student-interactives/story ｜关系与版式为自主编排。</text></svg>