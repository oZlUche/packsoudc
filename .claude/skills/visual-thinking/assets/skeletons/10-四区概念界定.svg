<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1660" viewBox="0 0 1400 1660" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">这个概念，到底指什么？</title><desc id="desc">四个实际承载区域围绕同一个概念：定义、可辨认特征、例子、反例。比较例子和反例后回查定义；外框注记使用情境。图为四区概念学习方法的自主排版，不是机构模板。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect data-decoration="background" width="1400" height="1660" fill="#191A18"/><text x="90" y="110" font-size="42" fill="#EFEEE7" text-anchor="start" font-weight="600">这个概念，到底指什么？</text><text x="90" y="157" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">Define the concept. Test its boundary.</text><path data-decoration="guide" d="M90 192H1050" fill="none" stroke="#676C62" stroke-width="1"/><rect id="field" data-node="" x="120" y="495" width="1160" height="755" rx="0" fill="#191A18" stroke="#676C62" stroke-width="1.8"/><path data-decoration="guide" d="M700 495V785M700 895V1250" fill="none" stroke="#676C62" stroke-width="1"/><path data-decoration="guide" d="M120 840H1280" fill="none" stroke="#676C62" stroke-width="1"/><rect id="term" data-node="" x="510" y="790" width="380" height="100" rx="0" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.8"/><text x="700" y="853" font-size="27" fill="#191A18" text-anchor="middle" font-weight="500" data-in-node="term" data-padding="12">同一个待界定的概念</text><text x="165" y="558" font-size="30" fill="#EFEEE7" text-anchor="start" font-weight="500">01  定义</text><text x="165" y="615" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">用一句话，说清它是什么。</text><text x="165" y="655" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">放在哪个领域、哪种情境里？</text><path data-decoration="guide" d="M165 711H610" fill="none" stroke="#676C62" stroke-width="1"/><path data-decoration="guide" d="M165 765H610" fill="none" stroke="#676C62" stroke-width="1"/><text x="755" y="558" font-size="30" fill="#EFEEE7" text-anchor="start" font-weight="500">02  特征</text><text x="755" y="615" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">凭哪些特征，能够认出来？</text><text x="755" y="655" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">哪些必要，哪些只是经常出现？</text><path data-decoration="guide" d="M755 711H1200" fill="none" stroke="#676C62" stroke-width="1"/><path data-decoration="guide" d="M755 765H1200" fill="none" stroke="#676C62" stroke-width="1"/><text x="165" y="976" font-size="30" fill="#EFEEE7" text-anchor="start" font-weight="500">03  例子</text><text x="165" y="1033" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">挑一个明确属于它的对象。</text><text x="165" y="1073" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">再找一个不那么典型的例子。</text><path data-decoration="guide" d="M165 1129H610" fill="none" stroke="#676C62" stroke-width="1"/><path data-decoration="guide" d="M165 1183H610" fill="none" stroke="#676C62" stroke-width="1"/><text x="755" y="976" font-size="30" fill="#EFEEE7" text-anchor="start" font-weight="500">04  反例</text><text x="755" y="1033" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">挑一个很像、却不属于它的对象。</text><text x="755" y="1073" font-size="20" fill="#B0B2A8" text-anchor="start" font-weight="400">它究竟差在哪一个条件？</text><path data-decoration="guide" d="M755 1129H1200" fill="none" stroke="#676C62" stroke-width="1"/><path data-decoration="guide" d="M755 1183H1200" fill="none" stroke="#676C62" stroke-width="1"/><text x="120" y="457" font-size="18" fill="#B0B2A8" text-anchor="start" font-weight="400">使用情境：____________    判断依据：____________</text><path data-decoration="guide" d="M450 1430H1310" fill="none" stroke="#676C62" stroke-width="1"/><text x="1310" y="1476" font-size="24" fill="#EFEEE7" text-anchor="end" font-weight="500">拿一个边缘例子回来：原来的定义，还成立吗？</text><text x="1310" y="1518" font-size="18" fill="#B0B2A8" text-anchor="end" font-weight="400">四区是思考位置；内容由实际概念填写，不预填个人答案。</text><text x="1310" y="1572" font-size="14" fill="#B0B2A8" text-anchor="end" font-weight="400">方法依据：IRIS Center · Graphic Organizers · Frayer Model</text><text x="1310" y="1602" font-size="14" fill="#B0B2A8" text-anchor="end" font-weight="400">iris.peabody.vanderbilt.edu/activity/graphic-organizers/ ｜四区编排为自主绘制。</text></svg>