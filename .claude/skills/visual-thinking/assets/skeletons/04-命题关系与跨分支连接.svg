<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1660" viewBox="0 0 1400 1660" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">概念之间，究竟是什么关系？</title><desc id="desc">概念A在上，包含B和C；B需要D，C由E组成。每条关系带词，能够从头到尾读成命题。底部折线连接跨分支的D和E，虚线和标签表示该关系尚待查清。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect data-decoration="background" width="1400" height="1660" fill="#191A18"/><text x="90" y="110" font-size="42" fill="#EFEEE7" text-anchor="start" font-weight="600">概念之间，究竟是什么关系？</text><text x="90" y="157" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">Build propositions, then inspect the cross-links.</text><path data-decoration="guide" d="M90 192H1050" fill="none" stroke="#676C62" stroke-width="1"/><rect id="a" data-node="" x="560" y="490" width="280" height="100" rx="0" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="700" y="552" font-size="30" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="a" data-padding="12">概念 A</text><rect id="b" data-node="" x="210" y="760" width="280" height="100" rx="0" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="350" y="822" font-size="30" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="b" data-padding="12">概念 B</text><rect id="c" data-node="" x="910" y="760" width="280" height="100" rx="0" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="1050" y="822" font-size="30" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="c" data-padding="12">概念 C</text><rect id="d" data-node="" x="210" y="1080" width="280" height="100" rx="0" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="350" y="1142" font-size="30" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="d" data-padding="12">概念 D</text><rect id="e" data-node="" x="910" y="1080" width="280" height="100" rx="0" fill="#191A18" stroke="#EFEEE7" stroke-width="1.8"/><text x="1050" y="1142" font-size="30" fill="#EFEEE7" text-anchor="middle" font-weight="500" data-in-node="e" data-padding="12">概念 E</text><path id="ab" data-edge="" data-from="a" data-to="b" d="M700 598V663A12 12 0 0 1 688 675H362A12 12 0 0 0 350 687V748" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arrow)"/><path id="ac" data-edge="" data-from="a" data-to="c" d="M700 598V663A12 12 0 0 0 712 675H1038A12 12 0 0 1 1050 687V748" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arrow)"/><text x="485" y="646" font-size="22" fill="#B0B2A8" text-anchor="middle" font-weight="400">包含</text><text x="910" y="646" font-size="22" fill="#B0B2A8" text-anchor="middle" font-weight="400">包含</text><path id="bd" data-edge="" data-from="b" data-to="d" d="M350 868V1068" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arrow)"/><text x="380" y="976" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">需要</text><path id="ce" data-edge="" data-from="c" data-to="e" d="M1050 868V1068" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1080" y="976" font-size="22" fill="#B0B2A8" text-anchor="start" font-weight="400">由…组成</text><path id="de" data-edge="" data-from="d" data-to="e" d="M350 1188V1238A12 12 0 0 0 362 1250H1038A12 12 0 0 0 1050 1238V1188" fill="none" stroke="#EFEEE7" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="5 8"/><text x="700" y="1217" font-size="22" fill="#B0B2A8" text-anchor="middle" font-weight="400">D 与 E 之间，还有什么关系待查？</text><path data-decoration="guide" d="M450 1430H1310" fill="none" stroke="#676C62" stroke-width="1"/><text x="1310" y="1476" font-size="24" fill="#EFEEE7" text-anchor="end" font-weight="500">先选一条线，把“两端＋关系词”读成完整一句话。</text><text x="1310" y="1518" font-size="18" fill="#B0B2A8" text-anchor="end" font-weight="400">实线＝已写明的关系示意；虚线＝尚未建立的跨分支关系。</text><text x="1310" y="1572" font-size="14" fill="#B0B2A8" text-anchor="end" font-weight="400">方法依据：Novak &amp; Cañas (2008) · The Theory Underlying Concept Maps</text><text x="1310" y="1602" font-size="14" fill="#B0B2A8" text-anchor="end" font-weight="400">cmap.ihmc.us/docs/theory-of-concept-maps.php ｜示意命题不对应任何具体学科事实。</text></svg>