<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2200" viewBox="0 0 2400 2200" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">走完这一轮，会回到什么状态？</title><desc id="desc">四个状态圆按顺序组成闭环。边表示下一状态或下一轮触发，不代表数量间的正负因果影响。可按内容增减状态，闭合需要实际可说明的依据。</desc><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4" /></marker></defs><rect width="2400" height="2200" fill="#191A18" data-decoration="background" /><text x="120" y="155" fill="#EFEEE7" font-size="64" text-anchor="start" font-weight="600">走完这一轮，会回到什么状态？</text><text x="120" y="232" fill="#B0B2A8" font-size="34" text-anchor="start" font-weight="400">A recurring sequence</text><path d="M120 290H1750" stroke="#50554C" data-decoration="separator" /><circle id="a" data-node="" cx="680" cy="790" r="125" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="2.2" /><text x="680" y="802.0" fill="#191A18" font-size="36" text-anchor="middle" font-weight="500" data-in-node="a" data-padding="12">状态 A</text><circle id="b" data-node="" cx="1720" cy="790" r="125" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="1720" y="802.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="b" data-padding="12">状态 B</text><circle id="c" data-node="" cx="1720" cy="1400" r="125" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="1720" y="1412.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="c" data-padding="12">状态 C</text><circle id="d" data-node="" cx="680" cy="1400" r="125" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="680" y="1412.0" fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="d" data-padding="12">状态 D</text><path d="M817 790H1583" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" data-edge="" data-from="a" data-to="b" id="ab" /><path d="M1720 927V1263" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" data-edge="" data-from="b" data-to="c" id="bc" /><path d="M1583 1400H817" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" data-edge="" data-from="c" data-to="d" id="cd" /><path d="M680 1263V927" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" data-edge="" data-from="d" data-to="a" id="da" /><text x="1200" y="730" fill="#B0B2A8" font-size="30" text-anchor="middle" font-weight="400">接着发生</text><text x="1770" y="1110" fill="#B0B2A8" font-size="30" text-anchor="start" font-weight="400">然后</text><text x="1200" y="1480" fill="#B0B2A8" font-size="30" text-anchor="middle" font-weight="400">再到</text><text x="610" y="1110" fill="#B0B2A8" font-size="30" text-anchor="end" font-weight="400">重新进入</text><text x="1200" y="1085" fill="#EFEEE7" font-size="50" text-anchor="middle" font-weight="500">下一轮</text><text x="1200" y="1150" fill="#B0B2A8" font-size="30" text-anchor="middle" font-weight="400">什么条件使它再次开始？</text><path d="M850 1840H2280" stroke="#50554C" data-decoration="separator" /><text x="2280" y="1910" fill="#EFEEE7" font-size="38" text-anchor="end" font-weight="500">循环的是状态次序；不是默认越来越好。</text><text x="2280" y="1970" fill="#B0B2A8" font-size="29" text-anchor="end" font-weight="400">仅发生一次时使用顺序图；若要解释变化如何回馈，用变量与因果边。</text><text x="120" y="2070" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">方法用途：IRIS Center · Sequencing / Cycle；FSU ACE · Cyclical Flow Chart</text><text x="120" y="2109" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">iris.peabody.vanderbilt.edu/activity/graphic-organizers/；ace.fsu.edu/study-tools-and-tips/graphic-organizers-subject-area ｜自主编排。</text></svg>