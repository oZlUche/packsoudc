<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">交集与边界</title><desc id="desc">交叠必须对应可定义的共同部分。 图形身份：两集合的圆形边界与真实交集。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">06</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">交集与边界</text><defs><clipPath id="venn09"><circle cx="190" cy="240" r="110"/></clipPath></defs><circle data-vt-geometry="circle" data-vt-identity="06-g01" cx="310" cy="240" r="110" fill="#63695D" clip-path="url(#venn09)"/><circle data-vt-geometry="circle" data-vt-identity="06-g02" cx="190" cy="240" r="110" fill="none" stroke="#EEEDE5" stroke-width="2"/><circle data-vt-geometry="circle" data-vt-identity="06-g03" cx="310" cy="240" r="110" fill="none" stroke="#EEEDE5" stroke-width="2"/><text x="20" y="445" font-size="17" fill="#B1B5A8">交叠必须对应可定义的共同部分。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">圆周是集合边界；交叠是同属两集合的区域。</text><text x="20" y="566" font-size="15" fill="#B1B5A8">正式图保留图形身份与关系；文字附着，不替换图形。</text></svg>