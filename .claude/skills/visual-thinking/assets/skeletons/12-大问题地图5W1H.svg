<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2040" viewBox="0 0 1600 2040" role="img" aria-labelledby="title" aria-describedby="desc">
<title id="title">大问题地图 · 5W1H</title>
<desc id="desc">中央圆代表同一个核心问题。左右各三个方形区域分别承载谁、什么、何时、何地、为什么、如何六个提问方向与待补充的内容；两条正交分支将六区连接到同一个主题。连线不表示先后、因果或必须填满。读者可从最不清楚的方向进入，补充一条信息后回到中心检查问题是否需要修正。此图是通用5W1H框架的自主编排。</desc>
