<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">嵌套范围</title><desc id="desc">辨别包含关系，检查对象落在哪层。 图形身份：嵌套范围边界与待归属对象。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">21</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">嵌套范围</text><circle data-vt-geometry="circle" data-vt-identity="21-g01" cx="250" cy="240" r="137" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><circle data-vt-geometry="circle" data-vt-identity="21-g02" cx="250" cy="240" r="91" fill="#191A18" stroke="#EEEDE5" stroke-width="1.5"/><circle data-vt-geometry="circle" data-vt-identity="21-g03" cx="250" cy="240" r="43" fill="#191A18" stroke="#EEEDE5" stroke-width="1.5"/><circle data-vt-geometry="circle" data-vt-identity="21-g04" cx="250" cy="240" r="6" fill="#EEEDE5" stroke="#EEEDE5" stroke-width="1.2"/><circle data-vt-geometry="circle" data-vt-identity="21-g05" cx="315" cy="240" r="6" fill="#191A18" stroke="#EEEDE5" stroke-width="1.2"/><circle data-vt-geometry="circle" data-vt-identity="21-g06" cx="365" cy="240" r="6" fill="#191A18" stroke="#EEEDE5" stroke-width="1.2"/><text x="20" y="445" font-size="17" fill="#B1B5A8">辨别包含关系，检查对象落在哪层。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">同心圆是范围；小点是范围中的对象。</text><text x="20" y="566" font-size="15" fill="#B1B5A8">正式图保留图形身份与关系；文字附着，不替换图形。</text></svg>