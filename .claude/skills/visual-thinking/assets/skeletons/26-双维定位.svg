<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">双维定位</title><desc id="d">两条有依据的维度，帮助定位同一对象。 图形身份：待定位的对象圆与两条维度轴。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">26</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">双维定位</text><path data-vt-geometry="path" data-vt-identity="26-g01" d="M75 245L437 245" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><path data-vt-geometry="path" data-vt-identity="26-g02" d="M250 390L250 87" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><text x="440" y="277" font-size="16" fill="#B1B5A8" text-anchor="end" font-weight="400">维度 A</text><text x="273" y="105" font-size="16" fill="#B1B5A8" text-anchor="start" font-weight="400">维度 B</text><circle data-vt-geometry="circle" data-vt-identity="26-g03" cx="90" cy="100" r="20" fill="#191A18" stroke="#EEEDE5" stroke-width="2" stroke-dasharray="3 6"/><text x="90" y="144" font-size="16" fill="#B1B5A8" text-anchor="middle" font-weight="400">待定位</text><text x="20" y="445" font-size="17" fill="#B1B5A8">两条有依据的维度，帮助定位同一对象。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">虚圆是尚未定位的对象；得到依据后移动圆，保留其形状。</text><text x="20" y="566" font-size="15" fill="#B1B5A8">正式图保留图形身份与关系；文字附着，不替换图形。</text></svg>