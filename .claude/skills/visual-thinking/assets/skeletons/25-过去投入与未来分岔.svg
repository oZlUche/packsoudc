<svg xmlns="http://www.w3.org/2000/svg" width="500" height="590" viewBox="0 0 500 590" role="img" aria-labelledby="t" aria-describedby="d"><title id="t">过去投入与未来分岔</title><desc id="d">从今天比较新增后果，保留过去的真实影响。 图形身份：过去投入、今日定位点与未来路径节点。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5"/></marker></defs><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="500" height="590" fill="#191A18"/><text x="20" y="35" font-size="21" fill="#B1B5A8">25</text><text x="71" y="35" font-size="25" fill="#EEEDE5" font-weight="500">过去投入与未来分岔</text><rect data-vt-geometry="rect" data-vt-identity="25-g01" x="48" y="180" width="84" height="84" fill="none" stroke="#EEEDE5" stroke-width="1.6"/><text x="90" y="230" font-size="21" fill="#EEEDE5" text-anchor="middle" font-weight="400">过去</text><path data-vt-geometry="path" data-vt-identity="25-g02" d="M132 222L230 222" fill="none" stroke="#C2C7BA" stroke-width="1.3"/><circle data-vt-geometry="circle" data-vt-identity="25-g03" cx="250" cy="222" r="6" fill="#EEEDE5" stroke="#EEEDE5" stroke-width="1.2"/><path data-vt-geometry="path" data-vt-identity="25-g04" d="M250 105L250 370" fill="none" stroke="#63695D" stroke-width="1.3"/><text x="250" y="87" font-size="18" fill="#EEEDE5" text-anchor="middle" font-weight="400">今天</text><path data-vt-geometry="path" data-vt-identity="25-g05" d="M258 222L320 222" fill="none" stroke="#C2C7BA" stroke-width="1.3"/><path data-vt-geometry="path" data-vt-identity="25-g06" d="M320 135L320 310" fill="none" stroke="#C2C7BA" stroke-width="1.3"/><path data-vt-geometry="path" data-vt-identity="25-g07" d="M320 135L376 135" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="25-g08" cx="413" cy="135" r="27" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="25-g09" d="M320 222L376 222" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="25-g10" cx="413" cy="222" r="27" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="25-g11" d="M320 310L376 310" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#arrow)"/><circle data-vt-geometry="circle" data-vt-identity="25-g12" cx="413" cy="310" r="27" fill="#191A18" stroke="#EEEDE5" stroke-width="2"/><path data-vt-geometry="path" data-vt-identity="25-g13" d="M90 264L90.0 378.0A12 12 0 0 0 102.0 390.0L401.0 390.0A12 12 0 0 0 413.0 378.0L413 345" fill="none" stroke="#C2C7BA" stroke-width="1.3" stroke-dasharray="3 6" marker-end="url(#arrow)"/><text x="250" y="414" font-size="16" fill="#B1B5A8" text-anchor="middle" font-weight="400">资产与责任可能延续</text><text x="20" y="445" font-size="17" fill="#B1B5A8">从今天比较新增后果，保留过去的真实影响。</text><path d="M20 477H480" stroke="#383B34"/><text x="20" y="506" font-size="15" fill="#B1B5A8">方形是过去投入；点是今天；右圆是未来候选。</text><text x="20" y="566" font-size="15" fill="#B1B5A8">正式图保留图形身份与关系；文字附着，不替换图形。</text></svg>