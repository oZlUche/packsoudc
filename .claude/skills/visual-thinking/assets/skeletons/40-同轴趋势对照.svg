<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2800" viewBox="0 0 2400 2800" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">同轴趋势对照</title><desc id="desc">通用骨架：横轴为时间，纵轴为同一指标，不同线型标识不同做法或对象的变化轨迹。两条曲线仅用于辨认结构，不对应事实、排序或默认走势；正式使用时按数据或有依据的机制重新绘制，也可改为单线或多线。</desc><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.5" /></marker></defs><rect width="2400" height="2800" fill="#191A18" data-decoration="background" /><text x="140" y="170" font-size="72" fill="#EFEEE7" text-anchor="start" font-weight="600">同轴趋势对照</text><text x="140" y="265" font-size="36" fill="#B0B2A8" text-anchor="start" font-weight="400">Comparing change over time</text><text x="140" y="370" font-size="36" fill="#B0B2A8" text-anchor="start" font-weight="400">看同一结果怎样随时间变化，再比较不同做法的过程与后果。</text><path d="M380 2060V730" fill="none" stroke="#EFEEE7" stroke-width="2.5" data-decoration="axis" marker-end="url(#arr)" /><path d="M380 2060H2200" fill="none" stroke="#EFEEE7" stroke-width="2.5" data-decoration="axis" marker-end="url(#arr)" /><text x="380" y="650" font-size="36" fill="#B0B2A8" text-anchor="start" font-weight="400">同一结果指标</text><text x="2180" y="2150" font-size="36" fill="#B0B2A8" text-anchor="end" font-weight="400">时间</text><path d="M500 1640C850 1640 1050 1240 1400 1160C1700 1090 1920 1060 2140 940" fill="none" stroke="#EFEEE7" stroke-width="4" data-decoration="trajectory-role-example" /><path d="M500 1690C900 1630 1150 1560 1400 1440C1700 1300 1920 1370 2140 1260" fill="none" stroke="#EFEEE7" stroke-width="4" data-decoration="trajectory-role-example" stroke-dasharray="16 13" /><text x="2160" y="850" font-size="38" fill="#EFEEE7" text-anchor="end" font-weight="500">做法／对象 A</text><text x="2160" y="1450" font-size="38" fill="#EFEEE7" text-anchor="end" font-weight="500">做法／对象 B</text><text x="1260" y="1920" font-size="32" fill="#B0B2A8" text-anchor="middle" font-weight="400">曲线形状仅为骨架示意；使用时须依据材料重画。</text><path d="M1000 2420H2260" fill="none" stroke="#50554C" stroke-width="1.5" data-decoration="separator" /><text x="2260" y="2500" font-size="39" fill="#EFEEE7" text-anchor="end" font-weight="500">把观察时间拉长或缩短，原来的判断还成立吗？</text><text x="2260" y="2570" font-size="30" fill="#B0B2A8" text-anchor="end" font-weight="400">可用单线、双线或多线；指标与尺度一致，比较才有意义。</text><text x="140" y="2680" font-size="24" fill="#B0B2A8" text-anchor="start" font-weight="400">方法参考：ONS · Data over time: Line chart · service-manual.ons.gov.uk/data-visualisation/chart-types/line-chart</text><text x="140" y="2740" font-size="25" fill="#B0B2A8" text-anchor="start" font-weight="400">几何与说明自主绘制。此骨架不预设增长、交叉或胜负；实测、模型示意与假设须分别标明。</text></svg>