<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">冰山模型：从可见表现探索待了解的背景</title><desc id="desc">水面上的知识技能与水面下待了解的综合能力、性格倾向、动机目标共用一个冰山轮廓。横向问题提供查证入口；深度和面积不代表因果权重。 图形身份：完整冰山轮廓、可见边界及分层。成图保留这些几何对象及关系，文字作为标签附着。</desc><defs><clipPath id="ice"><path d="M435 520L560 330L685 520L830 650L760 890L545 1040L305 865L255 665Z"/></clipPath></defs><style>text{font-family:'PingFang SC','Helvetica Neue',sans-serif}</style><rect width="1400" height="1360" fill="#191C17"/><text x="90" y="110" font-size="24" fill="#A9ADA1" text-anchor="start" font-weight="400">37</text><text x="820" y="104" font-size="42" fill="#EEEFE7" text-anchor="start" font-weight="600">冰山模型</text><text x="820" y="145" font-size="23" fill="#A9ADA1" text-anchor="start" font-weight="400">The Iceberg Model</text><path data-vt-geometry="path" data-vt-identity="37-g01" d="M820 172H1310" fill="none" stroke="#51574B" stroke-width="1.5"/><text x="820" y="211" font-size="22" fill="#A9ADA1" text-anchor="start" font-weight="400">从看得见的部分，继续向下探索。</text><path data-vt-geometry="path" data-vt-identity="37-g02" d="M435 520L560 330L685 520L830 650L760 890L545 1040L305 865L255 665Z" fill="none" stroke="#EEEFE7" stroke-width="2.2"/><g clip-path="url(#ice)"><rect data-vt-geometry="rect" data-vt-identity="37-g03" x="240" y="520" width="600" height="530" fill="#EEEFE7" opacity="0.025"/><path data-vt-geometry="path" data-vt-identity="37-g04" d="M240 720H850" fill="none" stroke="#51574B" stroke-width="1.5"/><path data-vt-geometry="path" data-vt-identity="37-g05" d="M240 865H850" fill="none" stroke="#51574B" stroke-width="1.5"/></g><path data-vt-geometry="path" data-vt-identity="37-g06" d="M90 520H1310" fill="none" stroke="#A9ADA1" stroke-width="1.5"/><text x="90" y="496" font-size="18" fill="#A9ADA1" text-anchor="start" font-weight="400">可见边界</text><text x="560" y="467" font-size="24" fill="#EEEFE7" text-anchor="middle" font-weight="600">知识 · 技能</text><text x="540" y="640" font-size="30" fill="#EEEFE7" text-anchor="middle" font-weight="600">综合能力</text><text x="540" y="678" font-size="18" fill="#A9ADA1" text-anchor="middle" font-weight="400">在具体经历中寻找</text><text x="540" y="790" font-size="30" fill="#EEEFE7" text-anchor="middle" font-weight="600">性格与倾向</text><text x="540" y="828" font-size="18" fill="#A9ADA1" text-anchor="middle" font-weight="400">比较不同情境下的表现</text><text x="545" y="925" font-size="28" fill="#EEEFE7" text-anchor="middle" font-weight="600">动机与目标</text><path data-vt-geometry="path" data-vt-identity="37-g07" d="M662 485H925" fill="none" stroke="#51574B" stroke-width="1.5" stroke-dasharray="3 7"/><circle data-vt-geometry="circle" data-vt-identity="37-g08" cx="662" cy="485" r="3" fill="#EEEFE7"/><path data-vt-geometry="path" data-vt-identity="37-g09" d="M823 665H925" fill="none" stroke="#51574B" stroke-width="1.5" stroke-dasharray="3 7"/><circle data-vt-geometry="circle" data-vt-identity="37-g10" cx="823" cy="665" r="3" fill="#EEEFE7"/><path data-vt-geometry="path" data-vt-identity="37-g11" d="M789 790H925" fill="none" stroke="#51574B" stroke-width="1.5" stroke-dasharray="3 7"/><circle data-vt-geometry="circle" data-vt-identity="37-g12" cx="789" cy="790" r="3" fill="#EEEFE7"/><path data-vt-geometry="path" data-vt-identity="37-g13" d="M658 960H925" fill="none" stroke="#51574B" stroke-width="1.5" stroke-dasharray="3 7"/><circle data-vt-geometry="circle" data-vt-identity="37-g14" cx="658" cy="960" r="3" fill="#EEEFE7"/><text x="960" y="452" font-size="26" fill="#EEEFE7" text-anchor="start" font-weight="500">能展示什么？</text><text x="960" y="486" font-size="20" fill="#A9ADA1" text-anchor="start" font-weight="400">用作品、行动与结果说明。</text><text x="960" y="633" font-size="26" fill="#EEEFE7" text-anchor="start" font-weight="500">能迁移什么？</text><text x="960" y="669" font-size="20" fill="#A9ADA1" text-anchor="start" font-weight="400">换个任务，还能发挥吗？</text><text x="960" y="758" font-size="26" fill="#EEEFE7" text-anchor="start" font-weight="500">在什么条件下出现？</text><text x="960" y="794" font-size="20" fill="#A9ADA1" text-anchor="start" font-weight="400">别用一次表现定义一个人。</text><text x="960" y="928" font-size="26" fill="#EEEFE7" text-anchor="start" font-weight="500">为什么愿意持续做？</text><text x="960" y="964" font-size="20" fill="#A9ADA1" text-anchor="start" font-weight="400">是自己的目标，还是外部要求？</text><text x="90" y="579" font-size="20" fill="#A9ADA1" text-anchor="start" font-weight="400">待了解</text><text x="90" y="609" font-size="20" fill="#A9ADA1" text-anchor="start" font-weight="400">与核实</text><path data-vt-geometry="path" data-vt-identity="37-g15" d="M90 1175H1310" fill="none" stroke="#51574B" stroke-width="1.5"/><text x="90" y="1215" font-size="23" fill="#EEEFE7" text-anchor="start" font-weight="500">沿图思考：先描述表现，再寻找背景；带着证据回到判断。</text><text x="90" y="1258" font-size="17" fill="#A9ADA1" text-anchor="start" font-weight="400">层次用于探索，不是固定因果链；水下面积与深度不代表影响大小或不可改变。</text><text x="90" y="1292" font-size="16" fill="#A9ADA1" text-anchor="start" font-weight="400">[1] Topbook《如何正确努力？7 分钟重新认识冰山模型。》 · topbook.cc/article/1849</text><text x="90" y="1320" font-size="16" fill="#A9ADA1" text-anchor="start" font-weight="400">依据文章的素质冰山分层自主绘制；可按主题替换水下层次，不混用不同理论的固定标签。</text></svg>