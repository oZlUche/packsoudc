<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">结构性思考 · 芒格模型的绘图改编</title><desc id="vt-desc">检查积累进入下一轮的回流，并沿两条备选路径识别是否依赖同一个条件。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#EFEEE7" stroke-width="1.1" /></marker><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#EFEEE7" stroke-width="1" opacity=".6" /></pattern><clipPath id="left"><circle cx="760" cy="455" r="127" /></clipPath></defs><rect width="1200" height="1360" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="65" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">结构性思考 · 芒格模型的绘图改编</text><text x="60" y="148" font-size="64" text-anchor="start" fill="#EFEEE7" font-weight="600">检查那些看不见的连接</text><text x="64" y="202" font-size="24" text-anchor="start" fill="#B0B2A8" font-weight="400">回流和备份是否真的成立，比图上多几条线更重要。</text><text x="64" y="302" font-size="21" text-anchor="start" fill="#B0B2A8" font-weight="400">复利与再投入</text><text x="64" y="360" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">积累，真的留下了吗？</text><text x="64" y="412" font-size="23" text-anchor="start" fill="#EFEEE7" font-weight="400">这次做完，什么进入下次？</text><text x="64" y="452" font-size="22" text-anchor="start" fill="#EFEEE7" font-weight="400">回流若断开，积累还成立吗？</text><text x="64" y="507" font-size="21" text-anchor="start" fill="#B0B2A8" font-weight="400">先检查机制，再谈增长。</text><circle cx="598" cy="441" r="66" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="598" y="449" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="500">这次产出</text><circle cx="816" cy="441" r="66" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="816" y="449" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="500">留下什么</text><circle cx="1034" cy="441" r="66" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="1034" y="449" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="500">下次起点</text><path d="M665 441H727" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><path d="M885 441H945" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><path d="M1063 503C1085 659 577 659 572 510" fill="none" stroke="#EFEEE7" stroke-width="1.5" marker-end="url(#a)" /><text x="820" y="665" font-size="22" text-anchor="middle" fill="#B0B2A8" font-weight="400">留下的东西，能否再次投入？</text><path d="M910 606L928 632M932 602L950 628" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><text x="64" y="849" font-size="21" text-anchor="start" fill="#B0B2A8" font-weight="400">备份与共同依赖</text><text x="64" y="907" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">两条路，真是两条吗？</text><text x="64" y="959" font-size="23" text-anchor="start" fill="#EFEEE7" font-weight="400">沿两条备用路径往回看，</text><text x="64" y="997" font-size="23" text-anchor="start" fill="#EFEEE7" font-weight="400">它们会不会依赖同一个点？</text><text x="64" y="1051" font-size="21" text-anchor="start" fill="#B0B2A8" font-weight="400">把那个共同依赖暂时移开。</text><circle cx="576" cy="1044" r="45" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 7" /><text x="576" y="1039" font-size="21" text-anchor="middle" fill="#EFEEE7" font-weight="400">共同</text><text x="576" y="1068" font-size="21" text-anchor="middle" fill="#EFEEE7" font-weight="400">依赖？</text><path d="M620 1044C682 1044 668 929 740 929" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><path d="M620 1044C682 1044 668 1159 740 1159" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="788" cy="929" r="48" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="788" y="937" font-size="22" text-anchor="middle" fill="#EFEEE7" font-weight="400">路径 A</text><circle cx="788" cy="1159" r="48" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="788" y="1167" font-size="22" text-anchor="middle" fill="#EFEEE7" font-weight="400">路径 B</text><path d="M836 929C930 929 916 1044 1022 1044" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><path d="M836 1159C930 1159 916 1044 1022 1044" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><circle cx="1042" cy="1044" r="6" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" /><text x="1042" y="1091" font-size="21" text-anchor="middle" fill="#EFEEE7" font-weight="400">要维持的结果</text><text x="819" y="1250" font-size="20" text-anchor="middle" fill="#B0B2A8" font-weight="400">左边这个点失效，两路还能继续吗？</text><path d="M64 749H1136" fill="none" stroke="#777C70" stroke-width="0.9" /><text x="64" y="1310" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">图中路径与边界供自行检验；不是芒格原图，也没有预填你的答案。</text></g></svg>