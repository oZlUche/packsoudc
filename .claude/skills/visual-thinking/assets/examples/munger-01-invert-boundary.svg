<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">结构性思考 · 芒格模型的绘图改编</title><desc id="vt-desc">从可能失败反向追查条件，并区分能解释、能检验与仅仅听说的理解边界。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#EFEEE7" stroke-width="1.1" /></marker><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#EFEEE7" stroke-width="1" opacity=".6" /></pattern><clipPath id="left"><circle cx="760" cy="455" r="127" /></clipPath></defs><rect width="1200" height="1360" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="65" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">结构性思考 · 芒格模型的绘图改编</text><text x="60" y="148" font-size="64" text-anchor="start" fill="#EFEEE7" font-weight="600">从另一边进入问题</text><text x="64" y="202" font-size="24" text-anchor="start" fill="#B0B2A8" font-weight="400">不用先找答案。先反转一次，再检查自己理解的范围。</text><text x="64" y="302" font-size="21" text-anchor="start" fill="#B0B2A8" font-weight="400">逆向</text><text x="64" y="360" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">从失败那端往回看</text><text x="64" y="412" font-size="23" text-anchor="start" fill="#EFEEE7" font-weight="400">什么会让人不再信任我？</text><text x="64" y="452" font-size="21" text-anchor="start" fill="#B0B2A8" font-weight="400">先找到一条可以切断的路径。</text><circle cx="559" cy="455" r="6" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" /><path d="M566 455C700 455 733 330 970 330" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><circle cx="1020" cy="330" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="1020" y="321" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">建立</text><text x="1020" y="352" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">信任</text><path d="M566 455C700 455 750 570 966 570" fill="none" stroke="#777C70" stroke-width="1.5" stroke-dasharray="5 8" /><circle cx="1020" cy="570" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="1020" y="561" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">失去</text><text x="1020" y="592" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">信任</text><path d="M970 600C850 672 744 620 724 547" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><text x="826" y="685" font-size="20" text-anchor="middle" fill="#B0B2A8" font-weight="400">沿这条设想，反向追溯原因</text><path d="M701 513L725 540M719 506L742 533" fill="none" stroke="#EFEEE7" stroke-width="1.8" /><text x="792" y="498" font-size="21" text-anchor="middle" fill="#EFEEE7" font-weight="400">哪一环能切断？</text><text x="64" y="849" font-size="21" text-anchor="start" fill="#B0B2A8" font-weight="400">能力边界</text><text x="64" y="907" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">我究竟懂到哪里？</text><text x="64" y="959" font-size="23" text-anchor="start" fill="#EFEEE7" font-weight="400">熟悉一个词，和能检验它，</text><text x="64" y="995" font-size="23" text-anchor="start" fill="#EFEEE7" font-weight="400">边界可能画在不同地方。</text><text x="64" y="1049" font-size="21" text-anchor="start" fill="#B0B2A8" font-weight="400">找一项能支撑判断的依据。</text><path d="M718 876C792 844 923 878 960 959C1000 1048 930 1181 815 1191C710 1205 622 1133 639 1031C645 993 691 977 681 932C677 908 693 889 718 876" fill="none" stroke="#EFEEE7" stroke-width="1.7" stroke-dasharray="5 8" /><circle cx="771" cy="1002" r="7" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" /><text x="790" y="1009" font-size="22" text-anchor="start" fill="#EFEEE7" font-weight="400">解释得出</text><circle cx="823" cy="1115" r="7" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" /><text x="842" y="1122" font-size="22" text-anchor="start" fill="#EFEEE7" font-weight="400">检验得了</text><circle cx="1070" cy="954" r="7" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="1070" y="919" font-size="21" text-anchor="middle" fill="#B0B2A8" font-weight="400">只是听说？</text><path d="M1062 969Q1025 1019 961 1028" fill="none" stroke="#777C70" stroke-width="1.4" stroke-dasharray="4 8" /><text x="816" y="1235" font-size="21" text-anchor="middle" fill="#B0B2A8" font-weight="400">什么新证据会让边界移动？</text><path d="M64 749H1136" fill="none" stroke="#777C70" stroke-width="0.9" /><text x="64" y="1310" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">图中路径与边界供自行检验；不是芒格原图，也没有预填你的答案。</text></g></svg>