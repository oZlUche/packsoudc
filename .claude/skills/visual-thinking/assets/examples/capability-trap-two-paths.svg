<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="3150" viewBox="0 0 2400 3150" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">赶工与不赶工，后来有什么不同？</title><desc id="desc">两条线共用时间轴和每段时间完成工作量的纵轴，从相同起点出发。实线表示赶工并压缩检查和改进：眼前完成量先增加，后来返工占去时间，完成量可能下降。虚线表示保留检查和改进：先因投入改进而少完成一些，若改进有效，同类问题减少后完成量可能提高。线交叉只表示当时的完成速度相同，不表示累计完成总量相等。曲线是条件性模型的无刻度示意，不是实测数据或个体预测。</desc><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><defs><marker id="arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.5" /></marker></defs><rect width="2400" height="3150" fill="#191A18" data-decoration="background" /><text x="140" y="170" font-size="72" fill="#EFEEE7" text-anchor="start" font-weight="600">赶工与不赶工，后来有什么不同？</text><text x="140" y="265" font-size="36" fill="#B0B2A8" text-anchor="start" font-weight="400">Rushing or improving: two paths over time</text><text x="140" y="370" font-size="36" fill="#B0B2A8" text-anchor="start" font-weight="400">这里的“不赶工”，指照常做事，同时保留检查和改进的时间。</text><path d="M140 470H270" fill="none" stroke="#EFEEE7" stroke-width="4" data-decoration="legend-sample" /><text x="300" y="480" font-size="32" fill="#B0B2A8" text-anchor="start" font-weight="400">赶工：压缩检查和改进</text><path d="M1170 470H1300" fill="none" stroke="#EFEEE7" stroke-width="4" data-decoration="legend-sample" stroke-dasharray="16 13" /><text x="1330" y="480" font-size="32" fill="#B0B2A8" text-anchor="start" font-weight="400">不赶工：保留检查和改进</text><g transform="translate(0 100)"><path d="M380 2060V730" fill="none" stroke="#EFEEE7" stroke-width="2.5" data-decoration="axis" marker-end="url(#arr)" /><path d="M380 2060H2200" fill="none" stroke="#EFEEE7" stroke-width="2.5" data-decoration="axis" marker-end="url(#arr)" /><text x="380" y="650" font-size="35" fill="#B0B2A8" text-anchor="start" font-weight="400">每段时间真正做完的工作量</text><text x="2180" y="2160" font-size="34" fill="#B0B2A8" text-anchor="end" font-weight="400">时间往后</text><path d="M400 1510H2160" fill="none" stroke="#50554C" stroke-width="2" data-decoration="reference-level" stroke-dasharray="7 12" /><text x="420" y="1460" font-size="30" fill="#B0B2A8" text-anchor="start" font-weight="400">相同起点</text><path d="M680 770V2050" fill="none" stroke="#B0B2A8" stroke-width="2" data-decoration="start-marker" stroke-dasharray="5 12" /><path d="M400 1510H680" fill="none" stroke="#EFEEE7" stroke-width="4" data-decoration="common-history" /><path d="M680 1510C730 1510 765 1110 900 1060C1000 1020 1100 1030 1200 1100C1480 1280 1660 1580 2140 1800" fill="none" stroke="#EFEEE7" stroke-width="4.5" data-decoration="rushing-schematic-response" /><path d="M680 1510C750 1510 770 1740 940 1740C1130 1740 1260 1510 1430 1340C1660 1110 1840 940 2140 920" fill="none" stroke="#EFEEE7" stroke-width="4.5" data-decoration="improving-schematic-response" stroke-dasharray="16 13" /><circle cx="2140" cy="1800" r="7" fill="#EFEEE7" data-decoration="response-end" /><circle cx="2140" cy="920" r="7" fill="#EFEEE7" data-decoration="response-end" /><text x="680" y="2160" font-size="30" fill="#B0B2A8" text-anchor="middle" font-weight="400">从这里开始，两种做法分开</text><text x="990" y="850" font-size="36" fill="#EFEEE7" text-anchor="middle" font-weight="500">省掉检查和改进，</text><text x="990" y="912" font-size="36" fill="#EFEEE7" text-anchor="middle" font-weight="500">眼前先多完成一些。</text><text x="1050" y="1900" font-size="34" fill="#B0B2A8" text-anchor="middle" font-weight="400">先花时间查原因、改做法，</text><text x="1050" y="1958" font-size="34" fill="#B0B2A8" text-anchor="middle" font-weight="400">眼前能完成的工作会少一些。</text><text x="1660" y="730" font-size="34" fill="#B0B2A8" text-anchor="middle" font-weight="400">同样的问题逐渐减少，</text><text x="1660" y="788" font-size="34" fill="#B0B2A8" text-anchor="middle" font-weight="400">做事才可能越来越省力。</text><text x="2180" y="850" font-size="37" fill="#EFEEE7" text-anchor="end" font-weight="500">保留检查和改进</text><text x="1820" y="1300" font-size="34" fill="#B0B2A8" text-anchor="middle" font-weight="400">老问题没改，返工占去时间，</text><text x="1820" y="1360" font-size="34" fill="#B0B2A8" text-anchor="middle" font-weight="400">新工作反而做得更少。</text><text x="2180" y="1900" font-size="37" fill="#EFEEE7" text-anchor="end" font-weight="500">赶工，压缩检查和改进</text><text x="1320" y="2290" font-size="30" fill="#B0B2A8" text-anchor="middle" font-weight="400">两线交叉：只表示那一刻做得一样快，不代表之前少做的工作已经补回。</text></g><path d="M1000 2640H2260" fill="none" stroke="#50554C" stroke-width="1.5" data-decoration="separator" /><text x="2260" y="2720" font-size="40" fill="#EFEEE7" text-anchor="end" font-weight="500">你用多长时间来判断一种做法有没有用？</text><text x="2260" y="2790" font-size="30" fill="#B0B2A8" text-anchor="end" font-weight="400">比较前提：起点与工作量相近，时间有限，改进也确实能减少同类问题。</text><text x="140" y="2950" font-size="25" fill="#B0B2A8" text-anchor="start" font-weight="400">[1] Repenning &amp; Sterman (2001). Creating and Sustaining Process Improvement. CMR 43(4), 64–88, Fig. 6.</text><text x="140" y="3000" font-size="25" fill="#B0B2A8" text-anchor="start" font-weight="400">web.mit.edu/nelsonr/www/Repenning=Sterman_CMR_su01_.pdf · 依据原文两种策略的机制自主绘制。</text><text x="140" y="3060" font-size="26" fill="#B0B2A8" text-anchor="start" font-weight="400">两条线是条件性的模型走势示意；无实测数值与时间刻度，不预测何时交叉，也不保证改进一定成功。</text></svg>