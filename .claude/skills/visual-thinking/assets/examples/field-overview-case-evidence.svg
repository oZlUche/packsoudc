<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1900" viewBox="0 0 1800 1900" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">从零了解一个领域  /  全景、案例与证据共用一张图</title><desc id="vt-desc">全景中的案例定位放大为前提、过程和结果，通过原始材料、反例与换例检验返回全景或定点补查。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#EFEEE7" stroke-width="1.2" /></marker></defs><rect width="1800" height="1900" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="70" y="62" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">从零了解一个领域  /  全景、案例与证据共用一张图</text><text x="65" y="153" fill="#EFEEE7" font-size="70" text-anchor="start" font-weight="600">先看见轮廓，</text><text x="65" y="235" fill="#EFEEE7" font-size="70" text-anchor="start" font-weight="600">再让关系讲得通。</text><text x="70" y="296" fill="#B0B2A8" font-size="26" text-anchor="start" font-weight="400">带着一个想弄懂的问题进入；这张图提供查找与核对的路径，内容由具体领域来填。</text><circle cx="650" cy="681" r="340" stroke="#B0B2A8" fill="none" stroke-width="1.4" stroke-dasharray="" /><rect x="423.0" y="328" width="446" height="38" fill="#191A18" /><text x="650" y="359" fill="#EFEEE7" font-size="31" text-anchor="middle" font-weight="500">先画一版临时轮廓 [1,2]</text><rect x="398.0" y="378" width="496" height="29" fill="#191A18" /><text x="650" y="400" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">边界、分支、对象、方法：先认位置，再查关系。</text><path d="M468 590L586 516" fill="none" stroke="#EFEEE7" stroke-width="1.7" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><path d="M709 528L761 587" fill="none" stroke="#EFEEE7" stroke-width="1.7" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><path d="M516 650H723" fill="none" stroke="#EFEEE7" stroke-width="1.7" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><path d="M800 725V751" fill="none" stroke="#EFEEE7" stroke-width="1.7" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><path d="M530 775C520 735 530 735 530 688" fill="none" stroke="#B0B2A8" stroke-width="1.5" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><circle cx="650" cy="489" r="69" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="650" y="498.0" fill="#EFEEE7" font-size="26" text-anchor="middle" font-weight="500">核心问题</text><circle cx="440" cy="650" r="70" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="440" y="640.0" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">概念与</text><text x="440" y="678.0" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">对象</text><circle cx="800" cy="650" r="70" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="800" y="640.0" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">方法与</text><text x="800" y="678.0" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">解释</text><circle cx="530" cy="852" r="72" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="530" y="842.0" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">演变与</text><text x="530" y="880.0" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">争议</text><circle cx="800" cy="820" r="62" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="800" y="829.0" fill="#EFEEE7" font-size="24" text-anchor="middle" font-weight="500">真实案例</text><rect x="452.0" y="530" width="92" height="27" fill="#191A18" /><text x="502" y="550" fill="#B0B2A8" font-size="20" text-anchor="middle" font-weight="400">在说什么</text><rect x="702.0" y="534" width="92" height="27" fill="#191A18" /><text x="752" y="554" fill="#B0B2A8" font-size="20" text-anchor="middle" font-weight="400">怎样回答</text><rect x="575.0" y="606" width="92" height="27" fill="#191A18" /><text x="625" y="626" fill="#B0B2A8" font-size="20" text-anchor="middle" font-weight="400">如何连接</text><rect x="440.0" y="724" width="152" height="27" fill="#191A18" /><text x="520" y="744" fill="#B0B2A8" font-size="20" text-anchor="middle" font-weight="400">什么发生了变化</text><circle cx="153" cy="469" r="73" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="153" y="478.0" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">可靠概览</text><path d="M229 468H565" fill="none" stroke="#B0B2A8" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><rect x="131.0" y="421" width="390" height="28" fill="#191A18" /><text x="330" y="442" fill="#B0B2A8" font-size="21" text-anchor="middle" font-weight="400">教材导论 / 手册 / 综述 [1]</text><circle cx="145" cy="855" r="73" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="145" y="864.0" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">定点补查</text><path d="M220 855C293 855 295 716 365 672" fill="none" stroke="#B0B2A8" stroke-width="1.6" stroke-dasharray="5 8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><rect x="166.5" y="725" width="159" height="28" fill="#191A18" /><text x="250" y="746" fill="#B0B2A8" font-size="21" text-anchor="middle" font-weight="400">缺什么，补什么</text><circle cx="800" cy="820" r="80" stroke="#B0B2A8" fill="none" stroke-width="1.7" stroke-dasharray="4 7" /><path d="M861 767L1006 761M853 880L830 1030" fill="none" stroke="#B0B2A8" stroke-width="1.3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><rect x="865.0" y="702" width="150" height="30" fill="#191A18" /><text x="944" y="725" fill="#EFEEE7" font-size="23" text-anchor="middle" font-weight="500">展开同一案例</text><circle cx="1120" cy="1060" r="325" stroke="#EFEEE7" fill="none" stroke-width="1.7" stroke-dasharray="" /><text x="1120" y="826" fill="#EFEEE7" font-size="33" text-anchor="middle" font-weight="500">把一件真实的事走通</text><text x="1120" y="871" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">产品、事件、研究结论，任选一个</text><path d="M993 1044H1066" fill="none" stroke="#EFEEE7" stroke-width="1.7" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><path d="M1175 1044H1248" fill="none" stroke="#EFEEE7" stroke-width="1.7" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><circle cx="945" cy="1044" r="45" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="945" y="1053.0" fill="#EFEEE7" font-size="24" text-anchor="middle" font-weight="500">前提</text><circle cx="1120" cy="1044" r="47" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="1120" y="1053.0" fill="#EFEEE7" font-size="24" text-anchor="middle" font-weight="500">过程</text><circle cx="1297" cy="1044" r="45" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="1297" y="1053.0" fill="#EFEEE7" font-size="24" text-anchor="middle" font-weight="500">结果</text><text x="945" y="1120" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">谁 / 什么条件</text><text x="1120" y="1120" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">具体怎样发生</text><text x="1297" y="1120" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">到底观察到什么</text><circle cx="1120" cy="1260" r="47" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="1120" y="1269.0" fill="#EFEEE7" font-size="24" text-anchor="middle" font-weight="500">解释</text><path d="M1120 1208V1137" fill="none" stroke="#B0B2A8" stroke-width="1.6" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><text x="1120" y="1179" fill="#EFEEE7" font-size="29" text-anchor="middle" font-weight="400">？</text><text x="1120" y="1340" fill="#B0B2A8" font-size="21" text-anchor="middle" font-weight="400">先后能串起来，为什么却未必说得清。</text><circle cx="1580" cy="1055" r="83" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="1580" y="1064.0" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">原始材料</text><path d="M1492 1055H1350" fill="none" stroke="#B0B2A8" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><rect x="1454.5" y="906" width="173" height="30" fill="#191A18" /><text x="1545" y="929" fill="#EFEEE7" font-size="23" text-anchor="middle" font-weight="500">说法来自哪里？</text><rect x="1409.0" y="949" width="264" height="28" fill="#191A18" /><text x="1545" y="970" fill="#B0B2A8" font-size="21" text-anchor="middle" font-weight="400">如何得到，适用什么条件？</text><circle cx="1578" cy="1325" r="78" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="1578" y="1315.0" fill="#EFEEE7" font-size="24" text-anchor="middle" font-weight="500">反例 /</text><text x="1578" y="1353.0" fill="#EFEEE7" font-size="24" text-anchor="middle" font-weight="500">不同解释</text><path d="M1491 1320C1394 1320 1325 1260 1178 1260" fill="none" stroke="#B0B2A8" stroke-width="1.6" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><rect x="1304.0" y="1388" width="276" height="29" fill="#191A18" /><text x="1446" y="1410" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">什么情况会让解释不成立？</text><path d="M1062 1229C956 1200 809 1270 706 1314" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><circle cx="600" cy="1342" r="102" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="600" y="1332.0" fill="#EFEEE7" font-size="26" text-anchor="middle" font-weight="500">下一次</text><text x="600" y="1370.0" fill="#EFEEE7" font-size="26" text-anchor="middle" font-weight="500">查哪条关系？</text><path d="M600 1231C600 1138 177 1113 145 935" fill="none" stroke="#B0B2A8" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><rect x="187.0" y="1075" width="242" height="30" fill="#191A18" /><text x="312" y="1098" fill="#EFEEE7" font-size="23" text-anchor="middle" font-weight="500">把卡住处变成检索目标</text><rect x="169.0" y="1120" width="306" height="28" fill="#191A18" /><text x="326" y="1141" fill="#B0B2A8" font-size="21" text-anchor="middle" font-weight="400">找定义、过程、证据或前置知识</text><path d="M1120 1394V1463" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><circle cx="1120" cy="1558" r="84" stroke="#EFEEE7" fill="#191A18" stroke-width="1.7" stroke-dasharray="" /><text x="1120" y="1548.0" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">换一个</text><text x="1120" y="1586.0" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">真实案例</text><rect x="1192.5" y="1458" width="337" height="32" fill="#191A18" /><text x="1365" y="1483" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">合上资料，自己解释 [3]</text><path d="M1027 1558C815 1598 600 1564 600 1454" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><rect x="672.5" y="1599" width="265" height="30" fill="#191A18" /><text x="809" y="1622" fill="#EFEEE7" font-size="23" text-anchor="middle" font-weight="500">哪里讲不通，回去修哪段</text><rect x="617.0" y="1642" width="348" height="28" fill="#191A18" /><text x="795" y="1663" fill="#B0B2A8" font-size="21" text-anchor="middle" font-weight="400">能解释一个例子，仍需检查适用边界</text><path d="M1332 809C1438 660 1209 444 992 475" fill="none" stroke="#B0B2A8" stroke-width="1.5" stroke-dasharray="4 8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><rect x="1246.5" y="590" width="137" height="32" fill="#191A18" /><text x="1319" y="615" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">回到全景：</text><rect x="1153.0" y="633" width="342" height="29" fill="#191A18" /><text x="1328" y="655" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">它属于哪一支，还有哪些没看到？</text><path d="M70 1720H1730" fill="none" stroke="#74796F" stroke-width="0.8" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="1764" fill="#EFEEE7" font-size="28" text-anchor="start" font-weight="500">沿图走：概览定位 → 案例展开 → 证据核对 → 换例解释 → 回去补缺口。</text><text x="70" y="1810" fill="#B0B2A8" font-size="17" text-anchor="start" font-weight="400">[1] Cornell University Library. Getting Started with Library Research. library.cornell.edu/study/introduction-to-research/</text><text x="70" y="1833" fill="#B0B2A8" font-size="17" text-anchor="start" font-weight="400">[2] Novak, J. D., &amp; Cañas, A. J. (2008). The Theory Underlying Concept Maps. IHMC. cmap.ihmc.us/docs/theory-of-concept-maps.php</text><text x="70" y="1856" fill="#B0B2A8" font-size="17" text-anchor="start" font-weight="400">[3] Pashler et al. (2007). Organizing Instruction and Study to Improve Student Learning. IES. ies.ed.gov/ncee/wwc/PracticeGuide/1</text><text x="70" y="1879" fill="#B0B2A8" font-size="17" text-anchor="start" font-weight="400">图为研究方法的综合改编，不是已验证的万能学习流程。虚线表示待核查或回看关系；不是具体领域的已知因果。</text></g></svg>