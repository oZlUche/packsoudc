  <text x="90" y="120" font-size="54" fill="var(--vt-ink)" text-anchor="start" font-weight="600">旧书交换会，选哪种玩法？</text>
  <text x="90" y="180" font-size="30" fill="var(--vt-muted)" text-anchor="start" font-weight="400">Book swap: free exchange or small-group sharing?</text>
  <path d="M90 222H1280" stroke="var(--vt-muted)" stroke-opacity=".42" stroke-width="1" fill="none" data-decoration="guide" />
  <text x="90" y="280" font-size="23" fill="var(--vt-muted)" text-anchor="start" font-weight="400">示范条件：20位参与者 · 两小时 · 同一场地 · 两位组织者</text>
  <text x="520" y="668" font-size="24" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">方案 A 的具体安排</text>
  <text x="900" y="668" font-size="25" fill="var(--vt-ink)" text-anchor="middle" font-weight="500">同一个标准，分别对照</text>
  <text x="1280" y="668" font-size="24" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">方案 B 的具体安排</text>
  <text x="900" y="814" font-size="32" fill="var(--vt-ink)" text-anchor="middle" font-weight="500" data-in-node="criterion-1" data-padding="16">主要收获</text>
  <text x="900" y="862" font-size="20" fill="var(--vt-muted)" text-anchor="middle" font-weight="400" data-in-node="criterion-1" data-padding="16">希望参与者带走什么？</text>
  <text x="520" y="743" font-size="23" fill="var(--vt-ink)" text-anchor="middle" font-weight="400">先逛书桌，再一对一换书</text>
  <text x="520" y="785" font-size="23" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">重点放在找到想读的书</text>
  <text x="1280" y="743" font-size="23" fill="var(--vt-ink)" text-anchor="middle" font-weight="400">每人介绍一本自己带来的书</text>
  <text x="1280" y="785" font-size="23" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">重点放在听懂彼此的推荐</text>
  <text x="900" y="1094" font-size="32" fill="var(--vt-ink)" text-anchor="middle" font-weight="500" data-in-node="criterion-2" data-padding="16">参与方式</text>
  <text x="900" y="1142" font-size="20" fill="var(--vt-muted)" text-anchor="middle" font-weight="400" data-in-node="criterion-2" data-padding="16">一个人怎样加入？</text>
  <text x="520" y="1023" font-size="23" fill="var(--vt-ink)" text-anchor="middle" font-weight="400">自愿找人聊，也可以只看书</text>
  <text x="520" y="1065" font-size="23" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">不安排逐人轮流发言</text>
  <text x="1280" y="1023" font-size="23" fill="var(--vt-ink)" text-anchor="middle" font-weight="400">4组×5人，小组内轮流</text>
  <text x="1280" y="1065" font-size="23" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">每人3分钟，可选择跳过</text>
  <text x="900" y="1374" font-size="32" fill="var(--vt-ink)" text-anchor="middle" font-weight="500" data-in-node="criterion-3" data-padding="16">核心环节用时</text>
  <text x="900" y="1422" font-size="20" fill="var(--vt-muted)" text-anchor="middle" font-weight="400" data-in-node="criterion-3" data-padding="16">两种玩法都预留60分钟</text>
  <text x="584" y="1303" font-size="22" fill="var(--vt-ink)" text-anchor="middle" font-weight="400">自由交换60分钟</text>
  <text x="584" y="1345" font-size="22" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">不设个人发言时限</text>
  <text x="1216" y="1303" font-size="20" fill="var(--vt-ink)" text-anchor="middle" font-weight="400">轮讲15分＋交流45分</text>
  <text x="1216" y="1345" font-size="20" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">四组并行，每人3分钟</text>
  <text x="900" y="1654" font-size="32" fill="var(--vt-ink)" text-anchor="middle" font-weight="500" data-in-node="criterion-4" data-padding="16">空间与组织</text>
  <text x="900" y="1702" font-size="20" fill="var(--vt-muted)" text-anchor="middle" font-weight="400" data-in-node="criterion-4" data-padding="16">场地和人手要怎样配合？</text>
  <text x="520" y="1583" font-size="23" fill="var(--vt-ink)" text-anchor="middle" font-weight="400">书桌间留通行空间</text>
  <text x="520" y="1625" font-size="23" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">一人接待，一人巡视</text>
  <text x="1280" y="1583" font-size="23" fill="var(--vt-ink)" text-anchor="middle" font-weight="400">四个小组分区落座</text>
  <text x="1280" y="1625" font-size="23" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">两位组织者轮流巡组</text>
  <text x="900" y="1934" font-size="32" fill="var(--vt-ink)" text-anchor="middle" font-weight="500" data-in-node="criterion-5" data-padding="16">先验证什么</text>
  <text x="900" y="1982" font-size="20" fill="var(--vt-muted)" text-anchor="middle" font-weight="400" data-in-node="criterion-5" data-padding="16">试办后，什么会让你改方案？</text>
  <text x="520" y="1863" font-size="23" fill="var(--vt-ink)" text-anchor="middle" font-weight="400">是否真的发生交换？</text>
  <text x="520" y="1905" font-size="23" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">找不到合适的书怎么办？</text>
  <text x="1280" y="1863" font-size="23" fill="var(--vt-ink)" text-anchor="middle" font-weight="400">轮到时愿意开口吗？</text>
  <text x="1280" y="1905" font-size="23" fill="var(--vt-muted)" text-anchor="middle" font-weight="400">3分钟够讲清推荐理由吗？</text>
  <text x="330" y="1373" font-size="32" fill="var(--vt-bg)" text-anchor="middle" font-weight="600" data-in-node="object-a" data-padding="16">自由交换</text>
  <text x="330" y="1423" font-size="17" fill="var(--vt-bg)" text-anchor="middle" font-weight="400" data-in-node="object-a" data-padding="16">自主逛书、找人聊</text>
  <text x="1470" y="1373" font-size="32" fill="var(--vt-bg)" text-anchor="middle" font-weight="600" data-in-node="object-b" data-padding="16">小组分享</text>
  <text x="1470" y="1423" font-size="17" fill="var(--vt-bg)" text-anchor="middle" font-weight="400" data-in-node="object-b" data-padding="16">分组轮流，彼此倾听</text>
  <path d="M720 2340H1710" stroke="var(--vt-muted)" stroke-opacity=".42" stroke-width="1" fill="none" data-decoration="guide" />
  <text x="1710" y="2392" font-size="29" fill="var(--vt-ink)" text-anchor="end" font-weight="500">更看重换到书，还是深入交流？</text>
  <text x="1710" y="2440" font-size="23" fill="var(--vt-muted)" text-anchor="end" font-weight="400">据此调整两种环节的比例，再回看时间、场地和人手。</text>
  <text x="1710" y="2484" font-size="21" fill="var(--vt-muted)" text-anchor="end" font-weight="400">核心环节以外的60分钟，留给入场、说明、公共交流与收尾。</text>
  <text x="1710" y="2540" font-size="19" fill="var(--vt-muted)" text-anchor="end" font-weight="400">这是两种可组合的设计草案；参与体验与场地适配需通过试办检验。</text>
  <text x="1710" y="2587" font-size="17" fill="var(--vt-muted)" text-anchor="end" font-weight="400">Compare Map · 共同标准与两侧安排；拟议条件不表示用户已确认的需求。</text>
</svg>