<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2640" viewBox="0 0 1800 2640" role="img" aria-labelledby="title" aria-describedby="desc">
  <title id="title">旧书交换会，选哪种玩法？</title>
  <desc id="desc">用Compare Map比较自由交换与小组分享两种拟议玩法。相同示范条件为20位参与者、两小时、同一场地、两位组织者。中间五个方框依次列收获、参与方式、核心环节用时、空间与组织、试办要验证的事项；每个标准左右两边分别呈现对应方案的安排。两种玩法都为核心环节预留60分钟，小组分享假设四组五人并行，每人三分钟轮讲合计每组十五分钟，再留四十五分钟交流。这些是设计草案和算术示例，不是实际体验研究或已落实活动。节点与路径继承空白骨架，两个圆保持方案身份，方框保持共同标准身份。读者可据目标改变环节比例，或用一次试办修正方案，不预填哪一种必然更好。</desc>
  <style data-vt-theme="">:root{--vt-bg:#191A18;--vt-ink:#EFEEE7;--vt-muted:#B0B2A8;--vt-accent:#EFEEE7;--vt-surface:#272925;--vt-secondary:#383B34;--vt-line:1.8;--vt-title:54px;--vt-section:32px;--vt-label:24px;--vt-note:19px;}text{font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Helvetica Neue",sans-serif}</style>
