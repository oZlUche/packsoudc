<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">组织协作 · 通用示例</title><desc id="vt-desc">同一件事到达确认关口。假设没有回复，对照能继续和仍停住两条可能路径，检查依据、权限与尚缺条件。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#EFEEE7" stroke-width="1.2" /></marker></defs><rect width="1200" height="1400" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="60" fill="#B0B2A8" font-size="18" text-anchor="start" font-weight="400">组织协作 · 通用示例</text><text x="64" y="145" fill="#EFEEE7" font-size="62" text-anchor="start" font-weight="600">团队为什么总等我拍板？</text><text x="66" y="200" fill="#B0B2A8" font-size="24" text-anchor="start" font-weight="400">拿最近一件停住的事，沿着它的路径想一遍。</text><text x="64" y="289" fill="#B0B2A8" font-size="20" text-anchor="start" font-weight="400">01</text><text x="112" y="291" fill="#EFEEE7" font-size="34" text-anchor="start" font-weight="500">它究竟停在哪里？</text><path d="M184 492H492" fill="none" stroke="#B0B2A8" stroke-width="1.4" stroke-dasharray="" marker-end="url(#a)" /><g opacity="1"><rect x="262" y="463" width="46" height="58" rx="3" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M273 482h24M273 492h24M273 502h15" fill="none" stroke="#B0B2A8" stroke-width="1.2" stroke-dasharray="" /></g><text x="285" y="570" fill="#EFEEE7" font-size="24" text-anchor="middle" font-weight="400">同一件事</text><text x="285" y="607" fill="#B0B2A8" font-size="20" text-anchor="middle" font-weight="400">已经做到哪一步？</text><path d="M600 410V450M600 534V620" fill="none" stroke="#EFEEE7" stroke-width="2" stroke-dasharray="" /><path d="M610 410V450M610 534V620" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><path d="M600 450V534" fill="none" stroke="#EFEEE7" stroke-width="3" stroke-dasharray="" /><path d="M610 492H974" fill="none" stroke="#777C70" stroke-width="1.2" stroke-dasharray="4 9" marker-end="url(#a)" /><circle cx="600" cy="366" r="39" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="600" y="375" fill="#EFEEE7" font-size="26" text-anchor="middle" font-weight="400">我</text><path d="M600 405V435" fill="none" stroke="#B0B2A8" stroke-width="1.2" stroke-dasharray="" /><circle cx="600" cy="443" r="5" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="635" y="439" fill="#EFEEE7" font-size="24" text-anchor="start" font-weight="400">等我确认</text><text x="638" y="476" fill="#B0B2A8" font-size="20" text-anchor="start" font-weight="400">等的是哪一句话？</text><circle cx="997" cy="492" r="12" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="997" y="570" fill="#EFEEE7" font-size="24" text-anchor="middle" font-weight="400">下一步</text><text x="997" y="607" fill="#B0B2A8" font-size="20" text-anchor="middle" font-weight="400">被什么拦住？</text><path d="M64 662H1136" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><text x="64" y="724" fill="#B0B2A8" font-size="20" text-anchor="start" font-weight="400">02</text><text x="112" y="727" fill="#EFEEE7" font-size="34" text-anchor="start" font-weight="500">假设这次，我没有回复。</text><text x="112" y="768" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">沿两条可能的路径，各走一次。</text><path d="M600 822V1169" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><text x="64" y="844" fill="#EFEEE7" font-size="38" text-anchor="start" font-weight="500">能继续</text><text x="64" y="882" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">凭什么可以继续？</text><path d="M95 1018H510" fill="none" stroke="#B0B2A8" stroke-width="1.3" stroke-dasharray="" marker-end="url(#a)" /><path d="M315 949V976M315 1060V1086" fill="none" stroke="#EFEEE7" stroke-width="2" stroke-dasharray="" /><path d="M325 949V976M325 1060V1086" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><g opacity="0.35"><rect x="152" y="989" width="46" height="58" rx="3" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M163 1008h24M163 1018h24M163 1028h15" fill="none" stroke="#B0B2A8" stroke-width="1.2" stroke-dasharray="" /></g><g opacity="1"><rect x="364" y="989" width="46" height="58" rx="3" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M375 1008h24M375 1018h24M375 1028h15" fill="none" stroke="#B0B2A8" stroke-width="1.2" stroke-dasharray="" /></g><path d="M206 989Q266 950 349 989" fill="none" stroke="#EFEEE7" stroke-width="1.1" stroke-dasharray="3 6" marker-end="url(#a)" /><path d="M315 976Q346 964 360 942" fill="none" stroke="#777C70" stroke-width="1.3" stroke-dasharray="3 6" /><text x="64" y="1133" fill="#EFEEE7" font-size="21" text-anchor="start" font-weight="400">谁能决定 · 依据什么 · 到哪里为止</text><text x="64" y="1170" fill="#B0B2A8" font-size="20" text-anchor="start" font-weight="400">这些条件原本就有，还是需要补上？</text><text x="658" y="844" fill="#EFEEE7" font-size="38" text-anchor="start" font-weight="500">仍然停住</text><text x="658" y="882" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">真正缺少的是什么？</text><path d="M688 1018H860" fill="none" stroke="#B0B2A8" stroke-width="1.3" stroke-dasharray="" marker-end="url(#a)" /><g opacity="1"><rect x="765" y="989" width="46" height="58" rx="3" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M776 1008h24M776 1018h24M776 1028h15" fill="none" stroke="#B0B2A8" stroke-width="1.2" stroke-dasharray="" /></g><path d="M920 949V976M920 1060V1086" fill="none" stroke="#EFEEE7" stroke-width="2" stroke-dasharray="" /><path d="M930 949V976M930 1060V1086" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><path d="M920 976V1060" fill="none" stroke="#EFEEE7" stroke-width="3" stroke-dasharray="" /><path d="M932 1018H1110" fill="none" stroke="#777C70" stroke-width="1.2" stroke-dasharray="4 9" marker-end="url(#a)" /><circle cx="925" cy="930" r="10" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="3 4" /><text x="658" y="1133" fill="#EFEEE7" font-size="21" text-anchor="start" font-weight="400">信息？判断方法？权限？共同承担？</text><text x="658" y="1170" fill="#B0B2A8" font-size="20" text-anchor="start" font-weight="400">哪一个缺口，确实只能由我补？</text><path d="M64 1232H1136" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><text x="64" y="1291" fill="#EFEEE7" font-size="30" text-anchor="start" font-weight="500">我是在提供必要的判断，还是成了默认的开关？</text><text x="64" y="1342" fill="#B0B2A8" font-size="19" text-anchor="start" font-weight="400">实线画出停点；虚线试想后续。两条路径都是待核实的可能，不是对团队的诊断。</text></g></svg>