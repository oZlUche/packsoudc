<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1160" viewBox="0 0 1200 1160" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">结构性思考 · 从教育方法中借鉴</title><desc id="vt-desc">八个局部图区分界定、描述、比较、分类、拆解、顺序、因果和类比，展示关系对应的几何作用。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#EFEEE7" stroke-width="1.1" /></marker></defs><rect width="1200" height="1160" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="65" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">结构性思考 · 从教育方法中借鉴</text><text x="60" y="148" font-size="62" text-anchor="start" fill="#EFEEE7" font-weight="600">从简单图形，到结构性思考</text><text x="64" y="202" font-size="23" text-anchor="start" fill="#B0B2A8" font-weight="400">先辨认需要哪种关系，再决定用什么形状。八种动作可以组合，也可以继续扩展。</text><text x="64" y="293" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">界定</text><circle cx="174" cy="435" r="82" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="174" cy="435" r="25" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="174" y="441" font-size="15" text-anchor="middle" fill="#EFEEE7" font-weight="400">概念</text><circle cx="126" cy="401" r="4" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="223" cy="407" r="4" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="174" cy="489" r="4" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" /><text x="64" y="576" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">在哪个语境下谈它？</text><text x="344" y="293" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">描述</text><path d="M454 435L389 391" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="389" cy="391" r="16" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M454 435L519 391" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="519" cy="391" r="16" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M454 435L454 501" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="454" cy="501" r="16" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="454" cy="435" r="33" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="454" y="441" font-size="16" text-anchor="middle" fill="#EFEEE7" font-weight="400">对象</text><text x="344" y="576" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">特征，还是我的评价？</text><text x="624" y="293" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">比较</text><circle cx="696" cy="435" r="61" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="772" cy="435" r="61" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="671" y="441" font-size="18" text-anchor="middle" fill="#EFEEE7" font-weight="400">A</text><text x="797" y="441" font-size="18" text-anchor="middle" fill="#EFEEE7" font-weight="400">B</text><path d="M722 407L744 427M717 423L751 452M724 445L745 465" fill="none" stroke="#777C70" stroke-width="1" /><text x="624" y="576" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">同一标准下看异同。</text><text x="904" y="293" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">分类</text><circle cx="1014" cy="370" r="5" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" /><path d="M1014 375V423M939 423H1089" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><path d="M939 423V484" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="939" cy="490" r="17" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M1014 423V484" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="1014" cy="490" r="17" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M1089 423V484" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="1089" cy="490" r="17" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="904" y="576" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">按什么规则分组？</text><text x="64" y="683" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">拆解</text><circle cx="109" cy="825" r="46" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M157 825L199 790" fill="none" stroke="#777C70" stroke-width="1.3" stroke-dasharray="4 6" /><path d="M202 790L238 760A47 47 0 0 1 238 820Z" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><path d="M157 825L199 860" fill="none" stroke="#777C70" stroke-width="1.3" stroke-dasharray="4 6" /><path d="M202 860L238 830A47 47 0 0 1 238 890Z" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><text x="64" y="966" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">整体由什么部分组成？</text><text x="344" y="683" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">顺序</text><circle cx="372" cy="825" r="23" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="454" cy="825" r="23" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="536" cy="825" r="23" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M396 825H427" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><path d="M478 825H509" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><text x="344" y="966" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">先后，不直接等于因果。</text><text x="624" y="683" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">因果</text><circle cx="651" cy="770" r="8" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M661 770L705 825" fill="none" stroke="#777C70" stroke-width="1.4" stroke-dasharray="4 6" marker-end="url(#a)" /><circle cx="651" cy="880" r="8" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M661 880L705 825" fill="none" stroke="#777C70" stroke-width="1.4" stroke-dasharray="4 6" marker-end="url(#a)" /><circle cx="734" cy="825" r="26" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M762 825L808 770" fill="none" stroke="#777C70" stroke-width="1.4" stroke-dasharray="4 6" marker-end="url(#a)" /><circle cx="817" cy="770" r="8" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M762 825L808 880" fill="none" stroke="#777C70" stroke-width="1.4" stroke-dasharray="4 6" marker-end="url(#a)" /><circle cx="817" cy="880" r="8" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="624" y="966" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">哪条影响仍待核实？</text><text x="904" y="683" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">类比</text><circle cx="942" cy="787" r="16" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M961 787H1067" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><circle cx="1086" cy="787" r="16" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="942" cy="863" r="16" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><path d="M961 863H1067" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><circle cx="1086" cy="863" r="16" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="1014" y="830" font-size="16" text-anchor="middle" fill="#B0B2A8" font-weight="400">相同关系？</text><text x="904" y="966" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">相似的是哪种关系？</text><path d="M64 1022H1136" fill="none" stroke="#777C70" stroke-width="0.9" /><text x="64" y="1073" font-size="27" text-anchor="start" fill="#EFEEE7" font-weight="500">任何一张图，都可以再检查：依据从哪来？站在谁的位置？</text><text x="64" y="1120" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">通用关系的自绘示意；参考 Thinking Maps 的过程区分，不是其官方模板。</text></g></svg>