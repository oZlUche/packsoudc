<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">AI 辅助创作 · 通用示例</title><desc id="vt-desc">两个对应的关系空间通过移出对象、保留原位与待检验连接，邀请比较改变条件后的关系。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#EFEEE7" stroke-width="1.2" /></marker></defs><rect width="1200" height="1080" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="67" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">AI 辅助创作 · 通用示例</text><text x="60" y="161" font-size="68" text-anchor="start" fill="#EFEEE7" font-weight="600">拿掉谁，作品会怎样？</text><text x="64" y="216" font-size="25" text-anchor="start" fill="#B0B2A8" font-weight="400">保持同一创作任务，试着把一个参与者移出关系网。</text><text x="106" y="284" font-size="33" text-anchor="start" fill="#EFEEE7" font-weight="500">拿掉 AI</text><path d="M320 449L259 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M320 449L381 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M504 622L259 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M504 622L381 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M320 795L259 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M320 795L381 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M136 622L259 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M136 622L381 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><circle cx="259" cy="622" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.7" opacity="1" /><text x="259" y="632" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">我</text><circle cx="381" cy="622" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.7" opacity="1" stroke-dasharray="3 7" /><text x="381" y="629" font-size="18" text-anchor="middle" fill="#B0B2A8" font-weight="400">空位</text><circle cx="423" cy="562" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.15" opacity="0.17" /><circle cx="451" cy="497" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.15" opacity="0.28" /><circle cx="461" cy="427" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.15" opacity="0.46" /><circle cx="449" cy="357" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.7" opacity="1" /><text x="449" y="367" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">AI</text><path d="M446 602Q545 485 499 362" fill="none" stroke="#EFEEE7" stroke-width="1.25" opacity="1" marker-end="url(#arrow)" /><text x="554" y="434" font-size="18" text-anchor="middle" fill="#B0B2A8" font-weight="400">移出</text><circle cx="320" cy="449" r="5" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1" opacity="1" /><text x="320" y="426" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">选题</text><circle cx="504" cy="622" r="5" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1" opacity="1" /><text x="527" y="630" font-size="23" text-anchor="start" fill="#EFEEE7" font-weight="400">表达</text><circle cx="320" cy="795" r="5" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1" opacity="1" /><text x="320" y="830" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">核验</text><circle cx="136" cy="622" r="5" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1" opacity="1" /><text x="113" y="630" font-size="23" text-anchor="end" fill="#EFEEE7" font-weight="400">制作</text><text x="320" y="889" font-size="21" text-anchor="middle" fill="#B0B2A8" font-weight="400">沿空位的连线，检查哪些环节会改变。</text><text x="666" y="284" font-size="33" text-anchor="start" fill="#EFEEE7" font-weight="500">拿掉我</text><path d="M880 449L819 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M880 449L941 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M1064 622L819 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M1064 622L941 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M880 795L819 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M880 795L941 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M696 622L819 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><path d="M696 622L941 622" fill="none" stroke="#B0B2A8" stroke-width="1.35" opacity="1" stroke-dasharray="4 8" /><circle cx="819" cy="622" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.7" opacity="1" stroke-dasharray="3 7" /><text x="819" y="629" font-size="18" text-anchor="middle" fill="#B0B2A8" font-weight="400">空位</text><circle cx="777" cy="562" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.15" opacity="0.17" /><circle cx="749" cy="497" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.15" opacity="0.28" /><circle cx="739" cy="427" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.15" opacity="0.46" /><circle cx="751" cy="357" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.7" opacity="1" /><text x="751" y="367" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">我</text><path d="M754 602Q655 485 701 362" fill="none" stroke="#EFEEE7" stroke-width="1.25" opacity="1" marker-end="url(#arrow)" /><text x="646" y="434" font-size="18" text-anchor="middle" fill="#B0B2A8" font-weight="400">移出</text><circle cx="941" cy="622" r="49" fill="#191A18" stroke="#EFEEE7" stroke-width="1.7" opacity="1" /><text x="941" y="632" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">AI</text><circle cx="880" cy="449" r="5" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1" opacity="1" /><text x="880" y="426" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">选题</text><circle cx="1064" cy="622" r="5" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1" opacity="1" /><text x="1087" y="630" font-size="23" text-anchor="start" fill="#EFEEE7" font-weight="400">表达</text><circle cx="880" cy="795" r="5" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1" opacity="1" /><text x="880" y="830" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">核验</text><circle cx="696" cy="622" r="5" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1" opacity="1" /><text x="673" y="630" font-size="23" text-anchor="end" fill="#EFEEE7" font-weight="400">制作</text><text x="880" y="889" font-size="21" text-anchor="middle" fill="#B0B2A8" font-weight="400">沿空位的连线，检查哪些环节会改变。</text><path d="M64 935H1136" fill="none" stroke="#777C70" stroke-width="0.9" opacity="1" /><text x="64" y="991" font-size="32" text-anchor="start" fill="#EFEEE7" font-weight="500">失去的是速度、方向、质量，还是没有变化？</text><text x="64" y="1037" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">虚线：待检查的参与关系。重复轮廓：同一对象被移出的轨迹。</text></g></svg>