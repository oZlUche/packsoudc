<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">AI 辅助创作 · 通用示例</title><desc id="vt-desc">被看见、记住、信任与选择之间留出有含义的断口，供辨认每段连接成立的条件。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#EEEEE8" /></marker></defs><rect width="1100" height="1000" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="65" font-size="19" text-anchor="start" fill="#A5A69F" font-weight="400">AI 辅助创作 · 通用示例</text><text x="60" y="149" font-size="59" text-anchor="start" fill="#EEEEE8" font-weight="600">被看见之后，还差什么？</text><text x="64" y="199" font-size="23" text-anchor="start" fill="#B2B3AA" font-weight="400">把这些关系分开检查；这是一条探索路径，不是假设人人都会依次经过。</text><circle cx="160" cy="450" r="78" fill="#191A18" stroke="#EEEEE8" stroke-width="1.7" /><text x="160" y="459" font-size="28" text-anchor="middle" fill="#EEEEE8" font-weight="500">被看见</text><circle cx="420" cy="450" r="78" fill="#191A18" stroke="#EEEEE8" stroke-width="1.7" /><text x="420" y="459" font-size="28" text-anchor="middle" fill="#EEEEE8" font-weight="500">被记住</text><circle cx="680" cy="450" r="78" fill="#191A18" stroke="#EEEEE8" stroke-width="1.7" /><text x="680" y="459" font-size="28" text-anchor="middle" fill="#EEEEE8" font-weight="500">被信任</text><circle cx="940" cy="450" r="78" fill="#191A18" stroke="#EEEEE8" stroke-width="1.7" /><text x="940" y="459" font-size="28" text-anchor="middle" fill="#EEEEE8" font-weight="500">被选择</text><path d="M238 450H266" fill="none" stroke="#EEEEE8" stroke-width="1.7" marker-end="url(#a)" /><path d="M313 450H342" fill="none" stroke="#EEEEE8" stroke-width="1.7" marker-end="url(#a)" /><path d="M280 440L289 459M294 440L303 459" fill="none" stroke="#B2B3AA" stroke-width="1.7" /><text x="290" y="344" font-size="20" text-anchor="middle" fill="#EEEEE8" font-weight="400">凭什么认出你？</text><path d="M290 364V407" fill="none" stroke="#92958B" stroke-width="1.7" /><path d="M498 450H526" fill="none" stroke="#EEEEE8" stroke-width="1.7" marker-end="url(#a)" /><path d="M573 450H602" fill="none" stroke="#EEEEE8" stroke-width="1.7" marker-end="url(#a)" /><path d="M540 440L549 459M554 440L563 459" fill="none" stroke="#B2B3AA" stroke-width="1.7" /><text x="550" y="344" font-size="20" text-anchor="middle" fill="#EEEEE8" font-weight="400">凭什么相信你？</text><path d="M550 364V407" fill="none" stroke="#92958B" stroke-width="1.7" /><path d="M758 450H786" fill="none" stroke="#EEEEE8" stroke-width="1.7" marker-end="url(#a)" /><path d="M833 450H862" fill="none" stroke="#EEEEE8" stroke-width="1.7" marker-end="url(#a)" /><path d="M800 440L809 459M814 440L823 459" fill="none" stroke="#B2B3AA" stroke-width="1.7" /><text x="810" y="344" font-size="20" text-anchor="middle" fill="#EEEEE8" font-weight="400">为什么此刻找你？</text><path d="M810 364V407" fill="none" stroke="#92958B" stroke-width="1.7" /><path d="M160 528C160 696 370 696 370 572C370 557 366 540 358 527" fill="none" stroke="#EEEEE8" stroke-width="1.7" marker-end="url(#a)" /><text x="355" y="699" font-size="23" text-anchor="middle" fill="#EEEEE8" font-weight="400">多做、再发、增加曝光</text><text x="355" y="738" font-size="23" text-anchor="middle" fill="#B2B3AA" font-weight="400">它能补上哪一个断口？</text><text x="64" y="270" font-size="22" text-anchor="start" fill="#B2B3AA" font-weight="400">从左往右，找出你最想讨论的一次跨越。</text><path d="M64 830H1036" fill="none" stroke="#555750" stroke-width="1.7" /><text x="64" y="880" font-size="30" text-anchor="start" fill="#EEEEE8" font-weight="500">挑一个断口，想一件真正让关系改变的事。</text><text x="64" y="925" font-size="22" text-anchor="start" fill="#B2B3AA" font-weight="400">那件事为什么有用？换一个人、一个场景，还成立吗？</text></g></svg>