<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">设计思维转译 · 自主绘制的思考样张</title><desc id="vt-desc">将待验证的假设画为连接的桥，通过局部试用取得反馈，再返回检查原关系。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#EFEEE7" stroke-width="1.2" /></marker></defs><rect width="1200" height="1280" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="60" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">设计思维转译 · 自主绘制的思考样张</text><text x="62" y="145" font-size="56" text-anchor="start" fill="#EFEEE7" font-weight="600">我的分享，听众真的用得上吗？</text><text x="64" y="201" font-size="23" text-anchor="start" fill="#B0B2A8" font-weight="400">把“感觉会有效”，变成一个可以观察、也可能不成立的问题。</text><text x="64" y="292" font-size="25" text-anchor="start" fill="#EFEEE7" font-weight="400">先挑一个猜想：听众听完，能把其中一个方法用起来。</text><circle cx="208" cy="445" r="55" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="208" y="454" font-size="28" text-anchor="middle" fill="#EFEEE7" font-weight="500">听懂</text><circle cx="992" cy="445" r="55" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="992" y="454" font-size="28" text-anchor="middle" fill="#EFEEE7" font-weight="500">会用</text><path d="M265 445H467M734 445H936" fill="none" stroke="#B0B2A8" stroke-width="1.5" stroke-dasharray="" marker-end="url(#a)" /><path d="M467 445Q600 330 733 445" fill="none" stroke="#EFEEE7" stroke-width="1.5" stroke-dasharray="5 8" marker-end="url(#a)" /><text x="600" y="330" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="400">这个跨越成立吗？</text><text x="600" y="486" font-size="22" text-anchor="middle" fill="#B0B2A8" font-weight="400">中间需要什么条件？</text><path d="M600 523V598" fill="none" stroke="#B0B2A8" stroke-width="1.3" stroke-dasharray="" marker-end="url(#a)" /><text x="64" y="635" font-size="32" text-anchor="start" fill="#EFEEE7" font-weight="500">不做整场分享，先让一个片段接受检验。</text><rect x="125" y="736" width="156" height="182" fill="none" stroke="#EFEEE7" stroke-width="1.6" /><path d="M151 775H254M151 799H254M151 823H224" fill="none" stroke="#B0B2A8" stroke-width="1.2" stroke-dasharray="" /><text x="203" y="877" font-size="24" text-anchor="middle" fill="#EFEEE7" font-weight="400">一个片段</text><path d="M304 826H469" fill="none" stroke="#B0B2A8" stroke-width="1.5" stroke-dasharray="" marker-end="url(#a)" /><circle cx="516" cy="770" r="15" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><path d="M516 786V847M492 810H540M516 847L493 878M516 847L539 878" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="516" y="935" font-size="22" text-anchor="middle" fill="#EFEEE7" font-weight="400">请一个人试着使用</text><path d="M565 826H725" fill="none" stroke="#B0B2A8" stroke-width="1.5" stroke-dasharray="" marker-end="url(#a)" /><path d="M786 747H1042V908H786V870M786 782V747" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="5 8" /><text x="915" y="806" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">换个情境</text><text x="915" y="850" font-size="22" text-anchor="middle" fill="#EFEEE7" font-weight="400">他能独立做一次吗？</text><text x="64" y="1022" font-size="26" text-anchor="start" fill="#EFEEE7" font-weight="500">观察哪里停住</text><path d="M274 1014H468" fill="none" stroke="#B0B2A8" stroke-width="1.2" stroke-dasharray="" marker-end="url(#a)" /><text x="503" y="1022" font-size="25" text-anchor="start" fill="#EFEEE7" font-weight="400">再回看：改片段，还是改猜想？</text><text x="64" y="1074" font-size="22" text-anchor="start" fill="#B0B2A8" font-weight="400">结果先留空。真正观察之后，才能把这条桥画实或重新连接。</text><path d="M64 1125H1136" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><text x="64" y="1183" font-size="30" text-anchor="start" fill="#EFEEE7" font-weight="500">这次试用，能让我修正哪一个判断？</text><text x="64" y="1234" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">借鉴 d.school 的原型学习；这是试验构想，不是试验结果，也不等于长期效果。</text></g></svg>