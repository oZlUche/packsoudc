<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">修订 05 · 让抽取与反馈发生在图上</title><desc id="vt-desc">从课程整体抽出一个局部试学，原位保持可追踪，并将待获得的反馈带回原结构。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#EFEEE7" stroke-width="1.2" /></marker><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#EFEEE7" stroke-width="1" opacity=".55" /></pattern><clipPath id="left"><circle cx="445" cy="590" r="213" /></clipPath></defs><rect width="1200" height="1440" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="59" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">修订 05 · 让抽取与反馈发生在图上</text><text x="62" y="139" font-size="61" text-anchor="start" fill="#EFEEE7" font-weight="600">做一门写作课，</text><text x="62" y="212" font-size="61" text-anchor="start" fill="#EFEEE7" font-weight="600">要先录完20节吗？</text><text x="64" y="268" font-size="24" text-anchor="start" fill="#B0B2A8" font-weight="400">空位是被抽出的那一节；重复轮廓是它的移动痕迹。</text><text x="64" y="349" font-size="25" text-anchor="start" fill="#EFEEE7" font-weight="400">先抽出一节，让一个假设接触现实。</text><path d="M686 1001C462 1194 84 1060 104 840C122 660 389 662 468 564" fill="none" stroke="#B0B2A8" stroke-width="1.4" stroke-dasharray="5 9" marker-end="url(#a)" /><text x="269" y="1034" font-size="25" text-anchor="middle" fill="#EFEEE7" font-weight="400">带回反馈</text><rect x="150" y="410" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="258" y="410" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="366" y="410" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="474" y="410" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="582" y="410" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="150" y="518" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="258" y="518" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="366" y="518" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="474" y="518" width="92" height="92" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 7" /><rect x="582" y="518" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="150" y="626" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="258" y="626" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="366" y="626" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="474" y="626" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="582" y="626" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="150" y="734" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="258" y="734" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="366" y="734" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="474" y="734" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><rect x="582" y="734" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="" /><text x="410" y="895" font-size="30" text-anchor="middle" fill="#EFEEE7" font-weight="500">20节完整课</text><text x="410" y="937" font-size="21" text-anchor="middle" fill="#B0B2A8" font-weight="400">先不把其余部分全部做完</text><path d="M570 564C867 495 1108 656 934 876" fill="none" stroke="#EFEEE7" stroke-width="1.5" stroke-dasharray="" marker-end="url(#a)" /><rect x="709" y="552" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="2 7" /><rect x="882" y="651" width="92" height="92" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="2 7" /><text x="919" y="487" font-size="26" text-anchor="middle" fill="#EFEEE7" font-weight="400">抽出同一节</text><circle cx="863" cy="982" r="181" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="5 8" /><text x="863" y="758" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">一次试学</text><rect x="817" y="876" width="92" height="92" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="863" y="931" font-size="26" text-anchor="middle" fill="#EFEEE7" font-weight="500">一节</text><path d="M920 921Q1000 1009 922 1069" fill="none" stroke="#EFEEE7" stroke-width="1.3" stroke-dasharray="" marker-end="url(#a)" /><path d="M807 1030H893M807 1055H893M807 1080H857" fill="none" stroke="#B0B2A8" stroke-width="1.5" stroke-dasharray="" /><text x="863" y="1213" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="500">能独立写出一段吗？</text><path d="M64 1246H1136" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><text x="64" y="1310" font-size="30" text-anchor="start" fill="#EFEEE7" font-weight="500">试学之后，哪一块需要回去重新设计？</text><text x="64" y="1373" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">20格表示设想的课程；虚线试学区尚无结果，移动轮廓不表示新增课程。</text></g></svg>