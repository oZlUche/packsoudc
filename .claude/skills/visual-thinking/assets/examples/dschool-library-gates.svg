<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">修订 04 · 把不同干预放回同一条路径</title><desc id="vt-desc">读者经过注意到、想读与借还条件，探索增加藏书改变哪一个入口，而不预设障碍原因。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#EFEEE7" stroke-width="1.2" /></marker><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#EFEEE7" stroke-width="1" opacity=".55" /></pattern><clipPath id="left"><circle cx="445" cy="590" r="213" /></clipPath></defs><rect width="1200" height="1440" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="59" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">修订 04 · 把不同干预放回同一条路径</text><text x="62" y="139" font-size="61" text-anchor="start" fill="#EFEEE7" font-weight="600">社区图书角借书少，</text><text x="62" y="212" font-size="61" text-anchor="start" fill="#EFEEE7" font-weight="600">要再买100本新书吗？</text><text x="64" y="268" font-size="24" text-anchor="start" fill="#B0B2A8" font-weight="400">三层边界表示借阅中待检查的条件；虚线跟随同一个读者。</text><text x="64" y="349" font-size="25" text-anchor="start" fill="#EFEEE7" font-weight="400">让一个读者沿路径走一遍：新增的书，改变了哪一层？</text><path d="M917.14 912.79A365 365 0 1 1 917.14 687.21" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-dasharray="" /><path d="M491.51 1041.57A254 254 0 1 1 648.49 1041.57" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-dasharray="" /><path d="M614.50 663.05A144 144 0 1 1 525.50 663.05" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-dasharray="" /><path d="M1085 800H876A306 306 0 0 1 570 1106L570 1000A200 200 0 0 1 570 600V748" fill="none" stroke="#B0B2A8" stroke-width="1.6" stroke-dasharray="5 9" marker-end="url(#a)" /><circle cx="1090" cy="800" r="8" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="1090" y="745" font-size="24" text-anchor="middle" fill="#EFEEE7" font-weight="400">读者</text><circle cx="570" cy="800" r="48" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="570" y="809" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="500">借走</text><text x="570" y="482" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">能注意到吗？</text><text x="570" y="538" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="500">有想读的吗？</text><text x="570" y="882" font-size="24" text-anchor="middle" fill="#EFEEE7" font-weight="400">借还</text><text x="570" y="916" font-size="24" text-anchor="middle" fill="#EFEEE7" font-weight="400">方便吗？</text><rect x="120" y="558" width="40" height="75" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><rect x="170" y="558" width="40" height="75" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><rect x="220" y="558" width="40" height="75" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="190" y="526" font-size="26" text-anchor="middle" fill="#EFEEE7" font-weight="500">加100本</text><path d="M265 592Q333 546 417 591" fill="none" stroke="#EFEEE7" stroke-width="1.5" stroke-dasharray="" marker-end="url(#a)" /><circle cx="434" cy="598" r="6" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="258" y="1140" font-size="24" text-anchor="middle" fill="#B0B2A8" font-weight="400">换展示？</text><text x="871" y="1140" font-size="24" text-anchor="middle" fill="#B0B2A8" font-weight="400">换借还方式？</text><text x="600" y="1200" font-size="24" text-anchor="middle" fill="#EFEEE7" font-weight="400">试着移动不同的开口，看哪一处能接上读者的路径。</text><path d="M64 1246H1136" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><text x="64" y="1310" font-size="30" text-anchor="start" fill="#EFEEE7" font-weight="500">增加书以后，还有哪一层需要继续观察？</text><text x="64" y="1373" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">边界、开口和路线用于推演，不表示实际人数、距离或已查明的障碍。</text></g></svg>