<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1000" viewBox="0 0 1100 1000" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">AI 辅助创作 · 通用示例</title><desc id="vt-desc">对应网络中移除或替换一个参与者，保留其他条件以检查连接与选择的变化。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#EEEEE8" /></marker></defs><rect width="1100" height="1000" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="65" font-size="19" text-anchor="start" fill="#A5A69F" font-weight="400">AI 辅助创作 · 通用示例</text><text x="60" y="149" font-size="59" text-anchor="start" fill="#EEEEE8" font-weight="600">拿掉谁，作品会怎样？</text><text x="64" y="199" font-size="23" text-anchor="start" fill="#B2B3AA" font-weight="400">让创作任务、受众与目标保持不变，每次只替换一个参与者。虚线表示待检查的参与关系。</text><text x="285" y="292" font-size="35" text-anchor="middle" fill="#EEEEE8" font-weight="500">拿掉 AI</text><path d="M285 365L232 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M285 365L338 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M461 520L232 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M461 520L338 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M285 675L232 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M285 675L338 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M109 520L232 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M109 520L338 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><circle cx="285" cy="365" r="8" fill="#EEEEE8" stroke="#EEEEE8" stroke-width="1.7" /><text x="285" y="343" font-size="22" text-anchor="middle" fill="#EEEEE8" font-weight="400">选题</text><circle cx="461" cy="520" r="8" fill="#EEEEE8" stroke="#EEEEE8" stroke-width="1.7" /><text x="496" y="527" font-size="22" text-anchor="middle" fill="#EEEEE8" font-weight="400">表达</text><circle cx="285" cy="675" r="8" fill="#EEEEE8" stroke="#EEEEE8" stroke-width="1.7" /><text x="285" y="718" font-size="22" text-anchor="middle" fill="#EEEEE8" font-weight="400">核验</text><circle cx="109" cy="520" r="8" fill="#EEEEE8" stroke="#EEEEE8" stroke-width="1.7" /><text x="74" y="527" font-size="22" text-anchor="middle" fill="#EEEEE8" font-weight="400">制作</text><circle cx="232" cy="520" r="43" fill="#191A18" stroke="#EEEEE8" stroke-width="1.7" /><text x="232" y="529" font-size="25" text-anchor="middle" fill="#EEEEE8" font-weight="400">我</text><circle cx="338" cy="520" r="43" fill="#191A18" stroke="#EEEEE8" stroke-width="1.7" stroke-dasharray="5 7" /><text x="338" y="529" font-size="25" text-anchor="middle" fill="#EEEEE8" font-weight="400">AI</text><path d="M300 482L376 558" fill="none" stroke="#EEEEE8" stroke-width="1.7" /><text x="285" y="760" font-size="25" text-anchor="middle" fill="#EEEEE8" font-weight="400">哪些环节与选择会改变？</text><text x="815" y="292" font-size="35" text-anchor="middle" fill="#EEEEE8" font-weight="500">换掉我</text><path d="M815 365L762 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M815 365L868 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M991 520L762 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M991 520L868 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M815 675L762 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M815 675L868 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M639 520L762 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><path d="M639 520L868 520" fill="none" stroke="#92958B" stroke-width="1.7" stroke-dasharray="6 8" /><circle cx="815" cy="365" r="8" fill="#EEEEE8" stroke="#EEEEE8" stroke-width="1.7" /><text x="815" y="343" font-size="22" text-anchor="middle" fill="#EEEEE8" font-weight="400">选题</text><circle cx="991" cy="520" r="8" fill="#EEEEE8" stroke="#EEEEE8" stroke-width="1.7" /><text x="1026" y="527" font-size="22" text-anchor="middle" fill="#EEEEE8" font-weight="400">表达</text><circle cx="815" cy="675" r="8" fill="#EEEEE8" stroke="#EEEEE8" stroke-width="1.7" /><text x="815" y="718" font-size="22" text-anchor="middle" fill="#EEEEE8" font-weight="400">核验</text><circle cx="639" cy="520" r="8" fill="#EEEEE8" stroke="#EEEEE8" stroke-width="1.7" /><text x="604" y="527" font-size="22" text-anchor="middle" fill="#EEEEE8" font-weight="400">制作</text><circle cx="762" cy="520" r="43" fill="#191A18" stroke="#EEEEE8" stroke-width="1.7" stroke-dasharray="5 7" /><text x="762" y="529" font-size="25" text-anchor="middle" fill="#EEEEE8" font-weight="400">我</text><path d="M724 482L800 558" fill="none" stroke="#EEEEE8" stroke-width="1.7" /><circle cx="868" cy="520" r="43" fill="#191A18" stroke="#EEEEE8" stroke-width="1.7" /><text x="868" y="529" font-size="25" text-anchor="middle" fill="#EEEEE8" font-weight="400">AI</text><text x="815" y="760" font-size="25" text-anchor="middle" fill="#EEEEE8" font-weight="400">哪些环节与选择会改变？</text><path d="M550 330V742" fill="none" stroke="#555750" stroke-width="1.7" /><path d="M64 830H1036" fill="none" stroke="#555750" stroke-width="1.7" /><text x="64" y="880" font-size="30" text-anchor="start" fill="#EEEEE8" font-weight="500">拿同一件作品，分别做两次思想实验。</text><text x="64" y="925" font-size="22" text-anchor="start" fill="#B2B3AA" font-weight="400">沿虚线辨认真实参与：失去的是速度、方向、质量，还是没有变化？</text></g></svg>