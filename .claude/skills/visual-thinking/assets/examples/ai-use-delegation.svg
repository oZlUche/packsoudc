<text x="140" y="368" font-size="33" font-weight="400" fill="var(--vt-muted)" text-anchor="start">先拆任务，再看能否核验；目标不同，交出的步骤也不同。</text>
<g transform="translate(0 180)">
<text x="2350" y="532" font-size="31" font-weight="400" fill="var(--vt-muted)" text-anchor="middle">小样表现稳定，收益值得总成本 → 下一轮试着扩大一小步 [1,3,4]</text>
<path id="scope-expansion" data-edge="" data-from="usable-work" d="M3280 1020V592A12 12 0 0 0 3268 580H642A12 12 0 0 0 630 592V970" fill="none" stroke="var(--vt-ink)" stroke-width="2" stroke-dasharray="6 10"/>
<circle id="whole-task" data-node="" cx="280" cy="1500" r="140" fill="var(--vt-bg)" stroke="var(--vt-ink)" stroke-width="2.5"/>
<text x="280" y="1490" font-size="42" font-weight="500" fill="var(--vt-ink)" text-anchor="middle" data-in-node="whole-task" data-padding="14">整件任务</text>
<text x="280" y="1548" font-size="30" font-weight="400" fill="var(--vt-muted)" text-anchor="middle" data-in-node="whole-task" data-padding="14">先拆开</text>
<text x="280" y="1280" font-size="29" font-weight="500" fill="var(--vt-ink)" text-anchor="middle">拆到能单独检查的一步</text>
