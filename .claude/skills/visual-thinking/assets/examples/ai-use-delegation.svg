<text x="2100" y="1389" font-size="30" font-weight="400" fill="var(--vt-muted)" text-anchor="middle">未过关：缩小这一步／补依据</text>
<text x="2100" y="1501" font-size="27" font-weight="400" fill="var(--vt-muted)" text-anchor="middle">看不准／后果重大：缩小授权。[9]</text>
