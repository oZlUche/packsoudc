<text x="970" y="982" font-size="28" font-weight="400" fill="var(--vt-muted)" text-anchor="middle" data-in-node="build-verification" data-padding="14">查原文／找能核验的人帮忙</text>
<text x="970" y="1040" font-size="27" font-weight="400" fill="var(--vt-muted)" text-anchor="middle" data-in-node="build-verification" data-padding="14">AI 可找线索；结论暂不采用。</text>
<path id="cannot-verify" data-edge="" data-from="can-verify" data-to="build-verification" d="M970 1350V1105" fill="none" stroke="var(--vt-ink)" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1010" y="1232" font-size="28" font-weight="400" fill="var(--vt-muted)" text-anchor="start">不能</text>
