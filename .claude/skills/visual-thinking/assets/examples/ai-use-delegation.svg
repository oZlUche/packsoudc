<rect width="3600" height="3730" fill="var(--vt-bg)" data-decoration="background"/>
<text x="140" y="170" font-size="88" font-weight="600" fill="var(--vt-ink)" text-anchor="start">用好 AI：先划清委托的边界</text>
<text x="140" y="254" font-size="48" font-weight="400" fill="var(--vt-muted)" text-anchor="start">How much should you delegate to AI?</text>
