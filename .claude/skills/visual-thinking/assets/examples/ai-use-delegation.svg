<text x="630" y="1454" font-size="40" font-weight="500" fill="var(--vt-ink)" text-anchor="middle" data-in-node="selected-step" data-padding="14">选一小步</text>
<text x="630" y="1514" font-size="27" font-weight="400" fill="var(--vt-muted)" text-anchor="middle" data-in-node="selected-step" data-padding="14">明确输入与输出</text>
<text x="630" y="1573" font-size="25" font-weight="400" fill="var(--vt-muted)" text-anchor="middle" data-in-node="selected-step" data-padding="14">如：提取原文要点</text>
