<text x="1240" y="1041" font-size="28" font-weight="400" fill="var(--vt-muted)" text-anchor="start">AI 可先做</text>
<text x="1240" y="1791" font-size="36" font-weight="500" fill="var(--vt-ink)" text-anchor="start">形成能力</text>
<text x="1240" y="1841" font-size="28" font-weight="400" fill="var(--vt-muted)" text-anchor="start">自己要练</text>
<rect id="work-delegation" data-decoration="semantic-boundary" x="1400" y="865" width="900" height="700" fill="none" stroke="var(--vt-muted)" stroke-opacity="0.65" stroke-width="1.5"/>
<text x="1850" y="785" font-size="38" font-weight="500" fill="var(--vt-ink)" text-anchor="middle">可委托：做出候选</text>
<text x="1850" y="838" font-size="28" font-weight="400" fill="var(--vt-muted)" text-anchor="middle">提供目标、材料、限制与合格标准 [8]</text>
