<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">修订 03 · 用边界扩大衡量范围</title><desc id="vt-desc">从会议时长扩大到一周协作边界，纳入补问、等待和返工等待核实条件。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#EFEEE7" stroke-width="1.2" /></marker><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#EFEEE7" stroke-width="1" opacity=".55" /></pattern><clipPath id="left"><circle cx="445" cy="590" r="213" /></clipPath></defs><rect width="1200" height="1440" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="59" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">修订 03 · 用边界扩大衡量范围</text><text x="62" y="139" font-size="61" text-anchor="start" fill="#EFEEE7" font-weight="600">周会缩到15分钟，</text><text x="62" y="212" font-size="61" text-anchor="start" fill="#EFEEE7" font-weight="600">就会更省时吗？</text><text x="64" y="268" font-size="24" text-anchor="start" fill="#B0B2A8" font-weight="400">亮弧是拟保留的15分钟；外圈把会后的协作也纳入视野。</text><text x="64" y="349" font-size="25" text-anchor="start" fill="#EFEEE7" font-weight="400">缩短会议，再扩大观察范围。</text><circle cx="600" cy="785" r="408" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="600" y="440" font-size="32" text-anchor="middle" fill="#EFEEE7" font-weight="500">一周协作</text><circle cx="600" cy="785" r="181" fill="#191A18" stroke="#777C70" stroke-width="1.6" stroke-dasharray="4 8" /><path d="M600.00 604.00A181 181 0 0 1 781.00 785.00" fill="none" stroke="#EFEEE7" stroke-width="3" stroke-dasharray="" /><path d="M600 604V785H781" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="643" y="733" font-size="48" text-anchor="middle" fill="#EFEEE7" font-weight="500">15</text><text x="643" y="767" font-size="22" text-anchor="middle" fill="#EFEEE7" font-weight="400">分钟</text><text x="549" y="849" font-size="22" text-anchor="middle" fill="#B0B2A8" font-weight="400">原计划</text><text x="549" y="888" font-size="29" text-anchor="middle" fill="#B0B2A8" font-weight="400">60分钟</text><text x="600" y="1006" font-size="25" text-anchor="middle" fill="#EFEEE7" font-weight="400">会议内</text><circle cx="350" cy="588" r="14" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="3 5" /><text x="350" y="553" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="500">补问？</text><circle cx="895" cy="850" r="14" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="3 5" /><text x="895" y="815" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="500">等待？</text><circle cx="390" cy="1080" r="14" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="3 5" /><text x="390" y="1045" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="500">返工？</text><path d="M447 678Q391 648 359 608" fill="none" stroke="#B0B2A8" stroke-width="1.5" stroke-dasharray="5 8" marker-end="url(#a)" /><path d="M774 836Q823 854 876 850" fill="none" stroke="#B0B2A8" stroke-width="1.5" stroke-dasharray="5 8" marker-end="url(#a)" /><path d="M493 932Q467 1010 408 1066" fill="none" stroke="#B0B2A8" stroke-width="1.5" stroke-dasharray="5 8" marker-end="url(#a)" /><text x="1044" y="618" font-size="22" text-anchor="middle" fill="#B0B2A8" font-weight="400">镜头</text><text x="1044" y="651" font-size="22" text-anchor="middle" fill="#B0B2A8" font-weight="400">拉远</text><path d="M1027 670Q1085 793 1026 922" fill="none" stroke="#B0B2A8" stroke-width="1.1" stroke-dasharray="" marker-end="url(#a)" /><path d="M64 1246H1136" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><text x="64" y="1310" font-size="30" text-anchor="start" fill="#EFEEE7" font-weight="500">会议内少掉的时间，是否在外圈重新出现？</text><text x="64" y="1373" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">内圈按15／60分钟画；外圈是观察范围，外部节点没有实测时长。</text></g></svg>