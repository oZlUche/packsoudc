<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2800" viewBox="0 0 2400 2800" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">下班后的两小时，为什么还是读不了书？</title><desc id="desc">一个虚构晚上19到21点的共同时间轴，工作收尾、其他占用和连续阅读窗口分轨。空档为25加25分钟。只有将20分钟通话移出窗口，才形成19点50到21点的70分钟连续区间；不删除通话，也不假定精力足够。</desc><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4" /></marker></defs><rect width="2400" height="2800" fill="#191A18" data-decoration="background" /><text x="120" y="155" fill="#EFEEE7" font-size="64" text-anchor="start" font-weight="600">下班后的两小时，为什么还是读不了书？</text><text x="120" y="233" fill="#B0B2A8" font-size="33" text-anchor="start" font-weight="400">Two hours on the clock, but how much uninterrupted time?</text><path d="M120 290H1750" stroke="#50554C" data-decoration="separator" /><text x="120" y="340" fill="#B0B2A8" font-size="29" text-anchor="start" font-weight="400">虚构的一个晚上；用自己的记录替换。这里只检验时间是否被切碎。</text><path d="M510 650H2200" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" data-decoration="time-axis" /><text x="510.0" y="590" fill="#B0B2A8" font-size="32" text-anchor="middle" font-weight="400">19:00</text><path d="M510.0 670V2030" stroke="#50554C" stroke-width="1.5" stroke-dasharray="5 10" data-decoration="time-alignment" /><text x="932.5" y="590" fill="#B0B2A8" font-size="32" text-anchor="middle" font-weight="400">19:30</text><path d="M932.5 670V2030" stroke="#50554C" stroke-width="1.5" stroke-dasharray="5 10" data-decoration="time-alignment" /><text x="1355.0" y="590" fill="#B0B2A8" font-size="32" text-anchor="middle" font-weight="400">20:00</text><path d="M1355.0 670V2030" stroke="#50554C" stroke-width="1.5" stroke-dasharray="5 10" data-decoration="time-alignment" /><text x="1777.5" y="590" fill="#B0B2A8" font-size="32" text-anchor="middle" font-weight="400">20:30</text><path d="M1777.5 670V2030" stroke="#50554C" stroke-width="1.5" stroke-dasharray="5 10" data-decoration="time-alignment" /><text x="2200.0" y="590" fill="#B0B2A8" font-size="32" text-anchor="middle" font-weight="400">21:00</text><path d="M2200.0 670V2030" stroke="#50554C" stroke-width="1.5" stroke-dasharray="5 10" data-decoration="time-alignment" /><text x="110" y="892" fill="#EFEEE7" font-size="34" text-anchor="start" font-weight="500">工作收尾</text><path d="M510 880H2200" stroke="#50554C" stroke-width="1.5" data-decoration="track" /><text x="110" y="1232" fill="#EFEEE7" font-size="34" text-anchor="start" font-weight="500">其他占用</text><path d="M510 1220H2200" stroke="#50554C" stroke-width="1.5" data-decoration="track" /><text x="110" y="1572" fill="#EFEEE7" font-size="34" text-anchor="start" font-weight="500">连续阅读窗</text><path d="M510 1560H2200" stroke="#50554C" stroke-width="1.5" data-decoration="track" /><text x="110" y="1912" fill="#EFEEE7" font-size="34" text-anchor="start" font-weight="500">若通话可后移</text><path d="M510 1900H2200" stroke="#50554C" stroke-width="1.5" data-decoration="track" /><rect id="work-block" data-node="" x="510.0" y="832" width="352.08333333333337" height="96" fill="#191A18" stroke="#EFEEE7" stroke-width="2" /><text x="686.0416666666667" y="892" fill="#EFEEE7" font-size="28" text-anchor="middle" font-weight="500" data-in-node="work-block" data-padding="12">收尾25分</text><rect id="house-block" data-node="" x="791.6666666666667" y="1172" width="422.5" height="96" fill="#191A18" stroke="#EFEEE7" stroke-width="2" /><text x="1002.9166666666667" y="1232" fill="#EFEEE7" font-size="28" text-anchor="middle" font-weight="500" data-in-node="house-block" data-padding="12">吃饭／家务30分</text><rect id="call-block" data-node="" x="1566.25" y="1172" width="281.66666666666674" height="96" fill="#191A18" stroke="#EFEEE7" stroke-width="2" /><text x="1707.0833333333335" y="1232" fill="#EFEEE7" font-size="28" text-anchor="middle" font-weight="500" data-in-node="call-block" data-padding="12">通话20分</text><rect id="free-a" data-node="" x="1214.1666666666667" y="1512" width="352.08333333333326" height="96" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="2" /><text x="1390.2083333333335" y="1572" fill="#191A18" font-size="28" text-anchor="middle" font-weight="500" data-in-node="free-a" data-padding="12">25分钟</text><rect id="free-b" data-node="" x="1847.9166666666667" y="1512" width="352.08333333333326" height="96" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="2" /><text x="2023.9583333333335" y="1572" fill="#191A18" font-size="28" text-anchor="middle" font-weight="500" data-in-node="free-b" data-padding="12">25分钟</text><rect id="free-if" data-node="" x="1214.1666666666667" y="1852" width="985.8333333333333" height="96" fill="#191A18" stroke="#EFEEE7" stroke-width="2" stroke-dasharray="8 10" /><text x="1707.0833333333335" y="1912" fill="#EFEEE7" font-size="28" text-anchor="middle" font-weight="500" data-in-node="free-if" data-padding="12">70分钟：仅当这次通话能移出当前窗口</text><circle id="work-end" data-node="" cx="862.0833333333334" cy="880" r="9" fill="#EFEEE7" /><text x="862.0833333333334" y="1030" fill="#B0B2A8" font-size="26" text-anchor="middle" font-weight="400">结束时点</text><text x="1200" y="2130" fill="#EFEEE7" font-size="34" text-anchor="middle" font-weight="500">先看最长的一段在哪里，再判断哪块占用真的能移动。</text><path d="M850 2350H2280" stroke="#50554C" data-decoration="separator" /><text x="2280" y="2422" fill="#EFEEE7" font-size="38" text-anchor="end" font-weight="500">总时长和连续窗口，是两种不同的读法。</text><text x="2280" y="2482" fill="#B0B2A8" font-size="28" text-anchor="end" font-weight="400">空档不自动等于可用精力；不能移动的占用仍须保留。</text><text x="120" y="2580" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">[1] IRIS Center · Graphic Organizers · Sequencing；[2] FSU ACE · Timeline / Sequence of Events</text><text x="120" y="2620" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">iris.peabody.vanderbilt.edu/activity/graphic-organizers/；ace.fsu.edu/study-tools-and-tips/graphic-organizers-subject-area</text><text x="120" y="2660" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">时间分布为虚构算例；实心条＝按当前占用推算的窗口，虚线条＝满足条件后才成立的窗口，点＝时点。</text></svg>