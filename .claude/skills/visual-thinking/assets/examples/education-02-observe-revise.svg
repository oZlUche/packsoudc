<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">结构性思考 · 从教育方法中借鉴</title><desc id="vt-desc">把观察与解释分开，寻找能区分不同解释的新观察，再返回修订理解。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#EFEEE7" stroke-width="1.1" /></marker></defs><rect width="1200" height="1360" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="65" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">结构性思考 · 从教育方法中借鉴</text><text x="60" y="148" font-size="62" text-anchor="start" fill="#EFEEE7" font-weight="600">我看见的，等于我知道的吗？</text><text x="64" y="202" font-size="23" text-anchor="start" fill="#B0B2A8" font-weight="400">从一个具体作品或现象出发，把观察、推断与修订画在不同位置。</text><text x="64" y="260" font-size="24" text-anchor="start" fill="#B0B2A8" font-weight="400">把同一观察与几个解释分开，先别急着把其中一个封成答案。</text><circle cx="235" cy="520" r="102" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="235" y="510" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="400">眼前的</text><text x="235" y="551" font-size="31" text-anchor="middle" fill="#EFEEE7" font-weight="500">现象</text><path d="M339 501C490 495 478 365 617 365" fill="none" stroke="#B0B2A8" stroke-width="1.4" stroke-dasharray="5 8" marker-end="url(#a)" /><circle cx="702" cy="365" r="81" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="702" y="359" font-size="24" text-anchor="middle" fill="#EFEEE7" font-weight="400">一种</text><text x="702" y="395" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="400">解释</text><path d="M339 520H901" fill="none" stroke="#B0B2A8" stroke-width="1.4" stroke-dasharray="5 8" marker-end="url(#a)" /><circle cx="987" cy="520" r="81" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="987" y="514" font-size="24" text-anchor="middle" fill="#EFEEE7" font-weight="400">另一种</text><text x="987" y="550" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="400">解释</text><path d="M339 539C490 545 478 675 617 675" fill="none" stroke="#B0B2A8" stroke-width="1.4" stroke-dasharray="5 8" marker-end="url(#a)" /><circle cx="702" cy="675" r="81" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="702" y="669" font-size="24" text-anchor="middle" fill="#EFEEE7" font-weight="400">还有别的</text><text x="702" y="705" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="400">可能？</text><text x="501" y="388" font-size="20" text-anchor="middle" fill="#B0B2A8" font-weight="400">靠哪项细节？</text><text x="635" y="501" font-size="20" text-anchor="middle" fill="#B0B2A8" font-weight="400">还有别的解释吗？</text><text x="500" y="681" font-size="20" text-anchor="middle" fill="#B0B2A8" font-weight="400">哪里仍没看清？</text><path d="M64 823H1136" fill="none" stroke="#777C70" stroke-width="0.9" /><text x="64" y="886" font-size="36" text-anchor="start" fill="#EFEEE7" font-weight="500">哪种新观察，能帮助区分这些解释？</text><circle cx="233" cy="1080" r="73" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="233" y="1072" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">原先的</text><text x="233" y="1108" font-size="28" text-anchor="middle" fill="#EFEEE7" font-weight="400">理解</text><path d="M309 1080H516" fill="none" stroke="#B0B2A8" stroke-width="1.4" stroke-dasharray="4 7" marker-end="url(#a)" /><circle cx="588" cy="1080" r="54" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="588" y="1074" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">新增</text><text x="588" y="1105" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">观察</text><path d="M644 1080H891" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><circle cx="968" cy="1080" r="73" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="968" y="1072" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">暂时的</text><text x="968" y="1108" font-size="28" text-anchor="middle" fill="#EFEEE7" font-weight="400">理解</text><path d="M574 1134C530 1236 292 1236 251 1153" fill="none" stroke="#B0B2A8" stroke-width="1.3" stroke-dasharray="4 7" marker-end="url(#a)" /><text x="450" y="1244" font-size="21" text-anchor="middle" fill="#B0B2A8" font-weight="400">证据未改变，也可以维持原判断。</text><text x="64" y="1320" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">自绘的证据与修订地图；参考教育方法的思考目标，不预填事实或结论。</text></g></svg>