<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2100" viewBox="0 0 1800 2100" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">寻找适合孩子的教育  /  共用标准，逐处核对，再组合</title><desc id="vt-desc">候选教育安排与共同条件交叉，定位待核实交点，再放大为可观察的情境。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#EFEEE7" stroke-width="1.2" /></marker></defs><rect width="1800" height="2100" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="70" y="64" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">寻找适合孩子的教育  /  共用标准，逐处核对，再组合</text><text x="65" y="151" fill="#EFEEE7" font-size="68" text-anchor="start" font-weight="600">把“适合”，</text><text x="65" y="230" fill="#EFEEE7" font-size="68" text-anchor="start" font-weight="600">放到具体的交点上检验。</text><text x="70" y="291" fill="#B0B2A8" font-size="26" text-anchor="start" font-weight="400">横着看：同一个需要，哪种安排怎样回应？竖着看：一个安排，有哪些支持与缺口？</text><text x="495" y="371" fill="#EFEEE7" font-size="30" text-anchor="start" font-weight="500">先放进实际可接触的安排 [1,2]</text><text x="1295" y="371" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">名称由当地调查替换</text><text x="640" y="445" fill="#EFEEE7" font-size="30" text-anchor="middle" font-weight="500">园所 A</text><text x="1000" y="445" fill="#EFEEE7" font-size="30" text-anchor="middle" font-weight="500">园所 B</text><text x="1360" y="445" fill="#EFEEE7" font-size="30" text-anchor="middle" font-weight="500">家庭＋社区组合</text><text x="1360" y="487" fill="#B0B2A8" font-size="21" text-anchor="middle" font-weight="400">照护与同伴需具体落实</text><text x="180" y="445" fill="#EFEEE7" font-size="27" text-anchor="start" font-weight="500">检验什么</text><text x="180" y="487" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">从她的日常，辨认具体需要</text><path d="M165 525H1540" fill="none" stroke="#6F746C" stroke-width="1" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="573" fill="#EFEEE7" font-size="29" text-anchor="start" font-weight="500">尊重与安全</text><text x="180" y="614" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">孩子受委屈时，</text><text x="180" y="645" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">谁保护她、怎样处理？</text><path d="M522 597.5H616M664 597.5H758" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="627" y="584.5" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M882 597.5H976M1024 597.5H1118" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="987" y="584.5" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M1242 597.5H1336M1384 597.5H1478" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="1347" y="584.5" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M165 670H1540" fill="none" stroke="#6F746C" stroke-width="1" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="718" fill="#EFEEE7" font-size="29" text-anchor="start" font-weight="500">探索与学习</text><text x="180" y="759" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">她能发起、尝试吗？</text><text x="180" y="790" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">遇到困难怎样支持？</text><path d="M522 750.0H616M664 750.0H758" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="627" y="737.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M882 750.0H976M1024 750.0H1118" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="987" y="737.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M1242 750.0H1336M1384 750.0H1478" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="1347" y="737.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M165 830H1540" fill="none" stroke="#6F746C" stroke-width="1" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="878" fill="#EFEEE7" font-size="29" text-anchor="start" font-weight="500">身体与节奏</text><text x="180" y="919" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">活动、休息与户外，</text><text x="180" y="950" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">怎样给她留出时间？</text><path d="M522 910.0H616M664 910.0H758" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="627" y="897.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M882 910.0H976M1024 910.0H1118" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="987" y="897.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M1242 910.0H1336M1384 910.0H1478" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="1347" y="897.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M165 990H1540" fill="none" stroke="#6F746C" stroke-width="1" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="1038" fill="#EFEEE7" font-size="29" text-anchor="start" font-weight="500">情绪与同伴</text><text x="180" y="1079" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">情绪有人回应吗？</text><text x="180" y="1110" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">同伴交往怎样支持？</text><path d="M522 1070.0H616M664 1070.0H758" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="627" y="1057.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M882 1070.0H976M1024 1070.0H1118" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="987" y="1057.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M1242 1070.0H1336M1384 1070.0H1478" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="1347" y="1057.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M165 1150H1540" fill="none" stroke="#6F746C" stroke-width="1" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><text x="180" y="1198" fill="#EFEEE7" font-size="29" text-anchor="start" font-weight="500">家庭可持续</text><text x="180" y="1239" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">时间、费用与通勤，</text><text x="180" y="1270" fill="#B0B2A8" font-size="21" text-anchor="start" font-weight="400">实际由谁承担？</text><path d="M522 1225.0H616M664 1225.0H758" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="627" y="1212.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M882 1225.0H976M1024 1225.0H1118" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="987" y="1212.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M1242 1225.0H1336M1384 1225.0H1478" fill="none" stroke="#6F746C" stroke-width="1.2" stroke-dasharray="4 7" stroke-linecap="round" stroke-linejoin="round" /><rect x="1347" y="1212.0" width="26" height="26" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 5" /><path d="M165 1300H1540" fill="none" stroke="#6F746C" stroke-width="1" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><path d="M470 510V1300" fill="none" stroke="#6F746C" stroke-width="1" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><path d="M820 510V1300" fill="none" stroke="#6F746C" stroke-width="1" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><path d="M1180 510V1300" fill="none" stroke="#6F746C" stroke-width="1" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><path d="M1540 510V1300" fill="none" stroke="#6F746C" stroke-width="1" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><path d="M137 525H112V670H137" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><text x="76" y="570" fill="#EFEEE7" font-size="23" text-anchor="middle" font-weight="400">共同</text><text x="76" y="609" fill="#EFEEE7" font-size="23" text-anchor="middle" font-weight="400">底线</text><path d="M137 680H112V1140H137" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><text x="76" y="865" fill="#EFEEE7" font-size="23" text-anchor="middle" font-weight="400">对她</text><text x="76" y="904" fill="#EFEEE7" font-size="23" text-anchor="middle" font-weight="400">适配</text><path d="M137 1150H112V1300H137" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><text x="76" y="1203" fill="#EFEEE7" font-size="23" text-anchor="middle" font-weight="400">能否</text><text x="76" y="1242" fill="#EFEEE7" font-size="23" text-anchor="middle" font-weight="400">持续</text><path d="M1564 552H1610V1280" fill="none" stroke="#B0B2A8" stroke-width="1.5" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><text x="1660" y="772" fill="#B0B2A8" font-size="23" text-anchor="middle" font-weight="400">沿</text><text x="1660" y="814" fill="#B0B2A8" font-size="23" text-anchor="middle" font-weight="400">一</text><text x="1660" y="856" fill="#B0B2A8" font-size="23" text-anchor="middle" font-weight="400">列</text><text x="1660" y="898" fill="#B0B2A8" font-size="23" text-anchor="middle" font-weight="400">看</text><text x="1660" y="940" fill="#B0B2A8" font-size="23" text-anchor="middle" font-weight="400">整</text><text x="1660" y="982" fill="#B0B2A8" font-size="23" text-anchor="middle" font-weight="400">体</text><text x="176" y="1352" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">空心交点＝这项支持尚待核实；线段用于对照，不是分数、已知表现或因果。</text><rect x="510" y="686" width="260" height="129" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="6 8" /><rect x="180" y="1470" width="1360" height="332" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="215" y="1524" fill="#EFEEE7" font-size="30" text-anchor="start" font-weight="500">放大：园所 A × 探索与学习 [2]</text><text x="215" y="1570" fill="#B0B2A8" font-size="23" text-anchor="start" font-weight="400">在普通时段追一段活动：她的想法，怎样变成能继续的尝试？</text><rect x="235" y="1622" width="220" height="70" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="345" y="1667" fill="#EFEEE7" font-size="26" text-anchor="middle" font-weight="500">孩子想尝试</text><path d="M468 1657H660" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><text x="565" y="1613" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">成人怎样回应？</text><rect x="677" y="1622" width="285" height="70" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="5 7" /><text x="819" y="1667" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="400">帮助、材料或限制</text><path d="M976 1657H1168" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a)" /><text x="1072" y="1613" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">接下来怎样？</text><rect x="1185" y="1622" width="290" height="70" fill="none" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="1330" y="1667" fill="#EFEEE7" font-size="25" text-anchor="middle" font-weight="500">继续、调整或停住</text><text x="215" y="1760" fill="#B0B2A8" font-size="24" text-anchor="start" font-weight="400">把看到的事填回原交点；再看园所 B 与家庭组合怎样回应同一个需要。</text><text x="180" y="1870" fill="#EFEEE7" font-size="28" text-anchor="start" font-weight="500">整列看完，再区分缺口：</text><text x="660" y="1870" fill="#EFEEE7" font-size="27" text-anchor="middle" font-weight="500">触及底线</text><text x="660" y="1916" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">需要排除或立即处理</text><text x="1040" y="1870" fill="#EFEEE7" font-size="27" text-anchor="middle" font-weight="500">可补足的不足</text><text x="1040" y="1916" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">园所、家庭、社区谁补？</text><text x="1420" y="1870" fill="#EFEEE7" font-size="27" text-anchor="middle" font-weight="500">仍然不了解</text><text x="1420" y="1916" fill="#B0B2A8" font-size="22" text-anchor="middle" font-weight="400">再观察，保留判断</text><path d="M70 1960H1730" fill="none" stroke="#6F746C" stroke-width="1" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round" /><text x="70" y="2000" fill="#B0B2A8" font-size="16" text-anchor="start" font-weight="400">[1] NAEYC. DAP: Core Considerations to Inform Decision Making. naeyc.org/node/3797</text><text x="70" y="2024" fill="#B0B2A8" font-size="16" text-anchor="start" font-weight="400">[2] NAEYC. What Does a High-Quality Preschool Program Look Like? naeyc.org/our-work/families/what-does-high-quality-program-for-preschool-look-like</text><text x="70" y="2048" fill="#B0B2A8" font-size="16" text-anchor="start" font-weight="400">[3] NAEYC. DAP: Observing, Documenting, and Assessing Children’s Development and Learning. naeyc.org/resources/position-statements/dap/assessing-development/</text><text x="70" y="2072" fill="#B0B2A8" font-size="16" text-anchor="start" font-weight="400">比较结构为综合改编，尚无当地考察结果；支持条件需持续观察 [3]，一次接触不足以判定长期适合。主图用于眼前学前选择。2026-10-16。</text></g></svg>