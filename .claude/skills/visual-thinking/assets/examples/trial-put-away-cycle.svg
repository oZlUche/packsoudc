<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2700" viewBox="0 0 2400 2700" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">家里为什么收拾完，很快又乱？</title><desc id="desc">追踪同一件常用物品，从固定位置到使用中、用后待归位，再放回固定位置形成循环。可能分向临时放下，图中保留未闭合的返回缺口；不把所有杂乱都归因于这一条路径。</desc><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4" /></marker></defs><rect width="2400" height="2700" fill="#191A18" data-decoration="background" /><text x="120" y="155" fill="#EFEEE7" font-size="64" text-anchor="start" font-weight="600">家里为什么收拾完，很快又乱？</text><text x="120" y="233" fill="#B0B2A8" font-size="33" text-anchor="start" font-weight="400">Where does the put-away cycle stop?</text><path d="M120 290H1750" stroke="#50554C" data-decoration="separator" /><text x="120" y="340" fill="#B0B2A8" font-size="29" text-anchor="start" font-weight="400">先追踪同一件常用物品的一轮；再换一件核对，不把局部当成全部原因。</text><circle id="home" data-node="" cx="550" cy="900" r="160" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="2.2" /><text fill="#191A18" font-size="40" text-anchor="middle" font-weight="500" data-in-node="home" data-padding="14"><tspan x="550" y="882.0">固定位置</tspan><tspan x="550" y="942.0">可取用</tspan></text><circle id="using" data-node="" cx="1800" cy="900" r="140" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text fill="#EFEEE7" font-size="40" text-anchor="middle" font-weight="500" data-in-node="using" data-padding="14"><tspan x="1800" y="912.0">使用中</tspan></text><circle id="waiting" data-node="" cx="1800" cy="1500" r="150" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text fill="#EFEEE7" font-size="40" text-anchor="middle" font-weight="500" data-in-node="waiting" data-padding="14"><tspan x="1800" y="1482.0">用完了</tspan><tspan x="1800" y="1542.0">待归位</tspan></text><circle id="temporary" data-node="" cx="1000" cy="1500" r="125" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" /><text fill="#EFEEE7" font-size="36" text-anchor="middle" font-weight="500" data-in-node="temporary" data-padding="14"><tspan x="1000" y="1512.0">临时放下</tspan></text><path d="M722 900H1648" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" data-edge="" data-from="home" data-to="using" id="hu" /><path d="M1800 1052V1338" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" data-edge="" data-from="using" data-to="waiting" id="uw" /><path d="M1800 1662V1858A12 12 0 0 1 1788 1870H562A12 12 0 0 1 550 1858V1072" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" data-edge="" data-from="waiting" data-to="home" id="wh" /><text x="1160" y="825" fill="#B0B2A8" font-size="32" text-anchor="middle" font-weight="400">取出</text><text x="1860" y="1190" fill="#B0B2A8" font-size="32" text-anchor="start" font-weight="400">用完</text><text x="1160" y="1955" fill="#B0B2A8" font-size="32" text-anchor="middle" font-weight="400">具备归位条件时：放回固定位置</text><path d="M1638 1500H1137" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#arrow)" stroke-dasharray="7 10" data-edge="" data-from="waiting" data-to="temporary" id="wt" /><text x="1390" y="1420" fill="#B0B2A8" font-size="29" text-anchor="middle" font-weight="400">若暂时不归位</text><text x="1000" y="1710" fill="#EFEEE7" font-size="34" text-anchor="middle" font-weight="500">它会怎样接回归位？</text><text x="1000" y="1780" fill="#B0B2A8" font-size="28" text-anchor="middle" font-weight="400">位置太远／放不下／不好放？</text><text x="1200" y="500" fill="#B0B2A8" font-size="29" text-anchor="middle" font-weight="400">实线是可闭合的归位循环；虚线是可能的中断。</text><path d="M850 2210H2280" stroke="#50554C" data-decoration="separator" /><text x="2280" y="2282" fill="#EFEEE7" font-size="38" text-anchor="end" font-weight="500">先定位停住的状态，再试改归位条件。</text><text x="2280" y="2342" fill="#B0B2A8" font-size="28" text-anchor="end" font-weight="400">这张图检验物品流转；不预设家庭成员的习惯、责任或真实房屋安排。</text><text x="120" y="2440" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">[1] IRIS Center · Graphic Organizers · Cycle；[2] FSU ACE · Cyclical Flow Chart（方法用途依据）</text><text x="120" y="2480" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">iris.peabody.vanderbilt.edu/activity/graphic-organizers/；ace.fsu.edu/study-tools-and-tips/graphic-organizers-subject-area</text><text x="120" y="2520" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">自主生活应用：圆始终表示同一物品的状态；循环不保证秩序会自动改善，也未作为家务干预效果证据。</text></svg>