<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1360" viewBox="0 0 1200 1360" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">结构性思考 · 芒格模型的绘图改编</title><desc id="vt-desc">对照希望的结果与实际奖励的行为，再从同一资源起点比较不同用途。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#EFEEE7" stroke-width="1.1" /></marker><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#EFEEE7" stroke-width="1" opacity=".6" /></pattern><clipPath id="left"><circle cx="760" cy="455" r="127" /></clipPath></defs><rect width="1200" height="1360" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="65" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">结构性思考 · 芒格模型的绘图改编</text><text x="60" y="148" font-size="64" text-anchor="start" fill="#EFEEE7" font-weight="600">把选择背后的力量画出来</text><text x="64" y="202" font-size="24" text-anchor="start" fill="#B0B2A8" font-weight="400">从奖励与替代用途出发，检查行为和资源会怎样改变。</text><text x="64" y="302" font-size="21" text-anchor="start" fill="#B0B2A8" font-weight="400">激励</text><text x="64" y="360" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">奖励在把人推向哪？</text><text x="64" y="412" font-size="22" text-anchor="start" fill="#EFEEE7" font-weight="400">想要的结果，与被奖励的动作，</text><text x="64" y="450" font-size="23" text-anchor="start" fill="#EFEEE7" font-weight="400">到底重合了多少？</text><text x="64" y="507" font-size="20" text-anchor="start" fill="#B0B2A8" font-weight="400">试着改变奖励，再沿关系往下想。</text><circle cx="760" cy="455" r="127" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><circle cx="930" cy="455" r="127" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><g clip-path="url(#left)"><circle cx="930" cy="455" r="127" fill="url(#h)" /></g><text x="712" y="448" font-size="22" text-anchor="middle" fill="#EFEEE7" font-weight="400">真正想要的</text><text x="712" y="482" font-size="25" text-anchor="middle" fill="#EFEEE7" font-weight="500">结果</text><text x="978" y="448" font-size="22" text-anchor="middle" fill="#EFEEE7" font-weight="400">被奖励的</text><text x="978" y="482" font-size="25" text-anchor="middle" fill="#EFEEE7" font-weight="500">动作</text><text x="844" y="284" font-size="22" text-anchor="middle" fill="#B0B2A8" font-weight="400">重合部分是什么？</text><path d="M844 303V344" fill="none" stroke="#777C70" stroke-width="1.2" /><path d="M995 604Q907 677 804 610" fill="none" stroke="#EFEEE7" stroke-width="1.3" marker-end="url(#a)" /><text x="907" y="705" font-size="20" text-anchor="middle" fill="#B0B2A8" font-weight="400">改变评价方式，边界会怎样移动？</text><text x="64" y="849" font-size="21" text-anchor="start" fill="#B0B2A8" font-weight="400">机会成本</text><text x="64" y="907" font-size="34" text-anchor="start" fill="#EFEEE7" font-weight="500">选中一路，挤掉哪路？</text><text x="64" y="959" font-size="22" text-anchor="start" fill="#EFEEE7" font-weight="400">把同一份精力放在不同地方，</text><text x="64" y="997" font-size="22" text-anchor="start" fill="#EFEEE7" font-weight="400">找出最值得保留的替代用途。</text><text x="64" y="1051" font-size="20" text-anchor="start" fill="#B0B2A8" font-weight="400">不是把所有没选的损失相加。</text><circle cx="573" cy="1050" r="37" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="573" y="1044" font-size="17" text-anchor="middle" fill="#EFEEE7" font-weight="400">同一份</text><text x="573" y="1068" font-size="20" text-anchor="middle" fill="#EFEEE7" font-weight="400">精力</text><path d="M610 1050C740 1050 760 906 964 906" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><circle cx="979" cy="906" r="6" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="978" y="880" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">增加内容产出</text><path d="M610 1050C740 1050 760 1047 964 1047" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><circle cx="979" cy="1047" r="6" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="978" y="1021" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">深入一个问题</text><path d="M610 1050C740 1050 760 1188 964 1188" fill="none" stroke="#EFEEE7" stroke-width="1.6" marker-end="url(#a)" /><circle cx="979" cy="1188" r="6" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" /><text x="978" y="1162" font-size="23" text-anchor="middle" fill="#EFEEE7" font-weight="400">其他可行用途</text><text x="830" y="1250" font-size="20" text-anchor="middle" fill="#B0B2A8" font-weight="400">选一路，再看看另外两路失去了什么。</text><path d="M64 749H1136" fill="none" stroke="#777C70" stroke-width="0.9" /><text x="64" y="1310" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">图中路径与边界供自行检验；不是芒格原图，也没有预填你的答案。</text></g></svg>