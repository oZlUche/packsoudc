<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2400" viewBox="0 0 2400 2400" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">30天读完300页，怎样安排才可行？</title><desc id="desc">两组实际阅读天数与每阅读日页数的乘积都等于300页；30天每天10页和20个阅读日每天15页。虚线比较因素变化，不是因果影响。实际分钟数与理解须另行检验。</desc><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4" /></marker></defs><rect width="2400" height="2400" fill="#191A18" data-decoration="background" /><text x="120" y="155" fill="#EFEEE7" font-size="64" text-anchor="start" font-weight="600">30天读完300页，怎样安排才可行？</text><text x="120" y="233" fill="#B0B2A8" font-size="33" text-anchor="start" font-weight="400">One reading target, different combinations</text><path d="M120 290H1750" stroke="#50554C" data-decoration="separator" /><text x="120" y="340" fill="#B0B2A8" font-size="29" text-anchor="start" font-weight="400">算例目标：30个日历日内读完300页；阅读日不一定等于日历日。</text><text x="1200" y="620" fill="#EFEEE7" font-size="40" text-anchor="middle" font-weight="500">实际阅读天数 × 每个阅读日页数 ＝ 完成页数</text><rect id="days-a" data-node="" x="245" y="790" width="390" height="230" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="440" y="897" fill="#EFEEE7" font-size="80" text-anchor="middle" font-weight="500" data-in-node="days-a" data-padding="18">30</text><text x="440" y="970" fill="#B0B2A8" font-size="29" text-anchor="middle" font-weight="400" data-in-node="days-a" data-padding="18">个实际阅读日</text><rect id="quota-a" data-node="" x="1045" y="790" width="390" height="230" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="1240" y="897" fill="#EFEEE7" font-size="80" text-anchor="middle" font-weight="500" data-in-node="quota-a" data-padding="18">10</text><text x="1240" y="970" fill="#B0B2A8" font-size="29" text-anchor="middle" font-weight="400" data-in-node="quota-a" data-padding="18">页／阅读日</text><rect id="days-b" data-node="" x="245" y="1370" width="390" height="230" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="440" y="1477" fill="#EFEEE7" font-size="80" text-anchor="middle" font-weight="500" data-in-node="days-b" data-padding="18">20</text><text x="440" y="1550" fill="#B0B2A8" font-size="29" text-anchor="middle" font-weight="400" data-in-node="days-b" data-padding="18">个实际阅读日</text><rect id="quota-b" data-node="" x="1045" y="1370" width="390" height="230" fill="#191A18" stroke="#EFEEE7" stroke-width="2.2" /><text x="1240" y="1477" fill="#EFEEE7" font-size="80" text-anchor="middle" font-weight="500" data-in-node="quota-b" data-padding="18">15</text><text x="1240" y="1550" fill="#B0B2A8" font-size="29" text-anchor="middle" font-weight="400" data-in-node="quota-b" data-padding="18">页／阅读日</text><text x="840" y="935" fill="#EFEEE7" font-size="74" text-anchor="middle" font-weight="300">×</text><text x="840" y="1515" fill="#EFEEE7" font-size="74" text-anchor="middle" font-weight="300">×</text><circle id="total" data-node="" cx="1970" cy="1210" r="175" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="2.2" /><text x="1970" y="1205" fill="#191A18" font-size="84" text-anchor="middle" font-weight="500" data-in-node="total" data-padding="18">300</text><text x="1970" y="1285" fill="#191A18" font-size="32" text-anchor="middle" font-weight="500" data-in-node="total" data-padding="18">页</text><path d="M1447 905H1628A12 12 0 0 1 1640 917V1198A12 12 0 0 0 1652 1210H1783" fill="none" stroke="#EFEEE7" stroke-width="2.2" data-decoration="quantitative-equality" /><path d="M1447 1485H1628A12 12 0 0 0 1640 1473V1222A12 12 0 0 1 1652 1210H1783" fill="none" stroke="#EFEEE7" stroke-width="2.2" data-decoration="quantitative-equality" /><text x="1730" y="1160" fill="#EFEEE7" font-size="48" text-anchor="middle" font-weight="400">＝</text><path d="M440 1032V1358" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" data-decoration="factor-comparison" /><text x="490" y="1200" fill="#B0B2A8" font-size="29" text-anchor="start" font-weight="400">少10个阅读日</text><path d="M1240 1032V1358" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" data-decoration="factor-comparison" /><text x="1290" y="1200" fill="#B0B2A8" font-size="29" text-anchor="start" font-weight="400">每次由10页变15页</text><text x="1200" y="1780" fill="#EFEEE7" font-size="34" text-anchor="middle" font-weight="500">再用自己的实测：读10页要多久，能否讲清其中一段？</text><path d="M850 1990H2280" stroke="#50554C" data-decoration="separator" /><text x="2280" y="2062" fill="#EFEEE7" font-size="38" text-anchor="end" font-weight="500">等式算得通，还要放得进真实生活。</text><text x="2280" y="2122" fill="#B0B2A8" font-size="28" text-anchor="end" font-weight="400">30×10＝20×15＝300；只计阅读页数，不等于已经理解或掌握。</text><text x="120" y="2220" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">[1] 方法用途：Math Factors Organizer；Graphic Organizers 原书（因素组合用途，自主改编）</text><text x="120" y="2260" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">moodley2023.eduhk.hk/pluginfile.php/126330/mod_folder/content/0/Ref%20for%20Tutors_Graphic%20Organisers%201.pdf</text><text x="120" y="2300" fill="#B0B2A8" font-size="22" text-anchor="start" font-weight="400">所有数字为本题公开算例，不是对用户读速、可用时间或学习效果的估计。</text></svg>