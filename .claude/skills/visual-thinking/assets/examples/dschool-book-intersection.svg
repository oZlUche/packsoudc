<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">示例 01 · 写作者 · 换到读者的位置</title><desc id="vt-desc">作者想交代的背景与读者此刻需要的内容交叠，区分现在出现和后面出现的材料。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#EFEEE7" stroke-width="1.2" /></marker><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#EFEEE7" stroke-width="1" opacity=".55" /></pattern><clipPath id="left"><circle cx="445" cy="590" r="213" /></clipPath></defs><rect width="1200" height="1440" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="59" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">示例 01 · 写作者 · 换到读者的位置</text><text x="62" y="139" font-size="61" text-anchor="start" fill="#EFEEE7" font-weight="600">第一章，要不要先把</text><text x="62" y="212" font-size="61" text-anchor="start" fill="#EFEEE7" font-weight="600">所有背景交代清楚？</text><text x="64" y="268" font-size="24" text-anchor="start" fill="#B0B2A8" font-weight="400">想象一本正在写的书：把镜头从作者移向第一次翻开它的人。</text><text x="64" y="350" font-size="25" text-anchor="start" fill="#EFEEE7" font-weight="400">先把“我想交代的”与“读者此刻需要的”叠在一起。</text><circle cx="445" cy="590" r="213" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><circle cx="755" cy="590" r="213" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><g clip-path="url(#left)"><circle cx="755" cy="590" r="213" fill="url(#h)" /></g><text x="366" y="566" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">我想交代的</text><text x="366" y="609" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">全部背景</text><text x="834" y="566" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">读者此刻</text><text x="834" y="609" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">需要的内容</text><circle cx="600" cy="590" r="8" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><path d="M600 599V788" fill="none" stroke="#B0B2A8" stroke-width="1.3" stroke-dasharray="" marker-end="url(#a)" /><path d="M550 867Q467 890 365 918" fill="none" stroke="#B0B2A8" stroke-width="1.3" stroke-dasharray="" marker-end="url(#a)" /><text x="600" y="836" font-size="25" text-anchor="middle" fill="#EFEEE7" font-weight="400">哪一段背景，正好能帮他继续往下读？</text><path d="M151 1010H1040" fill="none" stroke="#777C70" stroke-width="1.2" stroke-dasharray="" marker-end="url(#a)" /><g opacity="1"><rect x="302.5" y="932.0" width="125" height="156" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><path d="M326.25 972.56h77.5M326.25 997.52h77.5M326.25 1022.48h56.25" fill="none" stroke="#B0B2A8" stroke-width="1.2" stroke-dasharray="" /></g><g opacity="1"><rect x="772.5" y="932.0" width="125" height="156" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><path d="M796.25 972.56h77.5M796.25 997.52h77.5M796.25 1022.48h56.25" fill="none" stroke="#B0B2A8" stroke-width="1.2" stroke-dasharray="" /></g><text x="365" y="1144" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="500">放进第一章</text><text x="835" y="1144" font-size="27" text-anchor="middle" fill="#EFEEE7" font-weight="500">留到后面出现</text><path d="M1014 777C1165 815 1130 915 907 974" fill="none" stroke="#B0B2A8" stroke-width="1.3" stroke-dasharray="4 7" marker-end="url(#a)" /><text x="956" y="877" font-size="21" text-anchor="middle" fill="#B0B2A8" font-weight="400">暂时用不到的</text><text x="956" y="909" font-size="21" text-anchor="middle" fill="#B0B2A8" font-weight="400">可以往后移动吗？</text><text x="600" y="1203" font-size="22" text-anchor="middle" fill="#B0B2A8" font-weight="400">也试试：先从一个场景或问题进入，再回来补背景。</text><path d="M64 1246H1136" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><text x="64" y="1310" font-size="30" text-anchor="start" fill="#EFEEE7" font-weight="500">这一章结束时，我希望读者想继续追什么？</text><text x="64" y="1373" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">圆表示两类内容范围，不表示数量；交叠是待辨认的位置，不预设开篇写法。</text></g></svg>