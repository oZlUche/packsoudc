<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1440" viewBox="0 0 1200 1440" role="img" aria-labelledby="vt-title" aria-describedby="vt-desc"><title id="vt-title">修订 02 · 让“多种解释”变成可见路径</title><desc id="vt-desc">多个候选条件通向同一观察，试移除其中一个，再检查其他解释是否仍可能成立。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#EFEEE7" stroke-width="1.2" /></marker><pattern id="h" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#EFEEE7" stroke-width="1" opacity=".55" /></pattern><clipPath id="left"><circle cx="445" cy="590" r="213" /></clipPath></defs><rect width="1200" height="1440" fill="#191A18" /><g font-family="PingFang SC,Noto Sans CJK SC,Source Han Sans SC,Microsoft YaHei,Helvetica Neue,sans-serif"><text x="64" y="59" font-size="18" text-anchor="start" fill="#B0B2A8" font-weight="400">修订 02 · 让“多种解释”变成可见路径</text><text x="62" y="139" font-size="61" text-anchor="start" fill="#EFEEE7" font-weight="600">孩子半小时没动笔，</text><text x="62" y="212" font-size="61" text-anchor="start" fill="#EFEEE7" font-weight="600">要把平板收走吗？</text><text x="64" y="268" font-size="24" text-anchor="start" fill="#B0B2A8" font-weight="400">沿三条可能路径回看同一个结果，再试着拿掉其中一个条件。</text><text x="64" y="349" font-size="25" text-anchor="start" fill="#EFEEE7" font-weight="400">同一片空白，可能来自不同的路径。</text><text x="252" y="401" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">题目没弄懂？</text><circle cx="252" cy="455" r="13" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="252" y="636" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">不知怎样开始？</text><circle cx="252" cy="690" r="13" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="252" y="871" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">被平板吸引？</text><circle cx="252" cy="925" r="13" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="4 6" /><path d="M266 455C581 455 510 690 782 690" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-dasharray="5 8" marker-end="url(#a)" /><path d="M266 690H782" fill="none" stroke="#EFEEE7" stroke-width="1.8" stroke-dasharray="5 8" marker-end="url(#a)" /><path d="M266 925C364 925 412 906 455 866" fill="none" stroke="#777C70" stroke-width="1.4" stroke-dasharray="3 9" /><path d="M516 819C600 755 638 691 782 690" fill="none" stroke="#777C70" stroke-width="1.4" stroke-dasharray="3 9" marker-end="url(#a)" /><path d="M465 827L501 861M465 861L501 827" fill="none" stroke="#B0B2A8" stroke-width="1.3" stroke-dasharray="" /><circle cx="882" cy="690" r="95" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="882" y="680" font-size="31" text-anchor="middle" fill="#EFEEE7" font-weight="500">没有</text><text x="882" y="724" font-size="31" text-anchor="middle" fill="#EFEEE7" font-weight="500">动笔</text><text x="882" y="827" font-size="22" text-anchor="middle" fill="#B0B2A8" font-weight="400">我们看见的结果</text><path d="M239 945Q137 1004 230 1096" fill="none" stroke="#EFEEE7" stroke-width="1.5" stroke-dasharray="" marker-end="url(#a)" /><circle cx="175" cy="1007" r="23" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="2 6" /><circle cx="194" cy="1058" r="23" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="2 6" /><rect x="235" y="1093" width="53" height="72" fill="#191A18" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><circle cx="261" cy="1153" r="2" fill="#EFEEE7" stroke="#EFEEE7" stroke-width="1.6" stroke-dasharray="" /><text x="331" y="1134" font-size="27" text-anchor="start" fill="#EFEEE7" font-weight="500">试想：把平板移开</text><text x="600" y="1062" font-size="29" text-anchor="middle" fill="#EFEEE7" font-weight="500">其他路径，还需要检查吗？</text><text x="600" y="1194" font-size="24" text-anchor="middle" fill="#B0B2A8" font-weight="400">先找能区分这些路径的观察，再决定改变什么。</text><path d="M64 1246H1136" fill="none" stroke="#777C70" stroke-width="0.8" stroke-dasharray="" /><text x="64" y="1310" font-size="30" text-anchor="start" fill="#EFEEE7" font-weight="500">拿走一个条件，是否就解释了整件事？</text><text x="64" y="1373" font-size="19" text-anchor="start" fill="#B0B2A8" font-weight="400">虚线是候选解释；断开是脑内试摆，不代表收走平板后的真实结果。</text></g></svg>