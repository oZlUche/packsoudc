<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="2000" viewBox="0 0 3000 2000" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">有时间或坐标，就该用同一种图吗？</title><desc id="desc">40用同一时间与结果轴对照轨迹，35将事件先后与持续对齐，26用两个定义明确的维度定位对象。三图几何摘取本库对应骨架，曲线为角色示意，正式使用须按依据重画。</desc><style>text{font-family:"PingFang SC","Helvetica Neue",sans-serif}</style><rect width="3000" height="2000" fill="#191A18" data-decoration="background" /><text x="120" y="160" font-size="68" fill="#EFEEE7" text-anchor="start" font-weight="600">有时间或坐标，就该用同一种图吗？</text><text x="120" y="245" font-size="38" fill="#B0B2A8" text-anchor="start" font-weight="400">Change, sequence and position</text><text x="120" y="350" font-size="31" fill="#B0B2A8" text-anchor="start" font-weight="400">先辨认：你想看结果怎样变，事情何时发生，还是对象位于哪里。</text><text x="540" y="540" font-size="43" fill="#EFEEE7" text-anchor="middle" font-weight="500">40  同轴趋势对照</text><svg width="800" height="560" viewBox="300 700 1940 1450" role="img" x="140" y="640" preserveAspectRatio="xMidYMid meet" overflow="hidden" data-guide-for="40"><defs><marker id="time-40-arr" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.5" data-decoration="reference-geometry" /></marker></defs><rect width="2400" height="2800" fill="#191A18" data-decoration="reference-geometry" /><path d="M380 2060V730" fill="none" stroke="#EFEEE7" stroke-width="2.5" data-decoration="reference-geometry" marker-end="url(#time-40-arr)" /><path d="M380 2060H2200" fill="none" stroke="#EFEEE7" stroke-width="2.5" data-decoration="reference-geometry" marker-end="url(#time-40-arr)" /><path d="M500 1640C850 1640 1050 1240 1400 1160C1700 1090 1920 1060 2140 940" fill="none" stroke="#EFEEE7" stroke-width="4" data-decoration="reference-geometry" /><path d="M500 1690C900 1630 1150 1560 1400 1440C1700 1300 1920 1370 2140 1260" fill="none" stroke="#EFEEE7" stroke-width="4" data-decoration="reference-geometry" stroke-dasharray="16 13" /><path d="M1000 2420H2260" fill="none" stroke="#50554C" stroke-width="1.5" data-decoration="reference-geometry" /></svg><text x="540" y="1335" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="400">同一结果，随时间怎样变化？</text><text x="540" y="1410" font-size="29" fill="#B0B2A8" text-anchor="middle" font-weight="400">横轴为时间；纵轴为同一指标。</text><text x="540" y="1460" font-size="29" fill="#B0B2A8" text-anchor="middle" font-weight="400">曲线表示不同做法或对象的变化。</text><text x="540" y="1530" font-size="27" fill="#B0B2A8" text-anchor="middle" font-weight="400">单线、多线均可，不预设交叉或胜负。</text><text x="540" y="1600" font-size="29" fill="#EFEEE7" text-anchor="middle" font-weight="400">试着：换一个观察期限，判断会变吗？</text><text x="1500" y="540" font-size="43" fill="#EFEEE7" text-anchor="middle" font-weight="500">35  顺序与平行时间线</text><svg width="800" height="560" viewBox="180 520 2000 1170" role="img" x="1100" y="640" preserveAspectRatio="xMidYMid meet" overflow="hidden" data-comparison-with="35"><defs><marker id="time-35-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#EFEEE7" stroke-width="1.4" data-decoration="reference-geometry" /></marker></defs><rect width="2400" height="2200" fill="#191A18" data-decoration="reference-geometry" /><path d="M120 290H1750" stroke="#50554C" data-decoration="reference-geometry" /><path d="M500 635H2110" fill="none" stroke="#EFEEE7" stroke-width="2.2" marker-end="url(#time-35-arrow)" data-decoration="reference-geometry" /><path d="M550 650V1510" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" data-decoration="reference-geometry" /><path d="M1050 650V1510" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" data-decoration="reference-geometry" /><path d="M1550 650V1510" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" data-decoration="reference-geometry" /><path d="M2050 650V1510" fill="none" stroke="#EFEEE7" stroke-width="2.2" stroke-dasharray="7 10" data-decoration="reference-geometry" /><path d="M500 850H2110" fill="none" stroke="#EFEEE7" stroke-width="2.2" data-decoration="reference-geometry" /><path d="M500 1150H2110" fill="none" stroke="#EFEEE7" stroke-width="2.2" data-decoration="reference-geometry" /><path d="M500 1450H2110" fill="none" stroke="#EFEEE7" stroke-width="2.2" data-decoration="reference-geometry" /><circle id="time-35-a" cx="650" cy="850" r="13" fill="#EFEEE7" data-decoration="reference-geometry" /><circle id="time-35-b" cx="1550" cy="850" r="13" fill="#EFEEE7" data-decoration="reference-geometry" /><circle id="time-35-c" cx="1050" cy="1150" r="13" fill="#EFEEE7" data-decoration="reference-geometry" /><circle id="time-35-d" cx="1850" cy="1450" r="13" fill="#EFEEE7" data-decoration="reference-geometry" /><rect id="time-35-period" x="1200" y="1117" width="570" height="66" fill="#EFEEE7" data-decoration="reference-geometry" /><path d="M850 1840H2280" stroke="#50554C" data-decoration="reference-geometry" /></svg><text x="1500" y="1335" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="400">何时发生，持续多久，哪些同时进行？</text><text x="1500" y="1410" font-size="29" fill="#B0B2A8" text-anchor="middle" font-weight="400">点是时点，条是持续区间。</text><text x="1500" y="1460" font-size="29" fill="#B0B2A8" text-anchor="middle" font-weight="400">同一时间轴让多件事的先后对齐。</text><text x="1500" y="1530" font-size="27" fill="#B0B2A8" text-anchor="middle" font-weight="400">时间线不直接表达效果怎样增减。</text><text x="1500" y="1600" font-size="29" fill="#EFEEE7" text-anchor="middle" font-weight="400">试着：移走一段等待，其他安排怎样变？</text><text x="2460" y="540" font-size="43" fill="#EFEEE7" text-anchor="middle" font-weight="500">26  双维定位</text><svg width="800" height="560" viewBox="5 40 490 385" role="img" x="2060" y="640" preserveAspectRatio="xMidYMid meet" overflow="hidden" data-comparison-with="26"><defs><marker id="time-26-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5" data-decoration="reference-geometry" /></marker></defs><rect width="500" height="480" fill="#191A18" data-decoration="reference-geometry" /><path data-vt-geometry="path" data-vt-identity="43-g01" d="M75 245L437 245" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#time-26-arrow)" data-decoration="reference-geometry" /><path data-vt-geometry="path" data-vt-identity="43-g02" d="M250 390L250 87" fill="none" stroke="#C2C7BA" stroke-width="1.3" marker-end="url(#time-26-arrow)" data-decoration="reference-geometry" /><circle data-vt-geometry="circle" data-vt-identity="43-g03" cx="90" cy="100" r="20" fill="#191A18" stroke="#EEEDE5" stroke-width="2" stroke-dasharray="3 6" data-decoration="reference-geometry" /><path d="M20 477H480" stroke="#383B34" data-decoration="reference-geometry" /></svg><text x="2460" y="1335" font-size="32" fill="#EFEEE7" text-anchor="middle" font-weight="400">同一对象，在两个维度上在哪里？</text><text x="2460" y="1410" font-size="29" fill="#B0B2A8" text-anchor="middle" font-weight="400">两轴是分别定义清楚的维度。</text><text x="2460" y="1460" font-size="29" fill="#B0B2A8" text-anchor="middle" font-weight="400">点或圆对应对象在两维上的位置。</text><text x="2460" y="1530" font-size="27" fill="#B0B2A8" text-anchor="middle" font-weight="400">位置不是时间过程，不随意连成趋势。</text><text x="2460" y="1600" font-size="29" fill="#EFEEE7" text-anchor="middle" font-weight="400">试着：改一个条件，只移动相关坐标。</text><path d="M120 1740H2880" stroke="#50554C" data-decoration="separator" /><text x="2880" y="1810" font-size="40" fill="#EFEEE7" text-anchor="end" font-weight="500">趋势、先后、位置：坐标相近，承担的思考不同。</text><text x="120" y="1885" font-size="27" fill="#B0B2A8" text-anchor="start" font-weight="400">40：ONS · Line chart；形状摘自本库40／35／26，独立配辨认说明，不是外部模板。</text><text x="120" y="1940" font-size="26" fill="#B0B2A8" text-anchor="start" font-weight="400">曲线是结构示意，正式图依事实或机制重画；数据缺失不补线，机制示意不冒称实测或预测。</text></svg>