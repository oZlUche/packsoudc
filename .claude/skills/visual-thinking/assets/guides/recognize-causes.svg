r="middle">原因圆接向主干；端点是待解释结果。</text><text x="546.6666666666667" y="1210" font-size="24" fill="#B0B2A8" font-weight="400" text-anchor="middle">辨别：分支是候选，不是已证实根因。</text><text x="546.6666666666667" y="1265" font-size="27" fill="#EFEEE7" font-weight="400" text-anchor="middle">试着：找能区分两种原因的一项观察。</text></g><path d="M120 2300H2680" stroke="#50554C" data-decoration="separator" /><text x="2680" y="2374" font-size="38" fill="#EFEEE7" font-weight="500" text-anchor="end">先认关系，再选用途；同一种形状可以承担不同工作。</text><text x="120" y="2443" font-size="25" fill="#B0B2A8" font-weight="400" text-anchor="start">几何摘自本项目现有骨架并配辨认释义；非新增骨架，不改变节点、边界或连接身份。</text><text x="120" y="2490" font-size="22" fill="#B0B2A8" font-weight="400" text-anchor="start">ASQ · Fishbone · asq.org/quality-resources/fishbone；IRIS Center · Graphic Organizers</text><text x="120" y="2522" font-size="22" fill="#B0B2A8" font-weight="400" text-anchor="start">NASA · Software Fault Tree Analysis · swehb.nasa.gov · Handbook §8.07</text><text x="120" y="2554" font-size="22" fill="#B0B2A8" font-weight="400" text-anchor="start">Reason (2000) · Human error · doi:10.1136/bmj.320.7237.768；NIST · defense-in-depth</text><text x="120" y="2652" font-size="24" fill="#B0B2A8" font-weight="400" text-anchor="start">方法用途与阅读限制见配套说明；各图示意位置与大小不编码数量，不证明学习效果。</text></svg>