ometry" vector-effect="non-scaling-stroke" /><circle data-vt-geometry="circle" data-vt-identity="26-g09" cx="75" cy="345" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="26-g10" d="M98 345L155 345" fill="none" stroke="#C2C7BA" stroke-width="2.1" stroke-dasharray="3 6" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><circle data-vt-geometry="circle" data-vt-identity="26-g11" cx="425" cy="345" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="26-g12" d="M345 345L394 345" fill="none" stroke="#C2C7BA" stroke-width="2.1" stroke-dasharray="3 6" marker-end="url(#causes-26-arrow)" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="26-g13" d="M155 135L155 345" fill="none" stroke="#C2C7BA" stroke-width="2.1" stroke-dasharray="3 6" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="26-g14" d="M155 240L202 240" fill="none" stroke="#C2C7BA" stroke-width="2.1" stroke-dasharray="3 6" marker-end="url(#causes-26-arrow)" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><circle data-vt-geometry="circle" data-vt-identity="26-g15" cx="250" cy="240" r="39" fill="#191A18" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="26-g16" d="M289 240L345 240" fill="none" stroke="#C2C7BA" stroke-width="2.1" stroke-dasharray="3 6" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="26-g17" d="M345 135L345 345" fill="none" stroke="#C2C7BA" stroke-width="2.1" stroke-dasharray="3 6" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path d="M20 477H480" stroke="#383B34" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" stroke-width="2.1" /></svg><text x="1400.0" y="1080" font-size="30" fill="#EFEEE7" font-weight="400" text-anchor="middle">同一事件，之前与之后有什么关系？</text><text x="1400.0" y="1140" font-size="26" fill="#B0B2A8" font-weight="400" text-anchor="middle">中心是事件；两侧分开原因与后果。</text><text x="1400.0" y="1210" font-size="24" fill="#B0B2A8" font-weight="400" text-anchor="middle">辨别：先后发生不能直接画成因果。</text><text x="1400.0" y="1265" font-size="27" fill="#EFEEE7" font-weight="400" text-anchor="middle">试着：补一个同时变化的其他条件。</text></g><g transform="translate(303.33333333333326 0)"><text x="546.6666666666667" y="560" font-size="37" fill="#EFEEE7" font-weight="500" text-anchor="middle">16  原因主干</text><svg width="773.3333333333334" height="360" viewBox="5 40 490 385" role="img" x="160.0" y="640" preserveAspectRatio="xMidYMid meet" overflow="hidden" data-guide-for="16" data-derivation="geometric-excerpt-from-installed-skeleton"><defs><marker id="causes-18-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5" data-decoration="reference-geometry" /></marker></defs><rect width="500" height="480" fill="#191A18" data-decoration="reference-geometry" /><path data-vt-geometry="path" data-vt-identity="18-g01" d="M65 240L433 240" fill="none" stroke="#C2C7BA" stroke-width="2.1" marker-end="url(#causes-18-arrow)" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><circle data-vt-geometry="circle" data-vt-identity="18-g02" cx="450" cy="240" r="6" fill="#191A18" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><circle data-vt-geometry="circle" data-vt-identity="18-g03" cx="160" cy="125" r="23" fill="#191A18" stroke="#EEEDE5" stroke-width="2.1" da