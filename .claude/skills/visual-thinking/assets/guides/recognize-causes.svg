</svg><text x="973.3333333333335" y="1900" font-size="30" fill="#EFEEE7" font-weight="400" text-anchor="middle">一条错误，能穿过哪些检查？</text><text x="973.3333333333335" y="1960" font-size="26" fill="#B0B2A8" font-weight="400" text-anchor="middle">环是控制；开口是弱点；线追踪错误。</text><text x="973.3333333333335" y="2030" font-size="24" fill="#B0B2A8" font-weight="400" text-anchor="middle">辨别：21表示包含；本图检查失效。</text><text x="973.3333333333335" y="2085" font-size="27" fill="#EFEEE7" font-weight="400" text-anchor="middle">试着：换一层依据，路径真的被截住吗？</text></g><g transform="translate(-1403.3333333333335 820)"><text x="2253.3333333333335" y="560" font-size="37" fill="#EFEEE7" font-weight="500" text-anchor="middle">18  逆向追溯</text><svg width="773.3333333333334" height="360" viewBox="5 40 490 385" role="img" x="1866.6666666666667" y="640" preserveAspectRatio="xMidYMid meet" overflow="hidden" data-guide-for="18" data-derivation="geometric-excerpt-from-installed-skeleton"><defs><marker id="causes-45-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5" data-decoration="reference-geometry" /></marker></defs><rect width="500" height="480" fill="#191A18" data-decoration="reference-geometry" /><circle data-vt-geometry="circle" data-vt-identity="45-g01" cx="415" cy="240" r="32" fill="#EEEDE5" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="45-g02" d="M383 240L250 240" fill="none" stroke="#C2C7BA" stroke-width="2.1" stroke-dasharray="3 6" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="45-g03" d="M250 140L250 340" fill="none" stroke="#C2C7BA" stroke-width="2.1" stroke-dasharray="3 6" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="45-g04" d="M250 140L157