<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="2680" viewBox="0 0 2800 2680" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">原因、后果与失效，别画成一种关系</title><desc id="desc">四种原因关系的辨认：16候选原因，17前因后果，18逆向条件，19失效屏障。旧因果反馈回路已移除。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Helvetica Neue",sans-serif}</style><rect width="2800" height="2680" fill="#191A18" data-decoration="background" /><text x="120" y="160" font-size="68" fill="#EFEEE7" font-weight="600" text-anchor="start">原因、后果与失效，别画成一种关系</text><text x="120" y="239" font-size="38" fill="#B0B2A8" font-weight="400" text-anchor="start">Candidates, consequences, conditions and barriers</text><path d="M120 288H2350" stroke="#50554C" data-decoration="separator" /><text x="120" y="347" font-size="29" fill="#B0B2A8" font-weight="400" text-anchor="start">先问在列候选、追事件影响、倒查条件，还是检查一条错误怎样穿过控制。</text><g transform="translate(976.6666666666665 0)"><text x="973.3333333333335" y="1380" font-size="37" fill="#EFEEE7" font-weight="500" text-anchor="middle">19  分层屏障与失效路径</text><svg width="773.3333333333334" height="360" viewBox="100 820 2630 1050" role="img" x="586.6666666666667" y="1460" preserveAspectRatio="xMidYMid meet" overflow="hidden" data-guide-for="19" data-derivation="geometric-excerpt-from-installed-skeleton">
