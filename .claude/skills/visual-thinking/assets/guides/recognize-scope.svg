<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="2680" viewBox="0 0 2800 2680" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">范围、角色与情境，各有边界</title><desc id="desc">视觉辨认参考。21：同心圆是集合；小点是其中的对象。辨别：22查漏角色，不比较真假等级。22：中心是讨论对象；环带扩展角色范围。辨别：靠近中心不代表更重要。23：并列圆是同级情境；中间是它们的联系。辨别：家与学校不能画成彼此包含。24：框是观察窗口；点保留同一对象身份。辨别：21比较集合；本图改变观察范围。。几何摘自现有骨架，去除原文后配短释义；不修改正式骨架，不构成效果实验。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Helvetica Neue",sans-serif}</style><rect width="2800" height="2680" fill="#191A18" data-decoration="background" /><text x="120" y="160" font-size="68" fill="#EFEEE7" font-weight="600" text-anchor="start">范围、角色与情境，各有边界</text><text x="120" y="239" font-size="38" fill="#B0B2A8" font-weight="400" text-anchor="start">Containment, stakeholders, settings and observation scope</text><path d="M120 288H2350" stroke="#50554C" data-decoration="separator" /><text x="120" y="347" font-size="29" fill="#B0B2A8" font-weight="400" text-anchor="start">同心不自动表示重要性；同级情境并置；扩大窗口仍要保留同一对象。</text><text x="760.0" y="560" font-size="37" fill="#EFEEE7" font-weight="500" text-anchor="middle">21  嵌套范围</text><svg width="1160.0" height="360" viewBox="5 40 490 385" role="img" x="180.0" y="640" preserveAspectRatio="xMidYMid meet" overflow="hidden" data-guide-for="21" data-derivation="geometric-excerpt-from-installed-skeleton"><defs><marker id="scope-10-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5" data-decoration="reference-geometry" /></marker></defs><rect width="500" height="480" fill="#191A18" data-decoration="reference-geometry" /><circle data-vt-geometry="circle" data-vt-identity="10-g01" cx="250" cy="240" r="137" fill="#191A18" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><circle data-vt-geometry="circle" data-vt-identity="1