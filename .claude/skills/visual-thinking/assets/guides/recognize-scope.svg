</svg><text x="760.0" y="1900" font-size="30" fill="#EFEEE7" font-weight="400" text-anchor="middle">同一个人在不同情境，为何不同？</text><text x="760.0" y="1960" font-size="26" fill="#B0B2A8" font-weight="400" text-anchor="middle">并列圆是同级情境；中间是它们的联系。</text><text x="760.0" y="2030" font-size="24" fill="#B0B2A8" font-weight="400" text-anchor="middle">辨别：家与学校不能画成彼此包含。</text><text x="760.0" y="2085" font-size="27" fill="#EFEEE7" font-weight="400" text-anchor="middle">试着：比较条件，再追查间接影响。</text><text x="2040.0" y="1380" font-size="37" fill="#EFEEE7" font-weight="500" text-anchor="middle">24  扩大观察尺度</text><svg width="1160.0" height="360" viewBox="5 40 490 385" role="img" x="1460.0" y="1460" preserveAspectRatio="xMidYMid meet" overflow="hidden" data-guide-for="24" data-derivation="geometric-excerpt-from-installed-skeleton"><defs><marker id="scope-42-arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M2 2L10 6L2 10" fill="none" stroke="#C2C7BA" stroke-width="1.5" data-decoration="reference-geometry" /></marker></defs><rect width="500" height="480" fill="#191A18" data-decoration="reference-geometry" /><rect data-vt-geometry="rect" data-vt-identity="42-g01" x="30" y="185" width="100" height="100" fill="none" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><circle data-vt-geometry="circle" data-vt-identity="42-g02" cx="80" cy="235" r="6" fill="#EEEDE5" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="42-g03" d="M140 235L192 235" fill="none" stroke="#C2C7BA" stroke-width="2.1" stroke-dasharray="3 6" marker-end="url(#scope-42-arrow)" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><rect data-vt-geometry="rect" data-vt-identity="42-g04" x="205" y="105" width="255" height="280" fill="none" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><circle data-vt-geometry="circle" data-vt-identity="42-g05" cx="290" cy="235" r="6" fill="#EEEDE5" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><circle data-vt-geometry="circle" data-vt-identity="42-g06" cx="390" cy="160" r="24" fill="#191A18" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="42-g07" d="M290 235L323.0 235.0A12 12 0 0 0 335.0 223.0L335.0 171.5A11.5 11.5 0 0 1 346.5 160.0L358 160" fill="none" stroke="#C2C7BA" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><circle data-vt-geometry="circle" data-vt-identity="42-g08" cx="390" cy="310" r="24" fill="#191A18" stroke="#EEEDE5" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="42-g09" d="M290 235L323.0 235.0A12 12 0 0 1 335.0 247.0L335.0 298.5A11.5 11.5 0 0 0 346.5 310.0L358 310" fill="none" stroke="#C2C7BA" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path d="M20 477H480" stroke="#383B34" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" stroke-width="2.1" /></svg><text x="2040.0" y="1900" font-size="30" fill="#EFEEE7" font-weight="400" text-anchor="middle">扩大时间或空间，局部判断还成立吗？</text><text x="2040.0" y="1960" font-size="26" fill="#B0B2A8" font-weight="400" text-anchor="middle">框是观察窗口；点保留同一对象身份。</text><text x="2040.0" y="2030" font-size="24" fill="#B0B2A8" font-weight="400" text-anchor="middle">辨别：21比较集合；本图改变观察范围。</text><text x="2040.0" y="2085" font-size="27" fill="#EFEEE7" font-weight="400" text-anchor="middle">试着：把窗口外的等待和收尾接回来。</text><path d="M120 2300H2680" stroke="#50554C" data-decoration="separator" /><text x="2680" y="2374" font-size="38" fill="#EFEEE7" font-weight="500" text-anchor="end">先认关系，再选用途；同一种形状可以承担不同工作。</text><text x="120" y="2443" font-size="25" fill="#B0B2A8" font-weight="400" text-anchor="start">几何摘自本项目现有骨架并配辨认释义；非新增骨架，不改变节点、边界或连接身份。</text><text x="120" y="2490" font-size="22" fill="#B0B2A8" font-weight="400" text-anchor="start">Kent · Euler diagrams；Alexander (2004) · scenarioplus.org.uk/papers/stakeholders/a_better_fit.htm</text><text x="120" y="2522" font-size="22" fill="#B0B2A8" font-weight="400" text-anchor="start">Bronfenbrenner (1977) · doi:10.1037/0003-066X.32.7.513</text><text x="120" y="2554" font-size="22" fill="#B0B2A8" font-weight="400" text-anchor="start">24为自主观察边界操作；相关整体依赖实践见Gibbons (2017) · Service Blueprints。</text><text x="120" y="2652" font-size="24" fill="#B0B2A8" font-weight="400" text-anchor="start">方法用途与阅读限制见配套说明；各图示意位置与大小不编码数量，不证明学习效果。</text></svg>