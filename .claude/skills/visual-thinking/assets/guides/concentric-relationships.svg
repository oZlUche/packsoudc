<text x="2680" y="2235" font-size="43" font-weight="500" fill="var(--vt-ink)" text-anchor="end">同心只是画法；边界、路径与尺度才决定怎样思考。</text>
<text x="120" y="2308" font-size="21" font-weight="400" fill="var(--vt-muted)" text-anchor="start">[1] Kent · Euler diagrams · cs.kent.ac.uk/events/conf/2004/euler/eulerdiagrams.html</text>
<text x="120" y="2340" font-size="21" font-weight="400" fill="var(--vt-muted)" text-anchor="start">[2] Alexander (2004) · Stakeholders · scenarioplus.org.uk/papers/stakeholders/a_better_fit.htm</text>
<text x="120" y="2372" font-size="21" font-weight="400" fill="var(--vt-muted)" text-anchor="start">[3,4] Bronfenbrenner (1977) · doi:10.1037/0003-066X.32.7.513；CDC (2025) · Social-Ecological Model</text>
<text x="120" y="2404" font-size="21" font-weight="400" fill="var(--vt-muted)" text-anchor="start">[5–7] Reason (2000) · doi:10.1136/bmj.320.7237.768；NIST · Defense-in-depth / SP 800-207</text>
<text x="120" y="2436" font-size="21" font-weight="400" fill="var(--vt-muted)" text-anchor="start">[8] Mapbox · Isochrone API · docs.mapbox.com/api/navigation/isochrone/</text>
<text x="120" y="2468" font-size="21" font-weight="400" fill="var(--vt-muted)" text-anchor="start">[9,10] D3 · Partition / Pack；Stasko et al. (2000) · doi:10.1006/ijhc.2000.0420</text>
<text x="120" y="2520" font-size="23" font-weight="400" fill="var(--vt-muted)" text-anchor="start">用途区分，非穷尽分类；小图仅示意关系，无实测数量或地图数据。完整来源及限制见配套分层研究。</text>
