<svg xmlns="http://www.w3.org/2000/svg" width="2800" height="2550" viewBox="0 0 2800 2550" role="img" aria-labelledby="title" aria-describedby="desc">
<title id="title">相似的圆图，究竟在表达什么？</title>
<desc id="desc">本轮工作分类的六种关系：嵌套集合、利益相关者参与范围、生态情境与联系、多层屏障、累计可达阈值、径向层级。六个小图均为自主几何示意，不是官方模板或数量数据。区分每层含义、可做的判断和不适用条件；本图不是穷尽的圆图分类。</desc>
<style data-vt-theme="">:root{--vt-bg:#191A18;--vt-ink:#EFEEE7;--vt-muted:#B0B2A8;--vt-accent:#EFEEE7;--vt-surface:#272925;--vt-secondary:#383B34;--vt-line:1.8;}text{font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Helvetica Neue",sans-serif}</style>
<defs><marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2L10 6L2 10" fill="none" stroke="var(--vt-ink)" stroke-width="1.5"/></marker></defs>
<rect width="2800" height="2550" fill="var(--vt-bg)" data-decoration="background"/>
<text x="120" y="160" font-size="76" font-weight="600" fill="var(--vt-ink)" text-anchor="start">相似的圆图，究竟在表达什么？</text>
<text x="120" y="239" font-size="40" font-weight="400" fill="var(--vt-muted)" text-anchor="start">Similar circles, different thinking tasks</text>
<path data-decoration="annotation" d="M120 288H2350" fill="none" stroke="var(--vt-muted)" stroke-width="1.5"/>
<text x="120" y="347" font-size="30" font-weight="400" fill="var(--vt-muted)" text-anchor="start">先辨认每层增加了什么关系，再决定能否使用同心圆。</text>
<text x="520" y="560" font-size="42" font-weight="500" fill="var(--vt-ink)" text-anchor="middle">包含</text>
<text x="520" y="1065" font-size="33" font-weight="400" fill="var(--vt-ink)" text-anchor="middle">对象属于哪一层？</text>
<text x="520" y="1122" font-size="27" font-weight="400" fill="var(--vt-muted)" text-anchor="middle">集合必须真实包含。[1]</text>
<text x="1400" y="560" font-size="42" font-weight="500" fill="var(--vt-ink)" text-anchor="middle">参与范围</text>
<text x="1400" y="1065" font-size="33" font-weight="400" fill="var(--vt-ink)" text-anchor="middle">还漏掉了谁的诉求？</text>
<text x="1400" y="1122" font-size="27" font-weight="400" fill="var(--vt-muted)" text-anchor="middle">圈距不是重要性。[2]</text>
<text x="2280" y="560" font-size="42" font-weight="500" fill="var(--vt-ink)" text-anchor="middle">生态情境</text>
<text x="2280" y="1065" font-size="33" font-weight="400" fill="var(--vt-ink)" text-anchor="middle">哪些条件随情境改变？</text>
<text x="2280" y="1122" font-size="27" font-weight="400" fill="var(--vt-muted)" text-anchor="middle">同级情境与联系要可见。[3,4]</text>
<text x="520" y="1340" font-size="42" font-weight="500" fill="var(--vt-ink)" text-anchor="middle">屏障</text>
<text x="520" y="1845" font-size="33" font-weight="400" fill="var(--vt-ink)" text-anchor="middle">这条错误能穿过哪些层？</text>
<text x="520" y="1902" font-size="27" font-weight="400" fill="var(--vt-muted)" text-anchor="middle">数量不等于独立防护。[5–7]</text>
<text x="1400" y="1340" font-size="42" font-weight="500" fill="var(--vt-ink)" text-anchor="middle">累计可达</text>
<text x="1400" y="1845" font-size="33" font-weight="400" fill="var(--vt-ink)" text-anchor="middle">改阈值，哪些对象被纳入？</text>
<text x="1400" y="1902" font-size="27" font-weight="400" fill="var(--vt-muted)" text-anchor="middle">真实范围需要相应数据。[8]</text>
<text x="2280" y="1340" font-size="42" font-weight="500" fill="var(--vt-ink)" text-anchor="middle">径向层级</text>
<text x="2280" y="1845" font-size="33" font-weight="400" fill="var(--vt-ink)" text-anchor="middle">父子分支如何组成整体？</text>
<text x="2280" y="1902" font-size="27" font-weight="400" fill="var(--vt-muted)" text-anchor="middle">分区可编码数量，须明口径。[9,10]</text>
