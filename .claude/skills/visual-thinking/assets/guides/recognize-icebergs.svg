<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1800" viewBox="0 0 2400 1800" role="img" aria-labelledby="title" aria-describedby="desc"><title id="title">同一座冰山，探索的内容不同</title><desc id="desc">视觉辨认参考。37：冰山跨可见边界；水下是待了解背景。辨别：不是人格测量或更深的真相。38：冰山组织片段、原材料、语境与缺口。辨别：37探索表现；本图查证事件信息。。几何摘自现有骨架，去除原文后配短释义；不修改正式骨架，不构成效果实验。</desc><style>text{font-family:"PingFang SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Helvetica Neue",sans-serif}</style><rect width="2400" height="1800" fill="#191A18" data-decoration="background" /><text x="120" y="160" font-size="68" fill="#EFEEE7" font-weight="600" text-anchor="start">同一座冰山，探索的内容不同</text><text x="120" y="239" font-size="38" fill="#B0B2A8" font-weight="400" text-anchor="start">Observed performance and information context</text><path d="M120 288H1950" stroke="#50554C" data-decoration="separator" /><text x="120" y="347" font-size="29" fill="#B0B2A8" font-weight="400" text-anchor="start">水下只表示当前未见或待了解的范围，不自动更真实、更重要或更有决定性。</text><text x="660.0" y="560" font-size="37" fill="#EFEEE7" font-weight="500" text-anchor="middle">37  冰山模型</text><svg width="960.0" height="360" viewBox="80 300 1240 770" role="img" x="180.0" y="640" preserveAspectRatio="xMidYMid meet" overflow="hidden" data-guide-for="37" data-derivation="geometric-excerpt-from-installed-skeleton"><defs><clipPath id="icebergs-49-ice"><path d="M435 520L560 330L685 520L830 650L760 890L545 1040L305 865L255 665Z" data-decoration="reference-geometry" /></clipPath></defs><rect width="1400" height="1360" fill="#191C17" data-decoration="reference-geometry" /><path data-vt-geometry="path" data-vt-identity="49-g01" d="M820 172H1310" fill="none" stroke="#51574B" stroke-width="2.1" data-decoration="reference-geometry" vector-effect="non-scaling-stroke" /><path data-vt-geometry="path" data-vt-identity="49-g02" d="M435 520L560 330L685 520L830 650L760 890L545 1040L305 865L255 665Z" fill="none" stroke="#EEEFE7" stroke-width="2.1" data-decoration="reference-geometry" vector-effe